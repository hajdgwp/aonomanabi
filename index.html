    function getEngRecord(wordNo) {
      const r = state.engProgress.records[wordNo];
      if (!r) return { attempts: 0, correct: 0, wrong: 0, needsReview: false, lastWrongAt: null };
      return {
        attempts: r.attempts || 0,
        correct: r.correct || 0,
        wrong: r.wrong || 0,
        needsReview: typeof r.needsReview === 'boolean' ? r.needsReview : (r.wrong || 0) > 0,
        lastWrongAt: r.lastWrongAt || null
      };
    }

    function getEngWrongNos() {
      return WORDS.filter(w => getEngRecord(w.n).needsReview).map(w => w.n);
    }

    function getEngCandidates(scope) {
      if (scope === 'all') return [...WORDS];
      if (scope === 'wrong') return WORDS.filter(w => getEngRecord(w.n).needsReview);
      if (scope === 'unattempted') return WORDS.filter(w => getEngRecord(w.n).attempts === 0);
      return WORDS.filter(w => getSectionId(w.n) === scope);
    }

    function isPhraseEntry(w) {
      return /[\s~\[\(\/]/.test(w.e);
    }

    function detectPosGroup(w) {
      const j = w.j.split('，')[0].split('、')[0].trim();
      if (isPhraseEntry(w)) {
        if (/(する|る|く|ぐ|す|つ|ぬ|ぶ|む|う|いる|ある)$/.test(j)) return 'phrase_verb';
        return 'phrase_other';
      }
      if (/(する|られる|させる|える|いる|ある|る|く|ぐ|す|つ|ぬ|ぶ|む|う)$/.test(j) && !/(ところ|もの|こと|ため|よう|とき|ほう|ぶり|さ|み|ず|くず|みず)$/.test(j)) {
        return 'verb';
      }
      if (/(い|な|の|的|した|った)$/.test(j) && !/(あい|かい|さい|たい|ない|はい|まい|やい|らい|わい|もの|こと|の|のう)$/.test(j)) {
        return 'adj';
      }
      if (/(に|で|と|へ|まで|から|より|ので|のに|ながら|じゅう|ずつ|ほど|ばかり|だけ|しか)$/.test(j)) {
        return 'adv_prep';
      }
      return 'noun';
    }

    function scoreDistractor(target, cand, targetPos, targetPhrase, targetSec) {
      let score = 0;
      if (isPhraseEntry(cand) !== targetPhrase) return -1000;
      if (detectPosGroup(cand) === targetPos) score += 60;
      if (getSectionId(cand.n) === targetSec) score += 18;

      const tEn = target.e.toLowerCase();
      const cEn = cand.e.toLowerCase();

      if (targetPhrase) {
        const tFirst = tEn.split(/\s+/)[0];
        const cFirst = cEn.split(/\s+/)[0];
        if (tFirst === cFirst) score += 45;
        const tTokens = new Set(tEn.split(/[^a-z]+/).filter(Boolean));
        for (const tok of cEn.split(/[^a-z]+/).filter(Boolean)) {
          if (tok.length >= 2 && tTokens.has(tok)) score += 12;
        }
      } else {
        if (tEn[0] === cEn[0]) score += 26;
        if (tEn.slice(0, 2) === cEn.slice(0, 2)) score += 18;
        if (tEn.slice(0, 3) === cEn.slice(0, 3)) score += 15;
        if (tEn.length >= 4 && cEn.length >= 4 && tEn.slice(-3) === cEn.slice(-3)) score += 20;
        else if (tEn.length >= 3 && cEn.length >= 3 && tEn.slice(-2) === cEn.slice(-2)) score += 10;
        const lenDiff = Math.abs(tEn.length - cEn.length);
        if (lenDiff <= 1) score += 12;
        else if (lenDiff <= 2) score += 6;
      }

      if (Math.abs(target.j.length - cand.j.length) <= 2) score += 8;
      const tKanji = target.j.match(/[\u4e00-\u9faf]/g) || [];
      for (const k of tKanji) {
        if (cand.j.includes(k)) { score += 16; break; }
      }
      score += Math.random() * 16;
      return score;
    }

    function generate8Choices(targetWord) {
      const targetSec = getSectionId(targetWord.n);
      const targetPos = detectPosGroup(targetWord);
      const targetPhrase = isPhraseEntry(targetWord);
      const scored = WORDS
        .filter(w => w.n !== targetWord.n)
        .map(w => ({ w, score: scoreDistractor(targetWord, w, targetPos, targetPhrase, targetSec) }))
        .sort((a, b) => b.score - a.score);

      const usedTexts = new Set([state.engDirection === 'en2ja' ? targetWord.j : targetWord.e]);
      const distractors = [];
      for (const item of scored) {
        const label = state.engDirection === 'en2ja' ? item.w.j : item.w.e;
        if (!usedTexts.has(label)) {
          usedTexts.add(label);
          distractors.push(item.w);
          if (distractors.length === 7) break;
        }
      }
      return shuffleArray([targetWord, ...distractors]);
    }

    function startEngQuiz(overrideScope = null) {

    function getGeoRegionInfo(regId) {
      return GEO_REGIONS.find(r => r.id === regId) || { id: regId, scope: 'world', name: regId, short: regId, color: 'bg-slate-100 text-slate-700 border-slate-200' };

      const r = state.geoProgress.records[qId];

      return {
        attempts: r.attempts || 0,

        wrong: r.wrong || 0,

      };
    }

    function getGeoWrongIds() {
      return GEO_DATA.filter(g => getGeoRecord(g.id).needsReview).map(g => g.id);
    }

    function getGeoCandidates(scope) {
      if (scope === 'all') return [...GEO_DATA];
      if (scope === 'world') return GEO_DATA.filter(g => g.scope === 'world');
      if (scope === 'japan') return GEO_DATA.filter(g => g.scope === 'japan');
      if (scope === 'wrong') return GEO_DATA.filter(g => getGeoRecord(g.id).needsReview);
      if (scope === 'unattempted') return GEO_DATA.filter(g => getGeoRecord(g.id).attempts === 0);
      return GEO_DATA.filter(g => g.region === scope);
    }

    const GEO_RELATED_CATS = {
      island_geo: ['landform', 'region_feat'],
      pref_city: ['country', 'region_feat'],
      country: ['pref_city', 'region_feat'],
      religion_lang: ['region_feat', 'country'],
      map_coord: ['climate', 'landform'],
      climate: ['agri', 'landform'],
      agri: ['industry', 'climate'],
      industry: ['agri', 'region_feat'],
      landform: ['island_geo', 'region_feat'],
      region_feat: ['landform', 'pref_city', 'country']
    };

    const GEO_SUFFIXES = ['図法', '気候', '山脈', '平野', '盆地', '川', '島', '海流', '風', '農業', '工業地帯', '工業地域', '教', '語', '県', '市', '海峡', '運河', '線'];

    function scoreGeoDistractor(target, cand) {
      let score = 0;
      if (cand.cat === target.cat) score += 100;
      else if ((GEO_RELATED_CATS[target.cat] || []).includes(cand.cat)) score += 40;
      if (cand.scope === target.scope) score += 25;
      if (cand.region === target.region) score += 8;
      for (const suf of GEO_SUFFIXES) {
        if (target.a.endsWith(suf) && cand.a.endsWith(suf)) { score += 32; break; }
      }
      if (Math.abs(target.a.length - cand.a.length) <= 2) score += 12;
      score += Math.random() * 14;
      return score;
    }

    function generateGeo8Choices(targetQ) {
      if (Array.isArray(targetQ.d) && targetQ.d.length >= 7) {
        const list = [{ a: targetQ.a }, ...targetQ.d.slice(0, 7).map(text => ({ a: text }))];
        return shuffleArray(list);
      }
      const scored = GEO_DATA
        .filter(g => g.id !== targetQ.id && g.a !== targetQ.a)
        .map(g => ({ g, score: scoreGeoDistractor(targetQ, g) }))
        .sort((a, b) => b.score - a.score);

      const usedAnswers = new Set([targetQ.a]);
      const distractors = [];
      for (const item of scored) {
        if (!usedAnswers.has(item.g.a)) {
          usedAnswers.add(item.g.a);
          distractors.push(item.g);
          if (distractors.length === 7) break;

      }
      return shuffleArray([targetQ, ...distractors]);
    }

    function nextGeoQuestion() {

    // ==========================================

    function getHistQaUnitInfo(unitId) {
      return HQA_UNITS.find(u => u.id === unitId) || { id: unitId, name: unitId, short: unitId, color: 'bg-slate-100 text-slate-700 border-slate-200' };

    function getHistQaWrongIds() {

    function getHistQaCandidates(scope) {

      if (scope === 'unattempted') return HISTQA_DATA.filter(q => getHistQaRecord(q.id).attempts === 0);
      return HISTQA_DATA.filter(q => q.u === scope);
    }

    const HQA_SUFFIXES = ['条約', 'の乱', 'の戦い', 'の変', 'の役', '改革', '憲法', '文化', '一揆', '同盟', '奉行', '幕府', '天皇', '上皇', '法', '令', '書', '記', '寺', '城', '遺跡', '土器', '器', '氏', '藩', '教', '宗', '党', '会', '事件', '会議', '宣言', '主義', '運動', '制度', '時代', '戦争'];

    function scoreHistQaDistractor(target, cand) {
      let score = 0;
      if (cand.c === target.c) score += 160;
      const uDiff = Math.abs(Number(cand.u) - Number(target.u));
      if (uDiff === 0) score += 35;
      else if (uDiff <= 2) score += 22;
      else if (uDiff <= 4) score += 10;

      for (const suf of HQA_SUFFIXES) {
        if (target.t.endsWith(suf) && cand.t.endsWith(suf)) { score += 45; break; }
      }
      if (Math.abs(target.t.length - cand.t.length) <= 2) score += 10;
      score += Math.random() * 14;
      return score;
    }

    function generateHistQa8Choices(targetItem) {
      const isDesc2Term = state.histQaDirection === 'desc2term';
      const scored = HISTQA_DATA
        .filter(item => item.id !== targetItem.id && item.t !== targetItem.t && item.d !== targetItem.d)
        .map(item => ({ item, score: scoreHistQaDistractor(targetItem, item) }))
        .sort((a, b) => b.score - a.score);

      const usedLabels = new Set([isDesc2Term ? targetItem.t : targetItem.d]);
      const distractors = [];
      for (const entry of scored) {
        const label = isDesc2Term ? entry.item.t : entry.item.d;
        if (!usedLabels.has(label)) {
          usedLabels.add(label);
          distractors.push(entry.item);
          if (distractors.length === 7) break;
        }
      }
      return shuffleArray([targetItem, ...distractors]);
    }

    function startHistQaQuiz(overrideScope = null) {

                        <span class="text-xs font-bold px-2.5 py-1 rounded-full ${wrongCount > 0 ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'}">${m.sub}</span>
                      </button>
                      <button type="button" data-reset-wrong-only="1" ${wrongCount === 0 ? 'disabled' : ''}
                        class="shrink-0 px-3 rounded-xl border text-xs font-bold transition ${wrongCount > 0 ? 'border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100' : 'border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed'}">
                        リセット
                      </button>
                    </div>
                  `;
                }
                return `
                  <button type="button" data-hist-unit="${m.id}" ${m.disabled ? 'disabled' : ''}
                    class="w-full flex items-center justify-between px-4 py-3 rounded-xl border text-left transition ${borderClass} ${disabledClass}">
                    <span class="font-bold text-sm text-slate-800">${m.label}</span>
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">${m.sub}</span>
                  </button>
                `;
              }).join('')}
            </div>
            <p class="text-[11px] font-semibold text-slate-400 mb-2 px-1">単元ごとに集中練習</p>
            <div class="grid grid-cols-2 gap-2">
              ${UNITS.map(u => {
                const count = QUESTIONS.filter(q => q.unit === u.id).length;
                const active = state.histUnit === u.id;
                return `
                  <button type="button" data-hist-unit="${u.id}"
                    class="px-3 py-2.5 rounded-xl border text-left transition ${active ? 'border-indigo-600 bg-indigo-50 ring-2 ring-indigo-600/20' : 'border-slate-200 bg-white hover:border-slate-300'}">
                    <div class="text-xs font-bold text-slate-800 truncate">${u.short}</div>
                    <div class="text-[11px] text-slate-500 mt-0.5">${count}問</div>
                  </button>
                `;
              }).join('')}
            </div>
          </section>
          <section>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5 px-1">2. 出題数を選ぶ</h3>
            <div class="grid grid-cols-3 gap-2">
              ${[10, 20, 'all'].map(limit => {
                const active = String(state.histLimit) === String(limit);
                const label = limit === 'all' ? `すべて (${modeCandidates.length}問)` : `${limit}問`;
                return `
                  <button type="button" data-hist-limit="${limit}"
                    class="py-2.5 px-2 rounded-xl border text-xs font-bold transition ${active ? 'border-indigo-600 bg-indigo-600 text-white shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
                    ${label}
                  </button>
                `;
              }).join('')}
            </div>
          </section>
          <button type="button" id="btn-start-hist"
            class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-extrabold text-base shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2">
            <span>ランダム出題スタート</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
          </button>
        </div>
      `;
    }

    function renderHistPlaying() {
      const q = state.histQueue[state.histIndex];
      const unitInfo = getHistUnitInfo(q.unit);
      const rec = getHistRecord(q.id);
      const progressPct = (state.histIndex / state.histQueue.length) * 100;
      const digitsHtml = [0, 1, 2, 3].map(idx => {
        const ch = state.histInputYear[idx] || '';
        const isCurrent = idx === state.histInputYear.length;
        return `
          <div class="w-14 h-16 rounded-xl border-2 flex items-center justify-center text-3xl font-extrabold transition
            ${ch ? 'border-indigo-600 bg-indigo-50 text-indigo-950' : isCurrent ? 'border-indigo-400 bg-white ring-2 ring-indigo-200' : 'border-slate-200 bg-white text-slate-300'}">
            ${ch || '·'}
          </div>
        `;
      }).join('');
      return `
        <div class="flex flex-col gap-3.5">
          <div class="flex items-center justify-between gap-3">
            <button type="button" id="btn-quit-hist" class="text-xs font-semibold text-slate-500 hover:text-slate-800 px-2 py-1 rounded-lg bg-slate-200/70">← やめる</button>
            <div class="flex-1 h-2 bg-slate-200 rounded-full overflow-hidden">
              <div class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>
            <span class="text-xs font-bold text-slate-600 tabular-nums">${state.histIndex + 1} / ${state.histQueue.length}</span>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${unitInfo.color}">${escapeHtml(unitInfo.name)}</span>
              ${rec.wrong > 0 ? `<span class="text-[11px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full">過去の誤答 ${rec.wrong}回</span>` : ''}
            </div>
            <h2 class="text-lg font-extrabold text-slate-900 leading-snug min-h-[3.2rem] flex items-center">${escapeHtml(q.event)}</h2>
            <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between">
              ${state.histShowHint
                ? `<p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1.5 w-full">💡 ${escapeHtml(q.hint)}</p>`
                : `<button type="button" id="btn-hist-hint" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">💡 ヒントを見る</button>
                   <button type="button" id="btn-hist-pass" class="text-xs font-semibold text-slate-400 hover:text-rose-600">わからない（パス）</button>`}
            </div>
          </div>
          <div class="flex flex-col items-center py-1">
            <div class="flex items-center gap-2.5">${digitsHtml}<span class="text-lg font-bold text-slate-600 ml-0.5">年</span></div>
          </div>
          <div class="grid grid-cols-3 gap-2 select-none">
            ${['1','2','3','4','5','6','7','8','9'].map(n => `
              <button type="button" data-key="${n}" class="keypad-btn py-3 rounded-xl bg-white border border-slate-200 shadow-xs text-xl font-bold text-slate-800 hover:bg-slate-50">${n}</button>
            `).join('')}
            <button type="button" id="btn-clear-input" class="keypad-btn py-3 rounded-xl bg-slate-200/80 text-sm font-bold text-slate-700 hover:bg-slate-300">クリア</button>
            <button type="button" data-key="0" class="keypad-btn py-3 rounded-xl bg-white border border-slate-200 shadow-xs text-xl font-bold text-slate-800 hover:bg-slate-50">0</button>
            <button type="button" id="btn-backspace" class="keypad-btn py-3 rounded-xl bg-slate-200/80 text-base font-bold text-slate-700 hover:bg-slate-300 flex items-center justify-center">⌫</button>
          </div>
          <button type="button" id="btn-submit-hist"
            class="w-full py-3.5 rounded-xl font-extrabold text-base transition shadow-md ${state.histInputYear.length === 4 ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-600/25' : 'bg-slate-300 text-slate-500'}">
            回答する
          </button>
        </div>
      `;
    }

    function renderHistFeedback() {
      const { isCorrect, userAnswer, question } = state.histLastResult;
      const unitInfo = getHistUnitInfo(question.unit);
      const isLast = state.histIndex + 1 >= state.histQueue.length;
      return `
        <div class="space-y-4 animate-pop">
          <div class="rounded-2xl p-5 text-center border-2 ${isCorrect ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full mb-2 text-2xl ${isCorrect ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}">
              ${isCorrect ? '○' : '✕'}
            </div>
            <h2 class="text-xl font-extrabold ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}">
              ${isCorrect ? '正解！' : (userAnswer === 'パス' ? 'パス（記録しました）' : '不正解…')}
            </h2>
            <div class="mt-3 flex items-center justify-center gap-4 text-sm">
              <div><span class="text-xs text-slate-500 block">正解の年号</span><span class="text-2xl font-extrabold text-slate-900 tabular-nums">${question.year}年</span></div>
              ${!isCorrect ? `<div class="h-8 w-px bg-rose-200"></div><div><span class="text-xs text-slate-500 block">あなたの回答</span><span class="text-lg font-bold text-rose-700 tabular-nums">${escapeHtml(userAnswer)}${userAnswer === 'パス' ? '' : '年'}</span></div>` : ''}
            </div>
            ${!isCorrect ? `
              <div class="mt-3.5 p-3 rounded-xl bg-amber-50 border border-amber-200 text-left">
                <div class="text-[10px] font-extrabold text-amber-700 uppercase tracking-wider mb-0.5">💡 語呂合わせで覚える</div>
                <p class="text-sm font-bold text-amber-950 leading-snug">${escapeHtml(getGoro(question))}</p>
              </div>
            ` : ''}
            <div class="mt-3 pt-2.5 border-t ${isCorrect ? 'border-emerald-200/70' : 'border-rose-200/70'} text-xs font-bold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">
              ${!isCorrect ? `📌 「間違えた問題だけ」に追加しました（現在 ${state.histLastResult.wrongTotalAfter}問）` : (state.histLastResult.wasReview ? `✨ 「間違えた問題だけ」から外れました！（残り ${state.histLastResult.wrongTotalAfter}問）` : `現在の「間違えた問題だけ」：${state.histLastResult.wrongTotalAfter}問`)}
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-2.5">
            <span class="inline-block text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${unitInfo.color}">${escapeHtml(unitInfo.name)}</span>
            <h3 class="text-base font-bold text-slate-900 leading-snug">${escapeHtml(question.event)}</h3>
            <p class="text-sm text-slate-600 leading-relaxed bg-slate-50 rounded-xl p-3 border border-slate-100">${escapeHtml(question.detail)}</p>
          </div>
          <button type="button" id="btn-next-hist" class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-base shadow-lg shadow-indigo-600/25 transition">
            ${isLast ? '結果を見る' : '次の問題へ →'}
          </button>
        </div>
      `;
    }

    function renderHistSummary() {
      const total = state.histResults.length;
      const correct = state.histResults.filter(r => r.isCorrect).length;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      const wrongList = state.histResults.filter(r => !r.isCorrect);
      return `
        <div class="space-y-4 animate-pop">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 text-center shadow-sm">
            <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider">今回の結果（歴史年号）</p>
            <div class="my-3 flex items-baseline justify-center gap-1">
              <span class="text-5xl font-extrabold text-slate-900 tabular-nums">${correct}</span>
              <span class="text-lg font-bold text-slate-400">/ ${total}問</span>
            </div>
            <div class="inline-block px-3.5 py-1 rounded-full text-sm font-bold ${pct >= 80 ? 'bg-emerald-100 text-emerald-800' : pct >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}">正答率 ${pct}%</div>
          </div>
          ${wrongList.length > 0 ? `
            <div class="bg-white rounded-2xl border border-rose-200 p-4 shadow-sm space-y-2.5">
              <h3 class="text-sm font-bold text-rose-800">今回間違えた問題 (${wrongList.length}問)</h3>
              ${wrongList.map(item => {
                const q = QUESTIONS.find(x => x.id === item.id);
                if (!q) return '';
                return `
                  <div class="p-3 rounded-xl bg-rose-50/60 border border-rose-100">
                    <div class="flex items-center justify-between gap-2 mb-1">
                      <span class="text-sm font-extrabold text-rose-700">${q.year}年</span>
                      <span class="text-[11px] text-slate-500">回答: ${escapeHtml(item.userAnswer)}${item.userAnswer === 'パス' ? '' : '年'}</span>
                    </div>
                    <p class="text-xs font-bold text-slate-800">${escapeHtml(q.event)}</p>
                    <p class="text-[11px] text-amber-800 mt-1">💡 ${escapeHtml(getGoro(q))}</p>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `<div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center text-sm font-bold text-emerald-800">🎉 全問正解です！</div>`}
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" id="btn-retry-hist" class="py-3.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 shadow-md">もう1回ランダム</button>
            <button type="button" id="btn-back-hist" class="py-3.5 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50">設定に戻る</button>
          </div>
        </div>
      `;
    }

    function renderSaveSection(code, placeholder) {
      return `
        <section class="bg-white rounded-2xl border border-indigo-200 p-4 shadow-xs space-y-3">
          <div>
            <h3 class="text-sm font-bold text-slate-800">💾 オートセーブ・引き継ぎ（セーブコード）</h3>
            <p class="text-[11px] text-slate-500 mt-1 leading-relaxed">
              既存のセーブデータ（JHQ1 / T12K1）やファイルもそのまま読み込んで使えます。
            </p>
          </div>
          <div class="flex gap-2">
            <input id="savecode-display" type="text" readonly value="${escapeHtml(code)}"
              class="flex-1 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono text-slate-600 select-all" />
            <button type="button" data-copy-savecode="1" class="shrink-0 px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition">コピー</button>
          </div>
          <div class="pt-2 border-t border-slate-100">
            <label for="savecode-input" class="block text-[11px] font-bold text-slate-600 mb-1.5">セーブコードから復元する</label>
            <div class="flex gap-2">
              <input id="savecode-input" type="text" placeholder="${placeholder}"
                class="flex-1 px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <button type="button" id="btn-restore-savecode" class="shrink-0 px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition">復元</button>
            </div>
          </div>
          <div class="pt-2 border-t border-slate-100 flex items-center gap-2">
            <button type="button" id="btn-download-savefile" class="flex-1 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold transition">ファイルで保存</button>
            <label class="flex-1 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold text-center cursor-pointer transition">
              ファイルから復元
              <input id="savefile-input" type="file" accept=".txt,text/plain" class="hidden" />
            </label>
          </div>
        </section>
      `;
    }

    function renderHistStats() {
      let totalAttempts = 0, totalCorrect = 0, masteredCount = 0;
      QUESTIONS.forEach(q => {
        const r = getHistRecord(q.id);
        totalAttempts += r.attempts;
        totalCorrect += r.correct;
        if (r.correct > 0) masteredCount++;
      });
      const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
      const weakQuestions = QUESTIONS
        .map(q => ({ q, rec: getHistRecord(q.id) }))
        .filter(item => item.rec.wrong > 0)
        .sort((a, b) => (b.rec.wrong !== a.rec.wrong ? b.rec.wrong - a.rec.wrong : (b.rec.lastWrongAt || 0) - (a.rec.lastWrongAt || 0)));
      const wrongCount = getHistWrongIds().length;

      return `
        <div class="space-y-5 animate-pop">
          <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-white rounded-2xl border border-slate-200 p-3 text-center shadow-xs">
              <div class="text-[11px] font-semibold text-slate-500">通算解答</div>
              <div class="text-xl font-extrabold text-slate-900 mt-0.5 tabular-nums">${totalAttempts}<span class="text-xs font-normal ml-0.5">回</span></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-3 text-center shadow-xs">
              <div class="text-[11px] font-semibold text-slate-500">通算正答率</div>
              <div class="text-xl font-extrabold text-indigo-700 mt-0.5 tabular-nums">${accuracy}<span class="text-xs font-normal ml-0.5">%</span></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-3 text-center shadow-xs">
              <div class="text-[11px] font-semibold text-slate-500">正解済み</div>
              <div class="text-xl font-extrabold text-emerald-700 mt-0.5 tabular-nums">${masteredCount}<span class="text-xs font-normal text-slate-400">/${QUESTIONS.length}</span></div>
            </div>
          </div>

          <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 flex items-center justify-between gap-3">
            <div>
              <h3 class="text-sm font-extrabold text-rose-900">間違えた問題だけ (${wrongCount}問)</h3>
              <p class="text-xs text-rose-700 mt-0.5">解いて正解すると自動で外れます</p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button" id="btn-start-wrong-hist" ${wrongCount === 0 ? 'disabled' : ''}
                class="px-3 py-2 rounded-xl font-bold text-xs transition ${wrongCount > 0 ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-sm' : 'bg-rose-200 text-rose-400 cursor-not-allowed'}">復習する</button>
              <button type="button" data-reset-wrong-only="1" ${wrongCount === 0 ? 'disabled' : ''}
                class="px-2.5 py-2 rounded-xl font-bold text-xs border transition ${wrongCount > 0 ? 'bg-white border-rose-300 text-rose-700 hover:bg-rose-100' : 'bg-rose-100/50 border-rose-200 text-rose-300 cursor-not-allowed'}">リセット</button>
            </div>
          </div>

          <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
            <h3 class="text-sm font-bold text-slate-800 mb-3">間違い回数ランキング</h3>
            ${weakQuestions.length === 0 ? `<p class="text-xs text-slate-500 py-4 text-center">まだ間違えた問題の記録はありません。</p>` : `
              <div class="space-y-2.5">
                ${weakQuestions.slice(0, 20).map((item, idx) => {
                  const unitInfo = getHistUnitInfo(item.q.unit);
                  const rate = item.rec.attempts > 0 ? Math.round((item.rec.correct / item.rec.attempts) * 100) : 0;
                  return `
                    <div class="p-3 rounded-xl bg-slate-50 border border-slate-100">
                      <div class="flex items-center justify-between gap-2 mb-1">
                        <div class="flex items-center gap-1.5">
                          <span class="w-5 h-5 rounded-full bg-rose-600 text-white text-[11px] font-bold flex items-center justify-center">${idx + 1}</span>
                          <span class="text-sm font-extrabold text-indigo-900">${item.q.year}年</span>
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${unitInfo.color}">${escapeHtml(unitInfo.short)}</span>
                        </div>
                        <span class="text-xs font-bold text-rose-600">誤答 ${item.rec.wrong}回 (${rate}%)</span>
                      </div>
                      <p class="text-xs font-bold text-slate-800 leading-snug">${escapeHtml(item.q.event)}</p>
                      <p class="text-[11px] text-amber-700 mt-1">💡 ${escapeHtml(getGoro(item.q))}</p>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>

          <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-3">
            <h3 class="text-sm font-bold text-slate-800">単元別の達成状況</h3>
            ${UNITS.map(u => {
              const unitQs = QUESTIONS.filter(q => q.unit === u.id);
              let uAtt = 0, uCor = 0;
              unitQs.forEach(q => { const r = getHistRecord(q.id); uAtt += r.attempts; uCor += r.correct; });
              const uPct = uAtt > 0 ? Math.round((uCor / uAtt) * 100) : 0;
              return `
                <div>
                  <div class="flex justify-between text-xs font-semibold mb-1">
                    <span class="text-slate-700">${escapeHtml(u.name)}</span>
                    <span class="text-slate-500 tabular-nums">${uAtt > 0 ? `${uPct}% (${uCor}/${uAtt})` : '未挑戦'}</span>
                  </div>
                  <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-indigo-600 rounded-full" style="width: ${uPct}%"></div></div>
                </div>
              `;
            }).join('')}
          </section>

          ${renderSaveSection(encodeHistSaveCode(state.histProgress), 'JHQ1:... を貼り付け')}

          <div class="pt-2 text-center">
            <button type="button" id="btn-reset-stats" class="text-xs font-semibold text-slate-400 hover:text-rose-600 underline">歴史の成績記録をすべてリセット</button>
          </div>
        </div>
      `;
    }

    function renderHistList() {
      const keyword = state.histListSearch.trim().toLowerCase();
      const filtered = QUESTIONS.filter(q => {
        if (state.histListUnit !== 'all' && q.unit !== state.histListUnit) return false;
        const rec = getHistRecord(q.id);
        if (state.histListFilter === 'wrong' && !rec.needsReview) return false;
        if (state.histListFilter === 'unattempted' && rec.attempts > 0) return false;
        if (keyword && !`${q.year} ${q.event} ${q.detail}`.toLowerCase().includes(keyword)) return false;
        return true;
      });
      return `
        <div class="space-y-3.5 animate-pop">
          <div class="flex gap-2">
            <input id="list-search-input" type="search" value="${escapeHtml(state.histListSearch)}" placeholder="出来事・年号・人物で検索..."
              class="flex-1 px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <button type="button" id="btn-toggle-redsheet"

              <button type="button" data-list-filter="${f.id}"
                class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border transition ${state.histListFilter === f.id ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200'}">${f.label}</button>

    // --- 英単語ビュー ---
    function renderEngSetup() {
      const wrongCount = getEngWrongNos().length;
      const unattemptedCount = WORDS.filter(w => getEngRecord(w.n).attempts === 0).length;
      const scopeCandidates = getEngCandidates(state.engScope);
      const modeButtons = [
        { id: 'all', label: '全範囲ランダム', sub: `${WORDS.length}語` },
        { id: 'wrong', label: '間違えた問題だけ', sub: `${wrongCount}語`, disabled: wrongCount === 0 },
        { id: 'unattempted', label: 'まだ解いていない問題', sub: `${unattemptedCount}語`, disabled: unattemptedCount === 0 }
      ];
      return `
        <div class="space-y-5 animate-pop">
          <div class="bg-gradient-to-br from-indigo-900 to-indigo-700 rounded-2xl p-4 text-white shadow-md">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-xs font-semibold text-indigo-200 uppercase tracking-wider mb-1">TARGET 1200 · 8-CHOICE</p>
                <h2 class="text-lg font-bold leading-snug">8択で英単語をスピーディに攻略</h2>
                <p class="text-xs text-indigo-100/90 mt-1.5 leading-relaxed">
                  100語ごとのSection別に練習でき、品詞や形の近い紛らわしい8択で実戦力を鍛えます。
                </p>
              </div>
              <div class="shrink-0 w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center text-xl">📘</div>
            </div>
          </div>

                    <button type="button" data-open-battle="1"
            class="w-full py-3 px-4 rounded-2xl bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-600 hover:to-rose-600 active:scale-[0.99] text-white shadow-md shadow-rose-500/20 transition flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5 text-left">
              <span class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-lg shrink-0">⚔️</span>
              <div>
                <div class="text-sm font-extrabold leading-tight">オンライン対戦 (1vs1)</div>
                <div class="text-[11px] text-white/90 leading-tight mt-0.5">近くの端末と接続・20秒早押し・全11問</div>
              </div>
            </div>
            <span class="text-xs font-extrabold bg-white/20 px-2.5 py-1 rounded-full shrink-0">対戦する →</span>
          </button>
          <section>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 px-1">1. 出題パターンを選ぶ</h3>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" data-eng-dir="en2ja"
                class="py-3 px-3 rounded-xl border text-center transition ${state.engDirection === 'en2ja' ? 'border-indigo-600 bg-indigo-600 text-white shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
                <div class="text-xs font-extrabold">英語 → 日本語</div>
                <div class="text-[10px] mt-0.5 ${state.engDirection === 'en2ja' ? 'text-indigo-100' : 'text-slate-400'}">意味を8択から選ぶ</div>
              </button>
              <button type="button" data-eng-dir="ja2en"
                class="py-3 px-3 rounded-xl border text-center transition ${state.engDirection === 'ja2en' ? 'border-indigo-600 bg-indigo-600 text-white shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
                <div class="text-xs font-extrabold">日本語 → 英語</div>
                <div class="text-[10px] mt-0.5 ${state.engDirection === 'ja2en' ? 'text-indigo-100' : 'text-slate-400'}">英単語を8択から選ぶ</div>
              </button>
            </div>
          </section>

          <section>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 px-1">2. 出題範囲を選ぶ</h3>
            <div class="grid grid-cols-1 gap-2 mb-3">
              ${modeButtons.map(m => {
                const active = state.engScope === m.id;
                const borderClass = active ? 'border-indigo-600 bg-indigo-50/80 ring-2 ring-indigo-600/20' : 'border-slate-200 bg-white hover:border-slate-300';
                const disabledClass = m.disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer';
                if (m.id === 'wrong') {
                  return `
                    <div class="flex items-stretch gap-2">
                      <button type="button" data-eng-scope="${m.id}" ${m.disabled ? 'disabled' : ''}
                        class="flex-1 flex items-center justify-between px-4 py-3 rounded-xl border text-left transition ${borderClass} ${disabledClass}">
                        <span class="font-bold text-sm text-slate-800">${m.label}</span>
                        <span class="text-xs font-bold px-2.5 py-1 rounded-full ${wrongCount > 0 ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'}">${m.sub}</span>
                      </button>
                      <button type="button" data-reset-wrong-only="1" ${wrongCount === 0 ? 'disabled' : ''}
                        class="shrink-0 px-3 rounded-xl border text-xs font-bold transition ${wrongCount > 0 ? 'border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100' : 'border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed'}">
                        リセット
                      </button>
                    </div>
                  `;
                }
                return `
                  <button type="button" data-eng-scope="${m.id}" ${m.disabled ? 'disabled' : ''}
                    class="w-full flex items-center justify-between px-4 py-3 rounded-xl border text-left transition ${borderClass} ${disabledClass}">
                    <span class="font-bold text-sm text-slate-800">${m.label}</span>
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">${m.sub}</span>
                  </button>
                `;
              }).join('')}
            </div>
            <p class="text-[11px] font-semibold text-slate-400 mb-2 px-1">Section別（100単語ごと）</p>
            <div class="grid grid-cols-3 gap-1.5">
              ${SECTIONS.map(sec => {
                const active = state.engScope === sec.id;
                return `
                  <button type="button" data-eng-scope="${sec.id}"
                    class="px-2 py-2 rounded-xl border text-left transition ${active ? 'border-indigo-600 bg-indigo-50 ring-2 ring-indigo-600/20' : 'border-slate-200 bg-white hover:border-slate-300'}">
                    <div class="text-xs font-extrabold text-slate-800">Sec ${sec.id}</div>

                  </button>

              }).join('')}

          </section>

          <section>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 px-1">3. 出題数を選ぶ</h3>
            <div class="grid grid-cols-4 gap-1.5">
              ${[10, 20, 50, 'all'].map(limit => {
                const active = String(state.engLimit) === String(limit);
                const label = limit === 'all' ? `全${scopeCandidates.length}` : `${limit}問`;
                return `
                  <button type="button" data-eng-limit="${limit}"
                    class="py-2.5 px-1 rounded-xl border text-xs font-bold transition tabular-nums ${active ? 'border-indigo-600 bg-indigo-600 text-white shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}">
                    ${label}
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <button type="button" id="btn-start-eng"
            class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-extrabold text-base shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2">
            <span>テストスタート</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
          </button>
        </div>
      `;
    }

    function renderEngPlaying() {
      const w = state.engQueue[state.engIndex];
      const secId = getSectionId(w.n);
      const rec = getEngRecord(w.n);
      const progressPct = (state.engIndex / state.engQueue.length) * 100;
      const isAnswered = state.engAnsweredIdx !== null;
      const isLast = state.engIndex + 1 >= state.engQueue.length;
      const promptText = state.engDirection === 'en2ja' ? w.e : w.j;
      const dirLabel = state.engDirection === 'en2ja' ? '英語 → 日本語' : '日本語 → 英語';

      return `
        <div class="flex flex-col gap-3">
          <div class="flex items-center justify-between gap-3">
            <button type="button" id="btn-quit-eng" class="text-xs font-semibold text-slate-500 hover:text-slate-800 px-2 py-1 rounded-lg bg-slate-200/70">← やめる</button>
            <div class="flex-1 h-2 bg-slate-200 rounded-full overflow-hidden">
              <div class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>
            <span class="text-xs font-bold text-slate-600 tabular-nums">${state.engIndex + 1} / ${state.engQueue.length}</span>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">Sec ${secId} · No.${w.n}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${dirLabel}</span>
              </div>
              ${rec.wrong > 0 ? `<span class="text-[11px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full">誤答 ${rec.wrong}回</span>` : ''}
            </div>
            <h2 class="${state.engDirection === 'en2ja' ? 'text-2xl' : 'text-lg'} font-extrabold text-slate-900 leading-snug min-h-[3.2rem] flex items-center justify-center text-center py-2">
              ${escapeHtml(promptText)}
            </h2>
          </div>

          <div class="grid grid-cols-2 gap-2">
            ${state.engChoices.map((choice, idx) => {
              const label = state.engDirection === 'en2ja' ? choice.j : choice.e;
              const isCorrectChoice = choice.n === w.n;
              const isSelected = idx === state.engAnsweredIdx;
              let btnStyle = 'bg-white border-slate-200 text-slate-800 hover:border-indigo-400 hover:bg-indigo-50/40';
              if (isAnswered) {
                if (isCorrectChoice) btnStyle = 'bg-emerald-50 border-emerald-500 text-emerald-900 ring-2 ring-emerald-500/30';
                else if (isSelected) btnStyle = 'bg-rose-50 border-rose-500 text-rose-900 ring-2 ring-rose-500/30';
                else btnStyle = 'bg-slate-100 border-slate-200 text-slate-400 opacity-65';
              }
              return `
                <button type="button" data-choice-idx="${idx}" ${isAnswered ? 'disabled' : ''}
                  class="choice-btn min-h-[3.6rem] p-2.5 rounded-xl border-2 text-left flex items-center gap-2 shadow-2xs ${btnStyle}">
                  <span class="shrink-0 w-5 h-5 rounded-md text-[11px] font-extrabold flex items-center justify-center ${isAnswered && isCorrectChoice ? 'bg-emerald-500 text-white' : isAnswered && isSelected ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-500'}">${idx + 1}</span>
                  <span class="text-xs font-bold leading-snug break-words">${escapeHtml(label)}</span>
                </button>
              `;
            }).join('')}
          </div>

          ${!isAnswered ? `
            <button type="button" id="btn-pass-eng" class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-600 font-bold text-xs transition">
              わからない（答えを見る）
            </button>
          ` : ''}

          ${isAnswered && state.engLastMeta ? `
            <div class="animate-pop space-y-2.5 pt-1">
              <div class="rounded-xl px-3.5 py-2.5 border text-xs font-bold flex items-center justify-between gap-2 ${state.engLastMeta.isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}">
                <span>${state.engLastMeta.isCorrect ? (state.engLastMeta.wasReview ? '○ 正解！「間違えた問題だけ」から外れました' : '○ 正解！') : `${state.engAnsweredIdx === -1 ? 'わからない' : '✕ 不正解'}… 正解は「${escapeHtml(state.engDirection === 'en2ja' ? w.j : w.e)}」`}</span>
                <span class="shrink-0 tabular-nums opacity-80">要復習: ${state.engLastMeta.wrongTotalAfter}語</span>
              </div>
              <button type="button" id="btn-next-eng" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md shadow-indigo-600/25 transition">
                ${isLast ? '結果を見る' : '次の問題へ →'}
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderEngSummary() {
      const total = state.engResults.length;
      const correct = state.engResults.filter(r => r.isCorrect).length;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      const wrongList = state.engResults.filter(r => !r.isCorrect);
      return `
        <div class="space-y-4 animate-pop">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 text-center shadow-sm">
            <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider">今回の結果（英単語1200）</p>
            <div class="my-3 flex items-baseline justify-center gap-1">
              <span class="text-5xl font-extrabold text-slate-900 tabular-nums">${correct}</span>
              <span class="text-lg font-bold text-slate-400">/ ${total}問</span>
            </div>
            <div class="inline-block px-3.5 py-1 rounded-full text-sm font-bold ${pct >= 80 ? 'bg-emerald-100 text-emerald-800' : pct >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}">正答率 ${pct}%</div>
          </div>
          ${wrongList.length > 0 ? `
            <div class="bg-white rounded-2xl border border-rose-200 p-4 shadow-sm space-y-2">
              <h3 class="text-sm font-bold text-rose-800">今回間違えた単語 (${wrongList.length}語)</h3>
              ${wrongList.map(item => {
                const w = WORDS.find(x => x.n === item.n);
                if (!w) return '';
                return `
                  <div class="p-3 rounded-xl bg-rose-50/60 border border-rose-100 flex items-center justify-between gap-2">
                    <div><span class="text-[10px] font-bold text-slate-400">No.${w.n} (Sec ${getSectionId(w.n)})</span><div class="text-sm font-extrabold text-slate-900">${escapeHtml(w.e)}</div></div>
                    <div class="text-xs font-bold text-rose-700 text-right">${escapeHtml(w.j)}</div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `<div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center text-sm font-bold text-emerald-800">🎉 全問正解です！</div>`}
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" id="btn-retry-eng" class="py-3.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 shadow-md">もう1回ランダム</button>
            <button type="button" id="btn-back-eng" class="py-3.5 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50">設定に戻る</button>
          </div>
        </div>
      `;
    }

    function renderEngStats() {
      let totalAttempts = 0, totalCorrect = 0, masteredCount = 0;
      WORDS.forEach(w => {
        const r = getEngRecord(w.n);
        totalAttempts += r.attempts;
        totalCorrect += r.correct;
        if (r.correct > 0) masteredCount++;
      });
      const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
      const weakWords = WORDS
        .map(w => ({ w, rec: getEngRecord(w.n) }))
        .filter(item => item.rec.wrong > 0)
        .sort((a, b) => (b.rec.wrong !== a.rec.wrong ? b.rec.wrong - a.rec.wrong : (b.rec.lastWrongAt || 0) - (a.rec.lastWrongAt || 0)));
      const wrongCount = getEngWrongNos().length;

      return `
        <div class="space-y-5 animate-pop">
          <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-white rounded-2xl border border-slate-200 p-3 text-center shadow-xs">
              <div class="text-[11px] font-semibold text-slate-500">通算解答</div>
              <div class="text-xl font-extrabold text-slate-900 mt-0.5 tabular-nums">${totalAttempts}<span class="text-xs font-normal ml-0.5">回</span></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-3 text-center shadow-xs">
              <div class="text-[11px] font-semibold text-slate-500">通算正答率</div>
              <div class="text-xl font-extrabold text-indigo-700 mt-0.5 tabular-nums">${accuracy}<span class="text-xs font-normal ml-0.5">%</span></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-3 text-center shadow-xs">
              <div class="text-[11px] font-semibold text-slate-500">正解済み</div>
              <div class="text-xl font-extrabold text-emerald-700 mt-0.5 tabular-nums">${masteredCount}<span class="text-xs font-normal text-slate-400">/${WORDS.length}</span></div>
            </div>
          </div>

          <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 flex items-center justify-between gap-3">
            <div>
              <h3 class="text-sm font-extrabold text-rose-900">間違えた問題だけ (${wrongCount}語)</h3>
              <p class="text-xs text-rose-700 mt-0.5">解いて正解すると自動で外れます</p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button" id="btn-start-wrong-eng" ${wrongCount === 0 ? 'disabled' : ''}
                class="px-3 py-2 rounded-xl font-bold text-xs transition ${wrongCount > 0 ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-sm' : 'bg-rose-200 text-rose-400 cursor-not-allowed'}">復習する</button>
              <button type="button" data-reset-wrong-only="1" ${wrongCount === 0 ? 'disabled' : ''}
                class="px-2.5 py-2 rounded-xl font-bold text-xs border transition ${wrongCount > 0 ? 'bg-white border-rose-300 text-rose-700 hover:bg-rose-100' : 'bg-rose-100/50 border-rose-200 text-rose-300 cursor-not-allowed'}">リセット</button>
            </div>
          </div>

          <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
            <h3 class="text-sm font-bold text-slate-800 mb-3">間違い回数ランキング</h3>
            ${weakWords.length === 0 ? `<p class="text-xs text-slate-500 py-4 text-center">まだ間違えた単語の記録はありません。</p>` : `
              <div class="space-y-2">
                ${weakWords.slice(0, 30).map((item, idx) => {
                  const rate = item.rec.attempts > 0 ? Math.round((item.rec.correct / item.rec.attempts) * 100) : 0;
                  return `
                    <div class="p-3 rounded-xl bg-slate-50 border border-slate-100">
                      <div class="flex items-center justify-between gap-2 mb-1">
                        <div class="flex items-center gap-1.5">
                          <span class="w-5 h-5 rounded-full bg-rose-600 text-white text-[11px] font-bold flex items-center justify-center">${idx + 1}</span>
                          <span class="text-sm font-extrabold text-indigo-950">${escapeHtml(item.w.e)}</span>

    function renderGeoList() {

        if (state.geoListFilter === 'wrong' && !rec.needsReview) return false;

                  </div>
