    // ==========================================
    // 7.5. オンライン対戦 (1vs1) ロジック＆ビュー
    // ==========================================
    let battleClient = null;
    let battleEventSource = null;
    let battleJoinRetryId = null;
    let battleTransport = 'mqtt'; // 'mqtt' | 'https'
    let battlePollTimerId = null;
    let battleLastPollId = '';
    let battleSeenIds = new Set();
    let battleTimerId = null;
    let battleCountdownTimers = [];
    let battleNextTimerId = null;
    let battleConnectTimeoutId = null;
    const BATTLE_BROKERS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt'
    ];

    function clearBattleTimers() {
      if (battleTimerId) { clearInterval(battleTimerId); battleTimerId = null; }
      if (battleNextTimerId) { clearTimeout(battleNextTimerId); battleNextTimerId = null; }
      if (battleConnectTimeoutId) { clearTimeout(battleConnectTimeoutId); battleConnectTimeoutId = null; }
        if (battleJoinRetryId) { clearInterval(battleJoinRetryId); battleJoinRetryId = null; }
      if (battleCountdownTimers && battleCountdownTimers.length) { battleCountdownTimers.forEach(id => clearTimeout(id)); battleCountdownTimers = []; }
      if (battlePollTimerId) { clearInterval(battlePollTimerId); battlePollTimerId = null; }
      if (battleJoinRetryId) { clearInterval(battleJoinRetryId); battleJoinRetryId = null; }
    }

    function cleanupBattleConnection() {
      clearBattleTimers();
      try {
        if (battleClient) {
          battleClient.end(true);
        }
      } catch (e) {}
      try {
        if (battleEventSource) {
          battleEventSource.close();
        }
      } catch (e) {}
      battleClient = null;
      battleEventSource = null;
      battleTransport = 'mqtt';
      battleLastPollId = '';
      battleSeenIds.clear();
    }

    function getBattleTopic(code) {
      return `kstudy/v1/room/${code}`;
    }

    function getBattleSubjectLabel(subj) {
      if (subj === 'history') return '📜 歴史年号';
      if (subj === 'histqa') return '📖 歴史一問一答';
      if (subj === 'english') return '📘 英単語1200';
      return '🌍 中学地理';
    }

    function getBattleScopeOptions(subj) {
      if (subj === 'history') {
        return [
          { id: 'all', label: '全範囲' },
          { id: 'wrong', label: '間違えた問題だけ' },
          { id: 'unattempted', label: 'まだ解いていない問題' },
          ...UNITS.map(u => ({ id: u.id, label: u.short }))
        ];
      }
      if (subj === 'histqa') {
        return [
          { id: 'all', label: '全範囲' },
          { id: 'wrong', label: '間違えた問題だけ' },
          { id: 'unattempted', label: 'まだ解いていない問題' },
          ...HQA_UNITS.map(u => ({ id: u.id, label: u.short }))
        ];
      }
      if (subj === 'english') {
        return [
          { id: 'all', label: '全範囲' },
          { id: 'wrong', label: '間違えた問題だけ' },
          { id: 'unattempted', label: 'まだ解いていない問題' },
          ...SECTIONS.map(s => ({ id: s.id, label: `${s.name} (${s.range})` }))
        ];
      }
      return [
        { id: 'all', label: '全範囲（世界＋日本）' },
        { id: 'world', label: '世界地理すべて' },
        { id: 'japan', label: '日本地理すべて' },
        { id: 'wrong', label: '間違えた問題だけ' },
        { id: 'unattempted', label: 'まだ解いていない問題' },
        ...GEO_REGIONS.map(r => ({ id: r.id, label: r.short }))
      ];
    }

    function getBattleScopeName(subj, scopeId) {
      const opts = getBattleScopeOptions(subj);
      const found = opts.find(o => o.id === scopeId);
      return found ? found.label : scopeId;
    }

    function openBattleLobby() {
      cleanupBattleConnection();
      const subj = state.subject;
      const b = state.battle;
      b.active = true;
      b.phase = 'lobby';
      b.role = 'host';
      b.subject = subj;
      b.scope = subj === 'history' ? state.histUnit : subj === 'histqa' ? state.histQaScope : subj === 'english' ? state.engScope : state.geoScope;
      b.direction = subj === 'histqa' ? state.histQaDirection : subj === 'english' ? state.engDirection : 'desc2term';
      b.roomCode = '';
      b.joinInput = '';
      b.connStatus = 'idle';
      b.errorMsg = '';
      b.deck = [];
      b.roundResults = [];
      state.activeTab = 'quiz';
      render();
    }

    function exitBattleMode() {
      cleanupBattleConnection();
      state.battle.active = false;
      state.battle.phase = 'lobby';
      state.battle.connStatus = 'idle';
      render();
    }

    function sendBattleMsg(payload) {
      const msgObj = { ...payload, from: state.battle.role, mid: Math.random().toString(36).slice(2, 10), ts: Date.now() };
      const data = JSON.stringify(msgObj);
      if (battleTransport === 'https' && state.battle.roomCode) {
        try {
          fetch(`https://ntfy.sh/kstudy_v1_${state.battle.roomCode}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: data,
            cache: 'no-store'
          }).then(res => {
            if (!res.ok) {
              state.battle.diagMsg = `送信エラー (HTTP ${res.status})`;
              if (state.battle.phase === 'lobby') render();
            } else {
              state.battle.diagMsg = '送信OK・相手の応答待ち';
            }
          }).catch(() => {
            state.battle.diagMsg = '送信通信がブロックされました';
            if (state.battle.phase === 'lobby') render();
          });
        } catch (e) {}
        return;
      }
      try {
        if (battleClient && battleClient.connected && state.battle.roomCode) {
          battleClient.publish(getBattleTopic(state.battle.roomCode), data, { qos: 0 });
        }
      } catch (e) {}
    }

    function processBattleNtfyPayload(rawJson) {
      try {
        const ev = JSON.parse(rawJson);
        if (ev.id) battleLastPollId = ev.id;
        if (ev.event !== 'message' || !ev.message) return;
        const msg = JSON.parse(ev.message);
        if (!msg || msg.from === state.battle.role) return;
        if (msg.mid && battleSeenIds.has(msg.mid)) return;
        if (msg.mid) battleSeenIds.add(msg.mid);
        handleBattleMessage(msg);
      } catch (err) {}
    }

    async function connectBattleHttpsFallback(code, role) {
      cleanupBattleConnection();
      battleTransport = 'https';
      state.battle.diagMsg = 'HTTPSサーバーへ接続中…';
      const topic = `kstudy_v1_${code}`;

      try {
        const testRes = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=5s&_t=${Date.now()}`, { cache: 'no-store' });
        if (!testRes.ok) {
          state.battle.connStatus = 'error';
          state.battle.errorMsg = testRes.status === 429
            ? 'アクセスが集中しています（HTTP 429）。10秒ほど待ってからもう一度お試しください。'
            : `通信サーバーエラー (HTTP ${testRes.status})`;
          render();
          return;
        }
        const initText = await testRes.text();
        if (initText) {
          for (const line of initText.split('\n')) {
            if (line.trim()) processBattleNtfyPayload(line);
          }
        }
      } catch (e) {
        state.battle.connStatus = 'error';
        state.battle.errorMsg = 'この共有画面では外部通信がブロックされています。下のボタンからHTMLを保存し、SafariやChromeで直接開いてください。';
        render();
        return;
      }

      if (!state.battle.active) return;
      state.battle.diagMsg = '受信ストリーム接続OK';

      // 1本のSSE接続を張り、万一エラー時のみ緩やかなポーリング(2秒)に切替（429制限回避）
      let sseAlive = false;
      try {
        const es = new EventSource(`https://ntfy.sh/${topic}/sse?since=10s&_t=${Date.now()}`);
        battleEventSource = es;
        es.onopen = () => {
          sseAlive = true;
          state.battle.diagMsg = 'リアルタイム受信中 (SSE)';
        };
        es.onmessage = (e) => {
          if (!state.battle.active || battleEventSource !== es) return;
          sseAlive = true;
          processBattleNtfyPayload(e.data);
        };
        es.onerror = () => {
          sseAlive = false;
          if (!battlePollTimerId && state.battle.active && battleTransport === 'https') {
            state.battle.diagMsg = 'ポーリング受信に切替中';
            startBattleHttpsPolling(topic);
          }
        };
      } catch (e) {
        startBattleHttpsPolling(topic);
      }

      if (role === 'host') {
        state.battle.connStatus = 'waiting';
        render();
      } else {
        sendBattleMsg({ type: 'JOIN' });
        battleJoinRetryId = setInterval(() => {
          if (!state.battle.active || state.battle.role !== 'guest' || state.battle.connStatus !== 'connecting') {
            clearInterval(battleJoinRetryId);
            battleJoinRetryId = null;
            return;
          }
          sendBattleMsg({ type: 'JOIN' });
        }, 2500);
        battleConnectTimeoutId = setTimeout(() => {
          if (state.battle.active && state.battle.role === 'guest' && state.battle.connStatus === 'connecting') {
            cleanupBattleConnection();
            state.battle.connStatus = 'error';
            state.battle.errorMsg = `部屋（${code}）が見つからないか、ホスト側で通信が制限されています。（状態: ${state.battle.diagMsg}）`;
            render();
          }
        }, 10000);
      }
    }

    function startBattleHttpsPolling(topic) {
      if (battlePollTimerId) return;
      let polling = false;
      battlePollTimerId = setInterval(async () => {
        if (!state.battle.active || battleTransport !== 'https') {
          clearInterval(battlePollTimerId);
          battlePollTimerId = null;
          return;
        }
        if (polling) return;
        polling = true;
        try {
          const sinceParam = battleLastPollId ? battleLastPollId : '20s';
          const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=${encodeURIComponent(sinceParam)}&_t=${Date.now()}`, { cache: 'no-store' });
          if (res.ok) {
            const text = await res.text();
            if (text) {
              for (const line of text.split('\n')) {
                if (!line.trim()) continue;
                processBattleNtfyPayload(line);
              }
            }
          } else if (res.status === 429) {
            state.battle.diagMsg = '通信制限中 (HTTP 429)';
          }
        } catch (err) {}
        polling = false;
      }, 2000);
    }

    function connectBattleBroker(code, role, brokerIdx = 0) {
      if (typeof mqtt === 'undefined') {
        connectBattleHttpsFallback(code, role);
        return;
      }
      cleanupBattleConnection();
      battleTransport = 'mqtt';
      const brokerUrl = BATTLE_BROKERS[brokerIdx] || BATTLE_BROKERS[0];
      const clientId = `ks_${role}_${Math.random().toString(36).slice(2, 9)}`;

      let settled = false;
      battleConnectTimeoutId = setTimeout(() => {
        if (settled || !state.battle.active) return;
        if (brokerIdx + 1 < BATTLE_BROKERS.length) {
          connectBattleBroker(code, role, brokerIdx + 1);
        } else {
          connectBattleHttpsFallback(code, role);
        }
      }, 4000);

      let client;
      try {
        client = mqtt.connect(brokerUrl, {
          clientId,
          clean: true,
          connectTimeout: 3500,
          reconnectPeriod: 0
        });
      } catch (e) {
        clearTimeout(battleConnectTimeoutId);
        connectBattleHttpsFallback(code, role);
        return;
      }
      battleClient = client;

      client.on('connect', () => {
        if (!state.battle.active || battleClient !== client) return;
        settled = true;
        clearTimeout(battleConnectTimeoutId);
        battleConnectTimeoutId = null;

        client.subscribe(getBattleTopic(code), { qos: 0 }, (err) => {
          if (err) {
            connectBattleHttpsFallback(code, role);
            return;
          }
          if (role === 'host') {
            state.battle.connStatus = 'waiting';
            render();
          } else {
            sendBattleMsg({ type: 'JOIN' });
            battleConnectTimeoutId = setTimeout(() => {
              if (state.battle.active && state.battle.role === 'guest' && state.battle.connStatus === 'connecting') {
                cleanupBattleConnection();
                state.battle.connStatus = 'error';
                state.battle.errorMsg = `部屋（${code}）が見つかりません。ホストが部屋を作った状態で番号を確認してください。`;
                render();
              }
            }, 6000);
          }
        });
      });

      client.on('message', (topic, message) => {
        if (!state.battle.active || battleClient !== client) return;
        try {
          const msg = JSON.parse(message.toString());
          if (!msg || msg.from === state.battle.role) return;
          handleBattleMessage(msg);
        } catch (e) {}
      });

      client.on('error', () => {
        if (settled || !state.battle.active || battleClient !== client) return;
        settled = true;
        clearTimeout(battleConnectTimeoutId);
        if (brokerIdx + 1 < BATTLE_BROKERS.length) {
          connectBattleBroker(code, role, brokerIdx + 1);
        } else {
          connectBattleHttpsFallback(code, role);
        }
      });
    }

    function createBattleHostRoom() {
      const code = String(Math.floor(1000 + Math.random() * 9000));
      state.battle.role = 'host';
      state.battle.roomCode = code;
      state.battle.connStatus = 'creating';
      state.battle.errorMsg = '';
      render();
      connectBattleBroker(code, 'host', 0);
    }

    function joinBattleRoom() {
      const code = String(state.battle.joinInput || '').replace(/[^0-9]/g, '');
      if (code.length !== 4) {
        showToast('4桁のルーム番号を入力してください');
        return;
      }
      state.battle.role = 'guest';
      state.battle.roomCode = code;
      state.battle.connStatus = 'connecting';
      state.battle.errorMsg = '';
      render();
      connectBattleBroker(code, 'guest', 0);
    }

    function buildBattleDeck(subj, scope, direction) {
      let raw = [];
      if (subj === 'history') raw = getHistCandidates(scope);
      else if (subj === 'histqa') raw = getHistQaCandidates(scope);
      else if (subj === 'english') raw = getEngCandidates(scope);
      else raw = getGeoCandidates(scope);

      if (raw.length === 0) return [];
      let picked = shuffleArray(raw);
      while (picked.length < 11) {
        picked = picked.concat(shuffleArray(raw));
      }
      picked = picked.slice(0, 11);

      return picked.map(item => {
        if (subj === 'history') {
          return {
            id: item.id,
            prompt: item.event,
            answer: item.year,
            sub: getHistUnitInfo(item.unit).short,
            exp: `${item.year}年 / ${getGoro(item)}`
          };
        }
        if (subj === 'histqa') {
          const isDesc2Term = direction === 'desc2term';
          const choices = generateHistQa8Choices(item).map(c => isDesc2Term ? c.t : c.d);
          return {
            id: item.id,
            prompt: isDesc2Term ? item.d : item.t,
            answer: isDesc2Term ? item.t : item.d,
            choices,
            sub: getHistQaUnitInfo(item.u).short,
            exp: `${item.t}${item.n ? `（${item.n}）` : ''}：${item.d}`
          };
        }
        if (subj === 'english') {
          const prevDir = state.engDirection;
          state.engDirection = direction;
          const choices = generate8Choices(item).map(c => direction === 'en2ja' ? c.j : c.e);
          state.engDirection = prevDir;
          return {
            id: item.n,
            prompt: direction === 'en2ja' ? item.e : item.j,
            answer: direction === 'en2ja' ? item.j : item.e,
            choices,
            sub: `Sec ${getSectionId(item.n)}`,
            exp: `${item.e} ＝ ${item.j}`
          };
        }
        // geo
        const choices = generateGeo8Choices(item).map(c => c.a);
        return {
          id: item.id,
          prompt: item.q,
          answer: item.a,
          choices,
          sub: getGeoRegionInfo(item.region).short,
          exp: item.exp
        };
      });
    }

    function startBattleMatch() {
      const b = state.battle;
      if (b.role !== 'host' || b.connStatus !== 'connected') return;
      const deck = buildBattleDeck(b.subject, b.scope, b.direction);
      if (deck.length < 11) {
        showToast('対象の問題がありません。範囲を変更してください');
        return;
      }
      b.deck = deck;
      b.qIndex = 0;
      b.hostScore = 0;
      b.guestScore = 0;
      b.roundResults = [];
      sendBattleMsg({
        type: 'START_MATCH',
        subject: b.subject,
        scope: b.scope,
        direction: b.direction,
        deck
      });
      beginBattleRound(0);
    }

    function beginBattleRound(idx) {
      clearBattleTimers();
      const b = state.battle;
      b.qIndex = idx;
      b.hostFouled = false;
      b.guestFouled = false;
      b.roundWinner = null;
      b.roundReason = '';
      b.histInputYear = '';
      b.phase = 'countdown';
      b.countdownStep = 'ready';
      render();

      const t1 = setTimeout(() => {
        if (!state.battle.active || state.battle.phase !== 'countdown') return;
        state.battle.countdownStep = 'blank';
        render();
      }, 700);

      const t2 = setTimeout(() => {
        if (!state.battle.active || state.battle.phase !== 'countdown') return;
        state.battle.countdownStep = 'go';
        render();
      }, 1700);

      const t3 = setTimeout(() => {
        if (!state.battle.active || state.battle.phase !== 'countdown') return;
        state.battle.phase = 'playing';
        state.battle.roundStartAt = Date.now();
        render();
        startBattleRoundTimer();
      }, 2250);

      battleCountdownTimers = [t1, t2, t3];
    }

    function startBattleRoundTimer() {
      if (battleTimerId) clearInterval(battleTimerId);
      battleTimerId = setInterval(() => {
        const b = state.battle;
        if (!b.active || b.phase !== 'playing') {
          clearInterval(battleTimerId);
          battleTimerId = null;
          return;
        }
        const elapsed = Date.now() - b.roundStartAt;
        const remMs = Math.max(0, b.roundDurationMs - elapsed);
        const remSec = (remMs / 1000).toFixed(1);
        const pct = Math.max(0, Math.min(100, (remMs / b.roundDurationMs) * 100));

        const timerEl = document.getElementById('battle-timer-text');
        const barEl = document.getElementById('battle-timer-bar');
        if (timerEl) {
          timerEl.textContent = `${remSec}s`;
          timerEl.className = `text-base font-extrabold tabular-nums ${remMs <= 5000 ? 'text-rose-600' : remMs <= 10000 ? 'text-amber-600' : 'text-indigo-700'}`;
        }
        if (barEl) {
          barEl.style.width = `${pct}%`;
          barEl.className = `h-full rounded-full transition-all duration-100 ${remMs <= 5000 ? 'bg-rose-500' : remMs <= 10000 ? 'bg-amber-500' : 'bg-indigo-600'}`;
        }

        if (remMs <= 0 && b.role === 'host') {
          resolveBattleRoundHost(null, 'timeout');
        }
      }, 100);
    }

    function submitBattleAnswer(answerText) {
      const b = state.battle;
      if (!b.active || b.phase !== 'playing') return;
      const myFouled = b.role === 'host' ? b.hostFouled : b.guestFouled;
      if (myFouled) return;

      if (b.role === 'host') {
        processBattleAnswerHost('host', b.qIndex, answerText);
      } else {
        sendBattleMsg({
          type: 'ANSWER',
          qIndex: b.qIndex,
          answer: answerText
        });
      }
    }

    function processBattleAnswerHost(who, qIndex, answerText) {
      const b = state.battle;
      if (b.role !== 'host' || b.phase !== 'playing' || qIndex !== b.qIndex) return;
      if (who === 'host' && b.hostFouled) return;
      if (who === 'guest' && b.guestFouled) return;

      const curQ = b.deck[b.qIndex];
      if (!curQ) return;

      if (String(answerText) === String(curQ.answer)) {
        resolveBattleRoundHost(who, 'correct');
      } else {
        if (who === 'host') b.hostFouled = true;
        else b.guestFouled = true;
        sendBattleMsg({ type: 'FOUL', qIndex: b.qIndex, who });
        if (b.hostFouled && b.guestFouled) {
          resolveBattleRoundHost(null, 'both_foul');
        } else {
          render();
        }
      }
    }

    function resolveBattleRoundHost(winner, reason) {
      const b = state.battle;
      if (b.phase !== 'playing') return;
      clearBattleTimers();
      if (winner === 'host') b.hostScore += 1;
      else if (winner === 'guest') b.guestScore += 1;

      b.phase = 'round_end';
      b.roundWinner = winner;
      b.roundReason = reason;
      b.roundResults.push({ qIndex: b.qIndex, winner, reason });

      sendBattleMsg({
        type: 'ROUND_RESULT',
        qIndex: b.qIndex,
        winner,
        reason,
        hostScore: b.hostScore,
        guestScore: b.guestScore
      });
      render();

      battleNextTimerId = setTimeout(() => {
        if (!state.battle.active || state.battle.role !== 'host' || state.battle.phase !== 'round_end') return;
        advanceBattleHost();
      }, 2400);
    }

    function advanceBattleHost() {
      clearBattleTimers();
      const b = state.battle;
      if (b.role !== 'host') return;
      const nextIdx = b.qIndex + 1;
      if (nextIdx < b.deck.length) {
        sendBattleMsg({ type: 'NEXT_ROUND', qIndex: nextIdx });
        beginBattleRound(nextIdx);
      } else {
        b.phase = 'summary';
        sendBattleMsg({ type: 'MATCH_END', hostScore: b.hostScore, guestScore: b.guestScore });
        render();
      }
    }

    function handleBattleMessage(msg) {
      const b = state.battle;
      if (!b.active) return;

      if (msg.type === 'JOIN' && b.role === 'host') {
        b.connStatus = 'connected';
        b.errorMsg = '';
        sendBattleMsg({
          type: 'ROOM_INFO',
          subject: b.subject,
          scope: b.scope,
          direction: b.direction
        });
        showToast('相手が参加しました！');
        render();
      } else if (msg.type === 'ROOM_INFO' && b.role === 'guest') {
        if (battleConnectTimeoutId) { clearTimeout(battleConnectTimeoutId); battleConnectTimeoutId = null; }
        b.connStatus = 'connected';
        b.errorMsg = '';
        b.subject = msg.subject;
        b.scope = msg.scope;
        b.direction = msg.direction;
        showToast('部屋に接続しました！');
        render();
      } else if (msg.type === 'START_MATCH' && b.role === 'guest') {
        b.subject = msg.subject;
        b.scope = msg.scope;
        b.direction = msg.direction;
        b.deck = msg.deck;
        b.hostScore = 0;
        b.guestScore = 0;
        b.roundResults = [];
        beginBattleRound(0);
      } else if (msg.type === 'ANSWER' && b.role === 'host') {
        processBattleAnswerHost('guest', msg.qIndex, msg.answer);
      } else if (msg.type === 'FOUL' && b.role === 'guest') {
        if (msg.qIndex === b.qIndex) {
          if (msg.who === 'host') b.hostFouled = true;
          else b.guestFouled = true;
          render();
        }
      } else if (msg.type === 'ROUND_RESULT' && b.role === 'guest') {
        if (msg.qIndex === b.qIndex && b.phase === 'playing') {
          clearBattleTimers();
          b.phase = 'round_end';
          b.roundWinner = msg.winner;
          b.roundReason = msg.reason;
          b.hostScore = msg.hostScore;
          b.guestScore = msg.guestScore;
          b.roundResults.push({ qIndex: msg.qIndex, winner: msg.winner, reason: msg.reason });
          render();
        }
      } else if (msg.type === 'NEXT_ROUND' && b.role === 'guest') {
        beginBattleRound(msg.qIndex);
      } else if (msg.type === 'MATCH_END' && b.role === 'guest') {
        clearBattleTimers();
        b.hostScore = msg.hostScore;
        b.guestScore = msg.guestScore;
        b.phase = 'summary';
        render();
      }
    }

    function renderBattle() {
      const b = state.battle;
      if (b.phase === 'lobby') return renderBattleLobby();
      if (b.phase === 'countdown') return renderBattleCountdown();
      if (b.phase === 'playing' || b.phase === 'round_end') return renderBattlePlaying();
      return renderBattleSummary();
    }

    function renderBattleCountdown() {
      const b = state.battle;
      const isHost = b.role === 'host';
      const myScore = isHost ? b.hostScore : b.guestScore;
      const oppScore = isHost ? b.guestScore : b.hostScore;
      let centerHtml = '';
      if (b.countdownStep === 'ready') {
        centerHtml = `<div class="animate-pop text-4xl font-extrabold tracking-widest text-indigo-700">Ready...</div>`;
      } else if (b.countdownStep === 'blank') {
        centerHtml = `<div class="text-2xl font-bold tracking-[0.5em] text-slate-300">・・・</div>`;
      } else {
        centerHtml = `<div class="animate-pop text-5xl font-extrabold tracking-wider text-rose-600">GO!!</div>`;
      }
      return `
        <div class="flex flex-col gap-4">
          <div class="bg-white rounded-2xl border border-slate-200 p-3 shadow-xs">
            <div class="grid grid-cols-3 items-center text-center gap-2">
              <div class="rounded-xl px-2 py-1.5 bg-indigo-50 border border-indigo-100">
                <div class="text-[10px] font-bold text-indigo-600">あなた</div>
                <div class="text-xl font-extrabold text-indigo-950 tabular-nums">${myScore}</div>
              </div>
              <div>
                <div class="text-xs font-extrabold text-slate-500">第 ${b.qIndex + 1} / ${b.deck.length} 問</div>
                <div class="text-lg font-extrabold text-slate-800 tabular-nums mt-0.5">${myScore} - ${oppScore}</div>
              </div>
              <div class="rounded-xl px-2 py-1.5 bg-rose-50 border border-rose-100">
                <div class="text-[10px] font-bold text-rose-600">相手</div>
                <div class="text-xl font-extrabold text-rose-900 tabular-nums">${oppScore}</div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 min-h-[16rem] flex flex-col items-center justify-center p-6 shadow-sm">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">QUESTION ${b.qIndex + 1}</p>
            ${centerHtml}
          </div>
        </div>
      `;
    }

    function renderBattleLobby() {
      const b = state.battle;
      const scopeOpts = getBattleScopeOptions(b.subject);
      const showDir = b.subject === 'histqa' || b.subject === 'english';
      const isHost = b.role === 'host';
      return `
        <div class="space-y-4 animate-pop">
          <div class="flex items-center justify-between gap-2">
            <button type="button" id="btn-exit-battle" class="text-xs font-semibold text-slate-600 hover:text-slate-900 px-2.5 py-1.5 rounded-lg bg-slate-200/80">← 通常モードに戻る</button>
            <span class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-800">${getBattleSubjectLabel(b.subject)}</span>
          </div>

          <div class="bg-gradient-to-br from-amber-500 to-rose-600 rounded-2xl p-4 text-white shadow-md">
            <p class="text-[11px] font-bold uppercase tracking-wider text-amber-100 mb-1">1vs1 ONLINE BATTLE</p>
            <h2 class="text-lg font-extrabold leading-snug">オンライン早押し対戦</h2>
            <div class="mt-2.5 grid grid-cols-2 gap-1.5 text-[11px] font-bold">
              <div class="bg-white/15 rounded-lg px-2.5 py-1.5">⏱ 制限時間 20秒</div>
              <div class="bg-white/15 rounded-lg px-2.5 py-1.5">📝 全11問（同問題）</div>
              <div class="bg-white/15 rounded-lg px-2.5 py-1.5">⚡ 先取で +1pt</div>
              <div class="bg-white/15 rounded-lg px-2.5 py-1.5">❌ 誤答はお手付き</div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-200/80">
            <button type="button" data-battle-role="host"
              class="py-2 rounded-lg text-xs font-extrabold transition ${isHost ? 'bg-white text-indigo-950 shadow-xs' : 'text-slate-600'}">🏠 部屋をつくる</button>
            <button type="button" data-battle-role="guest"
              class="py-2 rounded-lg text-xs font-extrabold transition ${!isHost ? 'bg-white text-indigo-950 shadow-xs' : 'text-slate-600'}">🚪 部屋に入る</button>
          </div>

          ${isHost ? `
            <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3.5 shadow-xs">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5">出題範囲</label>
                <select id="battle-scope-select" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold text-slate-800">
                  ${scopeOpts.map(o => `<option value="${o.id}" ${b.scope === o.id ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}
                </select>
              </div>
              ${showDir ? `
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1.5">出題パターン</label>
                  <div class="grid grid-cols-2 gap-2">
                    ${b.subject === 'histqa' ? `
                      <button type="button" data-battle-dir="desc2term" class="py-2 rounded-xl border text-xs font-bold ${b.direction === 'desc2term' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">出来事 → 単語</button>
                      <button type="button" data-battle-dir="term2desc" class="py-2 rounded-xl border text-xs font-bold ${b.direction === 'term2desc' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">単語 → 出来事</button>
                    ` : `
                      <button type="button" data-battle-dir="en2ja" class="py-2 rounded-xl border text-xs font-bold ${b.direction === 'en2ja' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">英語 → 日本語</button>
                      <button type="button" data-battle-dir="ja2en" class="py-2 rounded-xl border text-xs font-bold ${b.direction === 'ja2en' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">日本語 → 英語</button>
                    `}
                  </div>
                </div>
              ` : ''}

              ${b.connStatus === 'idle' || b.connStatus === 'error' ? `
                                ${b.errorMsg ? `
                  <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 space-y-2">
                    <p class="text-xs font-bold text-rose-700 leading-relaxed">${escapeHtml(b.errorMsg)}</p>
                    <button type="button" data-download-app-html="1" class="w-full py-2 rounded-lg bg-white border border-rose-300 text-rose-700 font-bold text-xs hover:bg-rose-100 transition">📥 このアプリ(HTML)を保存する</button>
                  </div>
                ` : ''}
                <button type="button" id="btn-battle-create"
                  class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md transition">
                  4桁のルーム番号を発行する
                </button>
              ` : b.connStatus === 'creating' ? `
                <div class="py-4 text-center text-xs font-bold text-slate-500">ルーム番号を発行しています…</div>
              ` : b.connStatus === 'waiting' ? `
                <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 text-center space-y-2">
                  <p class="text-xs font-bold text-indigo-700">相手にこの4桁の番号を伝えてください</p>
                  <div class="text-4xl font-extrabold tracking-[0.25em] text-indigo-950 tabular-nums">${b.roomCode}</div>
                  <p class="text-[11px] text-indigo-600 font-semibold">相手の参加を待っています…</p>
                  ${b.diagMsg ? `<p class="text-[10px] text-indigo-400">${escapeHtml(b.diagMsg)}</p>` : ''}
                </div>
              ` : `
                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center space-y-3">
                  <div class="text-sm font-extrabold text-emerald-800">✅ 相手が参加しました！（ルーム ${b.roomCode}）</div>
                  <button type="button" id="btn-battle-start"
                    class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-md transition">
                    ⚔️ 対戦スタート（全11問）
                  </button>
                </div>
              `}
            </div>
          ` : `
            <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3.5 shadow-xs">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5">ホストの4桁ルーム番号を入力</label>
                <input id="battle-room-input" type="text" inputmode="numeric" maxlength="4" value="${escapeHtml(b.joinInput)}" placeholder="例: 4829"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-center text-2xl font-extrabold tracking-[0.25em] text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
                              ${b.errorMsg ? `
                  <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 space-y-2">
                    <p class="text-xs font-bold text-rose-700 leading-relaxed">${escapeHtml(b.errorMsg)}</p>
                    <button type="button" data-download-app-html="1" class="w-full py-2 rounded-lg bg-white border border-rose-300 text-rose-700 font-bold text-xs hover:bg-rose-100 transition">📥 このアプリ(HTML)を保存する</button>
                  </div>
                ` : ''}
              ${b.connStatus === 'connected' ? `
                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center space-y-1.5">
                  <div class="text-sm font-extrabold text-emerald-800">✅ 接続完了！</div>
                  <p class="text-xs font-bold text-slate-700">${getBattleSubjectLabel(b.subject)} / ${escapeHtml(getBattleScopeName(b.subject, b.scope))}</p>
                  <p class="text-[11px] text-emerald-700 font-semibold">ホストが対戦を開始するのを待っています…</p>
                </div>
              ` : `
                <button type="button" id="btn-battle-join" ${b.connStatus === 'connecting' ? 'disabled' : ''}
                  class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md transition disabled:opacity-60">
                  ${b.connStatus === 'connecting' ? '接続中…' : '部屋に接続する'}
                </button>
              `}
            </div>
          `}
          <div class="pt-1 text-center">
            <button type="button" data-download-app-html="1" class="text-[11px] font-semibold text-slate-400 hover:text-indigo-600 underline">📥 最新版HTMLをダウンロード（GitHub更新用）</button>
          </div>
        </div>
      `;
    }

    function renderBattlePlaying() {
      const b = state.battle;
      const q = b.deck[b.qIndex];
      const isHost = b.role === 'host';
      const myScore = isHost ? b.hostScore : b.guestScore;
      const oppScore = isHost ? b.guestScore : b.hostScore;
      const myFouled = isHost ? b.hostFouled : b.guestFouled;
      const oppFouled = isHost ? b.guestFouled : b.hostFouled;
      const isRoundEnd = b.phase === 'round_end';

      let answerUi = '';
      if (b.subject === 'history') {
        const digitsHtml = [0, 1, 2, 3].map(idx => {
          const ch = b.histInputYear[idx] || '';
          return `<div class="w-12 h-14 rounded-xl border-2 flex items-center justify-center text-2xl font-extrabold ${ch ? 'border-indigo-600 bg-indigo-50 text-indigo-950' : 'border-slate-200 bg-white text-slate-300'}">${ch || '·'}</div>`;
        }).join('');
        answerUi = `
          <div class="flex justify-center gap-2 my-1">${digitsHtml}</div>
          <div class="grid grid-cols-3 gap-2">
            ${[1,2,3,4,5,6,7,8,9].map(n => `
              <button type="button" data-bkey="${n}" ${myFouled || isRoundEnd ? 'disabled' : ''}
                class="keypad-btn h-12 rounded-xl bg-white border border-slate-200 shadow-2xs text-xl font-bold text-slate-800 hover:bg-slate-50 disabled:opacity-45">${n}</button>
            `).join('')}
            <button type="button" id="btn-b-clear" ${myFouled || isRoundEnd ? 'disabled' : ''} class="keypad-btn h-12 rounded-xl bg-slate-200 text-slate-700 font-bold text-xs disabled:opacity-45">クリア</button>
            <button type="button" data-bkey="0" ${myFouled || isRoundEnd ? 'disabled' : ''} class="keypad-btn h-12 rounded-xl bg-white border border-slate-200 shadow-2xs text-xl font-bold text-slate-800 disabled:opacity-45">0</button>
            <button type="button" id="btn-b-back" ${myFouled || isRoundEnd ? 'disabled' : ''} class="keypad-btn h-12 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm disabled:opacity-45">⌫</button>
          </div>
          <button type="button" id="btn-b-submit" ${myFouled || isRoundEnd ? 'disabled' : ''}
            class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md disabled:opacity-45">
            解答する
          </button>
        `;
      } else {
        const isSingleCol = b.subject === 'histqa' && b.direction === 'term2desc';
        answerUi = `
          <div class="grid ${isSingleCol ? 'grid-cols-1' : 'grid-cols-2'} gap-2">
            ${(q.choices || []).map((cText, idx) => {
              const isCorrectChoice = String(cText) === String(q.answer);
              let btnStyle = 'bg-white border-slate-200 text-slate-800 hover:border-indigo-400 hover:bg-indigo-50/40';
              if (isRoundEnd && isCorrectChoice) {
                btnStyle = 'bg-emerald-50 border-emerald-500 text-emerald-900 ring-2 ring-emerald-500/30';
              } else if (myFouled || isRoundEnd) {
                btnStyle = 'bg-slate-100 border-slate-200 text-slate-400 opacity-60';
              }
              return `
                <button type="button" data-bchoice-idx="${idx}" ${myFouled || isRoundEnd ? 'disabled' : ''}
                  class="choice-btn ${isSingleCol ? 'py-2.5 px-3' : 'min-h-[3.3rem] p-2'} rounded-xl border-2 text-left flex items-center gap-2 shadow-2xs ${btnStyle}">
                  <span class="shrink-0 w-5 h-5 rounded-md text-[11px] font-extrabold flex items-center justify-center ${isRoundEnd && isCorrectChoice ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-500'}">${idx + 1}</span>
                  <span class="text-xs font-bold leading-snug break-words">${escapeHtml(cText)}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      let roundBanner = '';
      if (isRoundEnd) {
        const iWon = b.roundWinner === b.role;
        const oppWon = b.roundWinner && !iWon;
        const bannerStyle = iWon ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : oppWon ? 'bg-rose-50 border-rose-200 text-rose-800' : 'bg-slate-100 border-slate-200 text-slate-700';
        const bannerText = iWon ? '⚡ 先取！あなたの +1pt！' : oppWon ? '💨 相手が先に正解…' : b.roundReason === 'both_foul' ? '❌ 両者お手付き（0pt）' : '⏱ 時間切れ（0pt）';
        roundBanner = `
          <div class="animate-pop space-y-2 pt-1">
            <div class="rounded-xl px-3.5 py-2.5 border text-xs font-extrabold flex items-center justify-between gap-2 ${bannerStyle}">
              <span>${bannerText}</span>
              <span class="px-2.5 py-0.5 rounded-full bg-white/80 text-slate-900 text-xs font-extrabold tabular-nums">現在 ${myScore} - ${oppScore}</span>
            </div>
            <div class="rounded-xl bg-amber-50 border border-amber-200 px-3 py-2 text-xs text-slate-700">
              <div class="font-extrabold text-amber-900 mb-0.5">正解: ${escapeHtml(q.answer)}</div>
              <div>${escapeHtml(q.exp)}</div>
            </div>
            ${isHost ? `<button type="button" id="btn-battle-next-now" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">次の問題へ →</button>` : `<p class="text-center text-[11px] text-slate-400 font-semibold">まもなく次の問題へ進みます…</p>`}
          </div>
        `;
      } else if (myFouled) {
        roundBanner = `
          <div class="rounded-xl bg-rose-50 border border-rose-200 px-3.5 py-2.5 text-center text-xs font-extrabold text-rose-700 animate-pop">
            ⚠️ お手付き！この問題はもう解答できません（相手の解答・タイムアップ待ち）
          </div>
        `;
      }

      return `
        <div class="flex flex-col gap-3">
          <div class="bg-white rounded-2xl border border-slate-200 p-3 shadow-xs">
            <div class="grid grid-cols-3 items-center text-center gap-2 mb-2">
              <div class="rounded-xl px-2 py-1.5 bg-indigo-50 border border-indigo-100">
                <div class="text-[10px] font-bold text-indigo-600">あなた ${myFouled ? '❌' : ''}</div>
                <div class="text-xl font-extrabold text-indigo-950 tabular-nums">${myScore}</div>
              </div>
              <div>
                <div class="text-[11px] font-bold text-slate-400">第 ${b.qIndex + 1} / ${b.deck.length} 問</div>
                <div id="battle-timer-text" class="text-base font-extrabold text-indigo-700 tabular-nums">${isRoundEnd ? '終了' : '20.0s'}</div>
              </div>
              <div class="rounded-xl px-2 py-1.5 bg-rose-50 border border-rose-100">
                <div class="text-[10px] font-bold text-rose-600">相手 ${oppFouled ? '❌' : ''}</div>
                <div class="text-xl font-extrabold text-rose-900 tabular-nums">${oppScore}</div>
              </div>
            </div>
            <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
              <div id="battle-timer-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-100" style="width: ${isRoundEnd ? '0%' : '100%'}"></div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">${escapeHtml(q.sub)}</span>
              ${oppFouled && !isRoundEnd ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">相手がお手付き！チャンス</span>` : ''}
            </div>
            <h2 class="text-[15px] font-extrabold text-slate-900 leading-relaxed">${escapeHtml(q.prompt)}</h2>
          </div>

          ${answerUi}
          ${roundBanner}
        </div>
      `;
    }

    function renderBattleSummary() {
      const b = state.battle;
      const isHost = b.role === 'host';
      const myScore = isHost ? b.hostScore : b.guestScore;
      const oppScore = isHost ? b.guestScore : b.hostScore;
      const resultTitle = myScore > oppScore ? '🏆 WIN! あなたの勝ち！' : myScore < oppScore ? '😢 LOSE… 相手の勝ち' : '🤝 DRAW! 引き分け！';
      const resultColor = myScore > oppScore ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : myScore < oppScore ? 'text-rose-700 bg-rose-50 border-rose-200' : 'text-amber-700 bg-amber-50 border-amber-200';

      return `
        <div class="space-y-4 animate-pop">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 text-center shadow-sm">
            <div class="inline-block px-4 py-1.5 rounded-full border text-sm font-extrabold mb-3 ${resultColor}">${resultTitle}</div>
            <div class="flex items-center justify-center gap-6 my-2">
              <div>
                <div class="text-xs font-bold text-indigo-600">あなた</div>
                <div class="text-4xl font-extrabold text-indigo-950 tabular-nums">${myScore}</div>
              </div>
              <div class="text-xl font-bold text-slate-300">vs</div>
              <div>
                <div class="text-xs font-bold text-rose-600">相手</div>
                <div class="text-4xl font-extrabold text-rose-900 tabular-nums">${oppScore}</div>
              </div>
            </div>
            <p class="text-xs text-slate-500 mt-1">${getBattleSubjectLabel(b.subject)} ・ ${escapeHtml(getBattleScopeName(b.subject, b.scope))}（全${b.deck.length}問）</p>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-2">
            <h3 class="text-sm font-bold text-slate-800">全11問の結果</h3>
            ${b.roundResults.map((r, i) => {
              const q = b.deck[r.qIndex];
              if (!q) return '';
              const badge = r.winner === b.role ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">あなた +1</span>' : r.winner ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700">相手 +1</span>' : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">0pt</span>';
              return `
                <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="text-[11px] font-bold text-slate-800 truncate">${i + 1}. ${escapeHtml(q.prompt)}</div>
                    <div class="text-[11px] font-extrabold text-indigo-700">答: ${escapeHtml(q.answer)}</div>
                  </div>
                  <div class="shrink-0">${badge}</div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="grid grid-cols-1 gap-2">
            ${isHost ? `<button type="button" id="btn-battle-rematch" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md">🔄 同じ相手ともう1戦（11問）</button>` : `<p class="text-center text-xs text-slate-500 font-semibold py-2">ホストが再戦を開始すると自動で始まります</p>`}
            <button type="button" id="btn-exit-battle" class="w-full py-3 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50">← 通常モードに戻る</button>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 8. 統合イベントリスナー
    // ==========================================
    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-open-battle]')) { openBattleLobby(); return; }
      if (e.target.closest('#btn-exit-battle')) { exitBattleMode(); return; }
      if (e.target.closest('[data-download-app-html]')) {
        try {
          const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'study_master_app.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('HTMLファイルを保存しました！Safari/Chromeで開いてください');
        } catch (err) {
          showToast('保存できませんでした');
        }
        return;
      }
      const battleRoleBtn = e.target.closest('[data-battle-role]');
      if (battleRoleBtn) {
        cleanupBattleConnection();
        state.battle.role = battleRoleBtn.dataset.battleRole;
        state.battle.connStatus = 'idle';
        state.battle.errorMsg = '';
        render();
        return;
      }
      const battleDirBtn = e.target.closest('[data-battle-dir]');
      if (battleDirBtn) { state.battle.direction = battleDirBtn.dataset.battleDir; render(); return; }
      if (e.target.closest('#btn-battle-create')) { createBattleHostRoom(); return; }
      if (e.target.closest('#btn-battle-join')) { joinBattleRoom(); return; }
      if (e.target.closest('#btn-battle-start') || e.target.closest('#btn-battle-rematch')) { startBattleMatch(); return; }
      if (e.target.closest('#btn-battle-next-now')) { advanceBattleHost(); return; }

      const bKeyBtn = e.target.closest('[data-bkey]');
      if (bKeyBtn && !bKeyBtn.disabled && state.battle.active && state.battle.phase === 'playing') {
        if (state.battle.histInputYear.length < 4) { state.battle.histInputYear += bKeyBtn.dataset.bkey; render(); }
        return;
      }
      if (e.target.closest('#btn-b-clear')) { state.battle.histInputYear = ''; render(); return; }
      if (e.target.closest('#btn-b-back')) { state.battle.histInputYear = state.battle.histInputYear.slice(0, -1); render(); return; }
      if (e.target.closest('#btn-b-submit')) {
        if (state.battle.histInputYear.length < 4) { showToast('4桁の西暦を入力してください'); return; }
        submitBattleAnswer(state.battle.histInputYear);
        return;
      }
      const bChoiceBtn = e.target.closest('[data-bchoice-idx]');
      if (bChoiceBtn && !bChoiceBtn.disabled && state.battle.active && state.battle.phase === 'playing') {
        const idx = Number(bChoiceBtn.dataset.bchoiceIdx);
        const q = state.battle.deck[state.battle.qIndex];
        if (q && q.choices && q.choices[idx] !== undefined) submitBattleAnswer(q.choices[idx]);
        return;
      }

      const subjBtn = e.target.closest('[data-subject]');
      if (subjBtn && state.battle.active) {
        cleanupBattleConnection();
        state.battle.active = false;
      }
      if (subjBtn) {
        state.subject = subjBtn.dataset.subject;
        render();
        return;
      }

      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) {
        state.activeTab = tabBtn.dataset.tab;
        render();
        return;
      }

      // 歴史操作
      const histUnitBtn = e.target.closest('[data-hist-unit]');
      if (histUnitBtn && !histUnitBtn.disabled) { state.histUnit = histUnitBtn.dataset.histUnit; render(); return; }
      const histLimBtn = e.target.closest('[data-hist-limit]');
      if (histLimBtn) { const v = histLimBtn.dataset.histLimit; state.histLimit = v === 'all' ? 'all' : Number(v); render(); return; }
      if (e.target.closest('#btn-start-hist') || e.target.closest('#btn-retry-hist')) { startHistQuiz(); return; }
      if (e.target.closest('#btn-quit-hist') || e.target.closest('#btn-back-hist')) { state.histPhase = 'setup'; render(); return; }
      if (e.target.closest('#btn-hist-hint')) { state.histShowHint = true; render(); return; }
      if (e.target.closest('#btn-hist-pass')) { submitHistAnswer(true); return; }
      const keyBtn = e.target.closest('[data-key]');
      if (keyBtn && state.subject === 'history' && state.histPhase === 'playing') {
        if (state.histInputYear.length < 4) { state.histInputYear += keyBtn.dataset.key; render(); }
        return;
      }
      if (e.target.closest('#btn-clear-input')) { state.histInputYear = ''; render(); return; }
      if (e.target.closest('#btn-backspace')) { state.histInputYear = state.histInputYear.slice(0, -1); render(); return; }
      if (e.target.closest('#btn-submit-hist')) { submitHistAnswer(false); return; }
      if (e.target.closest('#btn-next-hist')) { nextHistQuestion(); return; }
      if (e.target.closest('#btn-start-wrong-hist')) { startHistQuiz('wrong'); return; }

      // 英単語操作
      const engDirBtn = e.target.closest('[data-eng-dir]');
      if (engDirBtn) { state.engDirection = engDirBtn.dataset.engDir; render(); return; }
      const engScopeBtn = e.target.closest('[data-eng-scope]');
      if (engScopeBtn && !engScopeBtn.disabled) { state.engScope = engScopeBtn.dataset.engScope; render(); return; }
      const engLimBtn = e.target.closest('[data-eng-limit]');
      if (engLimBtn) { const v = engLimBtn.dataset.engLimit; state.engLimit = v === 'all' ? 'all' : Number(v); render(); return; }
      if (e.target.closest('#btn-start-eng') || e.target.closest('#btn-retry-eng')) { startEngQuiz(); return; }
      if (e.target.closest('#btn-quit-eng') || e.target.closest('#btn-back-eng')) { state.engPhase = 'setup'; render(); return; }
      const choiceBtn = e.target.closest('[data-choice-idx]');
      if (choiceBtn && !choiceBtn.disabled) { selectEngChoice(Number(choiceBtn.dataset.choiceIdx)); return; }
      if (e.target.closest('#btn-pass-eng')) { selectEngChoice(-1); return; }
      if (e.target.closest('#btn-next-eng')) { nextEngQuestion(); return; }
      if (e.target.closest('#btn-start-wrong-eng')) { startEngQuiz('wrong'); return; }

      // 地理操作
      const geoScopeBtn = e.target.closest('[data-geo-scope]');
      if (geoScopeBtn && !geoScopeBtn.disabled) { state.geoScope = geoScopeBtn.dataset.geoScope; render(); return; }
      const geoLimBtn = e.target.closest('[data-geo-limit]');
      if (geoLimBtn) { const v = geoLimBtn.dataset.geoLimit; state.geoLimit = v === 'all' ? 'all' : Number(v); render(); return; }
      if (e.target.closest('#btn-start-geo') || e.target.closest('#btn-retry-geo')) { startGeoQuiz(); return; }
      if (e.target.closest('#btn-quit-geo') || e.target.closest('#btn-back-geo')) { state.geoPhase = 'setup'; render(); return; }
      const geoChoiceBtn = e.target.closest('[data-geo-choice-idx]');
      if (geoChoiceBtn && !geoChoiceBtn.disabled) { selectGeoChoice(Number(geoChoiceBtn.dataset.geoChoiceIdx)); return; }
      if (e.target.closest('#btn-pass-geo')) { selectGeoChoice(-1); return; }
      if (e.target.closest('#btn-next-geo')) { nextGeoQuestion(); return; }
      if (e.target.closest('#btn-start-wrong-geo')) { startGeoQuiz('wrong'); return; }

      // 歴史一問一答操作
      const hqaDirBtn = e.target.closest('[data-hqa-dir]');
      if (hqaDirBtn) { state.histQaDirection = hqaDirBtn.dataset.hqaDir; render(); return; }
      const hqaScopeBtn = e.target.closest('[data-hqa-scope]');
      if (hqaScopeBtn && !hqaScopeBtn.disabled) { state.histQaScope = hqaScopeBtn.dataset.hqaScope; render(); return; }
      const hqaLimBtn = e.target.closest('[data-hqa-limit]');
      if (hqaLimBtn) { const v = hqaLimBtn.dataset.hqaLimit; state.histQaLimit = v === 'all' ? 'all' : Number(v); render(); return; }
      if (e.target.closest('#btn-start-hqa') || e.target.closest('#btn-retry-hqa')) { startHistQaQuiz(); return; }
      if (e.target.closest('#btn-quit-hqa') || e.target.closest('#btn-back-hqa')) { state.histQaPhase = 'setup'; render(); return; }
      const hqaChoiceBtn = e.target.closest('[data-hqa-choice-idx]');
      if (hqaChoiceBtn && !hqaChoiceBtn.disabled) { selectHistQaChoice(Number(hqaChoiceBtn.dataset.hqaChoiceIdx)); return; }
      if (e.target.closest('#btn-pass-hqa')) { selectHistQaChoice(-1); return; }
      if (e.target.closest('#btn-next-hqa')) { nextHistQaQuestion(); return; }
      if (e.target.closest('#btn-start-wrong-hqa')) { startHistQaQuiz('wrong'); return; }

      // セーブコード・ファイル・リセット操作
      if (e.target.closest('[data-copy-savecode]')) {
        const code = state.subject === 'history' ? encodeHistSaveCode(state.histProgress) : state.subject === 'histqa' ? encodeHistQaSaveCode(state.histQaProgress) : state.subject === 'english' ? encodeEngSaveCode(state.engProgress) : encodeGeoSaveCode(state.geoProgress);
        const displayEl = document.getElementById('savecode-display');
        if (syncCopyText(code, displayEl)) {
          showToast('セーブコードをコピーしました！');
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(() => showToast('セーブコードをコピーしました！')).catch(() => showToast('枠内のコードを長押ししてコピーしてください'));
        } else {
          showToast('枠内のコードを長押ししてコピーしてください');
        }
        return;
      }

      if (e.target.closest('#btn-download-savefile')) {
        const subj = state.subject;
        const code = subj === 'history' ? encodeHistSaveCode(state.histProgress) : subj === 'histqa' ? encodeHistQaSaveCode(state.histQaProgress) : subj === 'english' ? encodeEngSaveCode(state.engProgress) : encodeGeoSaveCode(state.geoProgress);
        const fn = subj === 'history' ? 'nihonshi_quiz_save.txt' : subj === 'histqa' ? 'rekishi_ichimon_save.txt' : subj === 'english' ? 'target1200_save.txt' : 'kanagawa_geo_save.txt';
        showToast(downloadSaveFile(code, fn) ? 'セーブファイルを保存しました' : '保存できませんでした');
        return;
      }

      if (e.target.closest('#btn-restore-savecode')) {
        const inputEl = document.getElementById('savecode-input');
        const val = inputEl ? inputEl.value : '';
        const hRestored = decodeHistSaveCode(val);
        if (hRestored) {
          state.histProgress = hRestored;
          saveHistProgress();
          state.subject = 'history';
          showToast(`歴史の進捗を復元しました（${Object.keys(hRestored.records).length}問）`);
          render();
          return;
        }
        const eRestored = decodeEngSaveCode(val);
        if (eRestored) {
          state.engProgress = eRestored;
          saveEngProgress();
          state.subject = 'english';
          showToast(`英単語の進捗を復元しました（${Object.keys(eRestored.records).length}語）`);
          render();
          return;
        }
        const gRestored = decodeGeoSaveCode(val);
        if (gRestored) {
          state.geoProgress = gRestored;
          saveGeoProgress();
          state.subject = 'geo';
          showToast(`地理の進捗を復元しました（${Object.keys(gRestored.records).length}問）`);
          render();
          return;
        }
        const qRestored = decodeHistQaSaveCode(val);
        if (qRestored) {
          state.histQaProgress = qRestored;
          saveHistQaProgress();
          state.subject = 'histqa';
          showToast(`歴史一問一答の進捗を復元しました（${Object.keys(qRestored.records).length}問）`);
          render();
          return;
        }
        showToast('セーブコードの形式が正しくありません');
        return;
      }

      if (e.target.closest('[data-reset-wrong-only]')) {
        const subj = state.subject;
        openModal(
          '間違えた問題だけをリセット',
          '「間違えた問題だけ」の欄を0件にリセットします。通算の正答率や累計の間違い回数ランキングはそのまま残ります。',
          'リセットする',
          () => {
            if (subj === 'history') {
              Object.keys(state.histProgress.records).forEach(k => { state.histProgress.records[k].needsReview = false; });
              if (state.histUnit === 'wrong') state.histUnit = 'all';
              saveHistProgress();
            } else if (subj === 'english') {
              Object.keys(state.engProgress.records).forEach(k => { state.engProgress.records[k].needsReview = false; });
              if (state.engScope === 'wrong') state.engScope = '1';
              saveEngProgress();
            } else if (subj === 'geo') {
              Object.keys(state.geoProgress.records).forEach(k => { state.geoProgress.records[k].needsReview = false; });
              if (state.geoScope === 'wrong') state.geoScope = 'all';
              saveGeoProgress();
            } else {
              Object.keys(state.histQaProgress.records).forEach(k => { state.histQaProgress.records[k].needsReview = false; });
              if (state.histQaScope === 'wrong') state.histQaScope = 'all';
              saveHistQaProgress();
            }
            showToast('間違えた問題の欄をリセットしました');
            render();
          }
        );
        return;
      }

      if (e.target.closest('#btn-reset-stats')) {
        const subj = state.subject;
        openModal(
          subj === 'history' ? '歴史の成績をリセット' : subj === 'histqa' ? '歴史一問一答の成績をリセット' : subj === 'english' ? '英単語の成績をリセット' : '地理の成績をリセット',
          `${subj === 'history' ? '歴史年号' : subj === 'histqa' ? '歴史一問一答' : subj === 'english' ? '英単語1200' : '中学地理'}の記録をすべて消去します。よろしいですか？`,
          'リセットする',
          () => {
            if (subj === 'history') {
              state.histProgress = { records: {}, sessions: [] };
              saveHistProgress();
            } else if (subj === 'english') {
              state.engProgress = { records: {}, sessions: [] };
              saveEngProgress();
            } else if (subj === 'geo') {
              state.geoProgress = { records: {}, sessions: [] };
              saveGeoProgress();
            } else {
              state.histQaProgress = { records: {}, sessions: [] };
              saveHistQaProgress();
            }
            showToast('成績データをリセットしました');
            render();
          }
        );
        return;
      }

      if (e.target.closest('#btn-toggle-redsheet')) {
        if (state.subject === 'history') state.histRedSheet = !state.histRedSheet;
        else if (state.subject === 'histqa') state.histQaRedSheet = !state.histQaRedSheet;
        else if (state.subject === 'english') state.engRedSheet = !state.engRedSheet;
        else state.geoRedSheet = !state.geoRedSheet;
        render();
        return;
      }

      const listFilterBtn = e.target.closest('[data-list-filter]');
      if (listFilterBtn) {
        if (state.subject === 'history') state.histListFilter = listFilterBtn.dataset.listFilter;
        else if (state.subject === 'histqa') state.histQaListFilter = listFilterBtn.dataset.listFilter;
        else if (state.subject === 'english') state.engListFilter = listFilterBtn.dataset.listFilter;
        else state.geoListFilter = listFilterBtn.dataset.listFilter;
        render();
        return;
      }

      const redPill = e.target.closest('.red-pill');
      if (redPill && ((state.subject === 'history' && state.histRedSheet) || (state.subject === 'histqa' && state.histQaRedSheet) || (state.subject === 'english' && state.engRedSheet) || (state.subject === 'geo' && state.geoRedSheet))) {
        redPill.classList.toggle('revealed');
        return;
      }

      if (e.target.closest('#modal-cancel')) { closeModal(); return; }
      if (e.target.closest('#modal-confirm')) {
        if (typeof modalConfirmCallback === 'function') modalConfirmCallback();
        closeModal();
        return;
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.id === 'battle-room-input') {
        state.battle.joinInput = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
        e.target.value = state.battle.joinInput;
        return;
      }
      if (e.target.id === 'list-search-input') {
        const pos = e.target.selectionStart;
        if (state.subject === 'history') state.histListSearch = e.target.value;
        else if (state.subject === 'histqa') state.histQaListSearch = e.target.value;
        else if (state.subject === 'english') state.engListSearch = e.target.value;
        else state.geoListSearch = e.target.value;
        render();
        const inputEl = document.getElementById('list-search-input');
        if (inputEl) { inputEl.focus(); inputEl.setSelectionRange(pos, pos); }
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target.id === 'battle-scope-select') { state.battle.scope = e.target.value; render(); return; }
      if (e.target.id === 'list-unit-select') { state.histListUnit = e.target.value; render(); return; }
      if (e.target.id === 'list-section-select') { state.engListSection = e.target.value; render(); return; }
      if (e.target.id === 'list-region-select') { state.geoListRegion = e.target.value; render(); return; }
      if (e.target.id === 'list-hqa-unit-select') { state.histQaListUnit = e.target.value; render(); return; }
      if (e.target.id === 'savefile-input') {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const hRes = decodeHistSaveCode(reader.result);
          if (hRes) {
            state.histProgress = hRes;
            saveHistProgress();
            state.subject = 'history';
            showToast(`歴史の記録を復元しました（${Object.keys(hRes.records).length}問）`);
            render();
            return;
          }
          const eRes = decodeEngSaveCode(reader.result);
          if (eRes) {
            state.engProgress = eRes;
            saveEngProgress();
            state.subject = 'english';
            showToast(`英単語の記録を復元しました（${Object.keys(eRes.records).length}語）`);
            render();
            return;
          }
          const gRes = decodeGeoSaveCode(reader.result);
          if (gRes) {
            state.geoProgress = gRes;
            saveGeoProgress();
            state.subject = 'geo';
            showToast(`地理の記録を復元しました（${Object.keys(gRes.records).length}問）`);
            render();
            return;
          }
          const qRes = decodeHistQaSaveCode(reader.result);
          if (qRes) {
            state.histQaProgress = qRes;
            saveHistQaProgress();
            state.subject = 'histqa';
            showToast(`歴史一問一答の記録を復元しました（${Object.keys(qRes.records).length}問）`);
            render();
            return;
          }
          showToast('有効なセーブファイルではありません');
        };
        reader.readAsText(file);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (state.activeTab !== 'quiz') return;
      if (state.subject === 'history') {
        if (state.histPhase === 'playing') {
          if (/^[0-9]$/.test(e.key)) { e.preventDefault(); if (state.histInputYear.length < 4) { state.histInputYear += e.key; render(); } }
          else if (e.key === 'Backspace') { e.preventDefault(); state.histInputYear = state.histInputYear.slice(0, -1); render(); }
          else if (e.key === 'Escape') { state.histInputYear = ''; render(); }
          else if (e.key === 'Enter') { e.preventDefault(); submitHistAnswer(false); }
        } else if (state.histPhase === 'feedback' && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault(); nextHistQuestion();
        }
      } else if (state.subject === 'english') {
        if (state.engPhase === 'playing') {
          if (state.engAnsweredIdx === null && /^[1-8]$/.test(e.key)) { e.preventDefault(); selectEngChoice(Number(e.key) - 1); }
          else if (state.engAnsweredIdx !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextEngQuestion(); }
        }
      } else if (state.subject === 'geo') {
        if (state.geoPhase === 'playing') {
          if (state.geoAnsweredIdx === null && /^[1-8]$/.test(e.key)) { e.preventDefault(); selectGeoChoice(Number(e.key) - 1); }
          else if (state.geoAnsweredIdx !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextGeoQuestion(); }
        }
      } else {
        if (state.histQaPhase === 'playing') {
          if (state.histQaAnsweredIdx === null && /^[1-8]$/.test(e.key)) { e.preventDefault(); selectHistQaChoice(Number(e.key) - 1); }
          else if (state.histQaAnsweredIdx !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextHistQaQuestion(); }
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      render();
      idbLoadAndSync(HIST_IDB_NAME, 'history');
      idbLoadAndSync(ENG_IDB_NAME, 'english');
      idbLoadAndSync(GEO_IDB_NAME, 'geo');
      idbLoadAndSync(HQA_IDB_NAME, 'histqa');
    });
  </script>
</body>
</html>
