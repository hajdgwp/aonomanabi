  <!-- トースト通知 -->

  <script>
    // ==========================================
    // 1. 歴史年号データ & 英単語ターゲット1200データ
    // ==========================================
    const UNITS = [
      { id: '14', name: '14 明治維新', short: '明治維新', color: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
      { id: '15', name: '15 自由民権運動', short: '自由民権', color: 'bg-sky-100 text-sky-800 border-sky-200' },
      { id: '16', name: '16 日清・日露戦争', short: '日清・日露', color: 'bg-amber-100 text-amber-800 border-amber-200' },
      { id: '17', name: '17 第一次世界大戦と大正デモクラシー', short: '第一次大戦', color: 'bg-violet-100 text-violet-800 border-violet-200' },
      { id: '18', name: '18 世界恐慌と第二次世界大戦', short: '世界恐慌・WW2', color: 'bg-rose-100 text-rose-800 border-rose-200' },
      { id: '19', name: '19 戦後の世界', short: '戦後の世界', color: 'bg-indigo-100 text-indigo-800 border-indigo-200' }
    ];

    const QUESTIONS = [
      // --- 14 明治維新 (p.150-151) ---
      { id: 'q14_01', unit: '14', year: '1854', event: '日露和親（通好）条約が結ばれる', hint: '択捉島以南は日本領、得撫島以北はロシア領', detail: '1854年。ロシアとの国境を定め、択捉島以南を日本領、得撫島以北をロシア領とした。(p.151)' },
      { id: 'q14_02', unit: '14', year: '1868', event: '五箇条の御誓文が出される', hint: '明治天皇が新しい政治の方針を示す', detail: '1868年。明治天皇が天地神明に誓う形で新政府の基本方針を示した。(p.150)' },
      { id: 'q14_03', unit: '14', year: '1868', event: '五榜の掲示が出される', hint: '民衆が守るべききまり（一揆・キリスト教禁止など）', detail: '1868年。五箇条の御誓文の翌日に、民衆に向けて一揆やキリスト教の禁止などを掲示した。(p.150)' },
      { id: 'q14_04', unit: '14', year: '1868', event: '年号を「明治」に改め、江戸を東京と改称して首都とする', hint: '一世一元の制（天皇一代につき一つの元号）', detail: '1868年。年号を明治に改めて一世一元の制を定め、江戸を東京と改称して天皇が移った。(p.150)' },
      { id: 'q14_05', unit: '14', year: '1869', event: '版籍奉還が行われる', hint: '大名が土地(版)と人民(籍)を天皇に返還', detail: '1869年。大名が土地（版）と人民（籍）を天皇に返還し、元の藩主は知藩事に任命された。(p.150)' },
      { id: 'q14_06', unit: '14', year: '1871', event: '廃藩置県が行われる', hint: '藩を廃止して県を置き、府知事・県令を派遣', detail: '1871年。藩を廃止して県を置き、中央政府から府知事・県令を派遣して中央集権体制を確立した。(p.150)' },
      { id: 'q14_07', unit: '14', year: '1871', event: '解放令が出される', hint: 'えた・ひにんの身分をなくし平民とする', detail: '1871年。えた・ひにんの身分差別を法令上廃止して平民としたが、差別は残った。(p.150)' },
      { id: 'q14_08', unit: '14', year: '1871', event: '郵便制度が始まる', hint: '前島密による近代的な郵便の整備', detail: '1871年。前島密の建議により東京・京都・大阪間で近代的な郵便制度が開始された。(p.151)' },
      { id: 'q14_09', unit: '14', year: '1871', event: '岩倉使節団が欧米に派遣される', hint: '岩倉具視を全権大使、津田梅子ら留学生も同行', detail: '1871年。不平等条約改正の予備交渉と欧米の制度・産業の視察のため派遣された。(p.151)' },
      { id: 'q14_10', unit: '14', year: '1871', event: '日清修好条規が結ばれる', hint: '清と対等な立場で条約を結ぶ', detail: '1871年。明治政府が清と結んだ初の対等な条約。(p.151)' },
      { id: 'q14_11', unit: '14', year: '1872', event: '学制が発布される', hint: '6歳以上の男女に義務教育', detail: '1872年。国民皆学をめざして6歳以上の男女すべてに小学校教育を受けさせる制度を定めた。(p.150)' },
      { id: 'q14_12', unit: '14', year: '1872', event: '琉球王国を琉球藩とする', hint: '清に対して日本の領有を主張', detail: '1872年。明治政府が琉球王国を琉球藩とし、日本の領有を主張した。(p.151)' },
      { id: 'q14_13', unit: '14', year: '1873', event: '徴兵令が出される', hint: '20歳以上の男子に3年間の兵役義務', detail: '1873年。満20歳以上の男子に兵役の義務を課した（当初は免除規定もあった）。(p.150)' },
      { id: 'q14_14', unit: '14', year: '1873', event: '地租改正が始まる', hint: '地券を発行し、地価の3%を現金で納める新税制', detail: '1873年。豊作・不作にかかわらず地価の3%を土地所有者が現金で納めるようにし、財政を安定させた。(p.150)' },
      { id: 'q14_15', unit: '14', year: '1874', event: '台湾出兵が行われる', hint: '漂着した琉球民が台湾で殺害されたことがきっかけ', detail: '1874年。琉球民殺害事件を口実に台湾へ出兵し、清に日本の琉球領有を事実上認めさせた。(p.151)' },
      { id: 'q14_16', unit: '14', year: '1875', event: '江華島事件が起こる', hint: '日本の軍艦に対し、朝鮮側から砲撃', detail: '1875年。朝鮮の江華島付近で日本軍艦が測量中に朝鮮側から砲撃を受けた事件。(p.151)' },
      { id: 'q14_17', unit: '14', year: '1875', event: '樺太・千島交換条約が結ばれる', hint: '樺太はロシア領、千島列島は日本領とする', detail: '1875年。ロシアとの間で樺太全島をロシア領、千島列島を日本領と取り決めた。(p.151)' },
      { id: 'q14_18', unit: '14', year: '1876', event: '日朝修好条規が結ばれる', hint: '江華島事件を口実に結んだ朝鮮にとって不平等な条約', detail: '1876年。朝鮮に開国を迫り、日本の領事裁判権などを認める不平等条約を結んだ。(p.151)' },
      { id: 'q14_19', unit: '14', year: '1877', event: '地租改正反対一揆を受け、地租が地価の3%から2.5%に引き下げられる', hint: '「竹槍でどんとつき出す二分五厘」', detail: '1877年。各地で起きた地租改正反対一揆により、政府は税率を2.5%へ引き下げた。(p.150, 160)' },
      { id: 'q14_20', unit: '14', year: '1879', event: '沖縄県を設置する（琉球処分）', hint: '最後の王・尚泰を東京へ移住させる', detail: '1879年。琉球藩を廃止して沖縄県を設置し、琉球処分を完了した。(p.151)' },
      { id: 'q14_21', unit: '14', year: '1886', event: '小学校の義務教育期間が4年間と定められる', hint: 'その後1907年に6年間へ延長', detail: '1886年。義務教育期間が4年間に定められた。(p.150)' },
      { id: 'q14_22', unit: '14', year: '1899', event: '北海道旧土人保護法が制定される', hint: 'アイヌの人々に対する政策', detail: '1899年。北海道開拓が進む中、アイヌの人々に土地を与える名目で制定されたが差別は続いた。(p.151)' },
      { id: 'q14_23', unit: '14', year: '1907', event: '小学校の義務教育期間が6年間に延長される（就学率97%）', hint: '日露戦争後の教育拡充', detail: '1907年。義務教育が6年間に延長され、就学率は97%に達した。(p.150, 172)' },

      // --- 15 自由民権運動 (p.160-161) ---
      { id: 'q15_01', unit: '15', year: '1873', event: '明治六年の政変が起こる', hint: '征韓論に敗れた板垣退助・西郷隆盛らが下野', detail: '1873年。征韓論をめぐる対立で敗れた西郷隆盛・板垣退助・江藤新平らが政府を去った。(p.160)' },
      { id: 'q15_02', unit: '15', year: '1874', event: '佐賀の乱が起こる', hint: '江藤新平らによる士族の反乱', detail: '1874年。下野した江藤新平らが佐賀県で起こした最初の本格的な士族の反乱。(p.160)' },
      { id: 'q15_03', unit: '15', year: '1874', event: '板垣退助らが民撰議院設立の建白書を政府に提出する', hint: '自由民権運動の始まり', detail: '1874年。藩閥政治を批判し、国民が選んだ議員による議会開設を求めた。(p.160)' },
      { id: 'q15_04', unit: '15', year: '1874', event: '板垣退助が高知に立志社をつくる', hint: '各地に同様の政治結社ができるきっかけ', detail: '1874年。板垣退助が地元高知に政治結社「立志社」を設立した。(p.160)' },
      { id: 'q15_05', unit: '15', year: '1875', event: '板垣退助が大阪で愛国社をつくる', hint: '民権運動を全国に広げるための組織', detail: '1875年。立志社などの組織を全国的に結びつけるため大阪に愛国社を設立した。(p.160)' },
      { id: 'q15_06', unit: '15', year: '1876', event: '秋月の乱・神風連の乱・萩の乱が相次いで起こる', hint: '廃刀令や家禄の廃止に対する士族の不満', detail: '1876年。熊本（神風連）、福岡（秋月）、山口（萩）で士族の反乱が連続して発生した。(p.160)' },
      { id: 'q15_07', unit: '15', year: '1876', event: '国が公債を一時金として渡す代わりに家禄（俸禄）を廃止する', hint: '士族の特権の廃止', detail: '1876年。秩禄処分により、明治政府は士族への家禄支給を完全に廃止した。(p.160)' },
      { id: 'q15_08', unit: '15', year: '1877', event: '西南戦争が起こる', hint: '西郷隆盛を中心に鹿児島の士族が起こした最大・最後の反乱', detail: '1877年。西郷隆盛を擁立した鹿児島士族の反乱。政府軍に鎮圧され、以後は言論による運動へ移る。(p.160)' },
      { id: 'q15_09', unit: '15', year: '1880', event: '国会期成同盟が結成される', hint: '全国の民権派の代表が大阪に集まり国会開設を求める', detail: '1880年。愛国社が中心となって大阪で結成され、全国から集めた請願書を政府に提出した。(p.160)' },
      { id: 'q15_10', unit: '15', year: '1881', event: '開拓使官有物払下げ事件が起こる', hint: '北海道の開拓使の施設を政府関係者が安く払い下げようとして批判', detail: '1881年。薩摩出身の官僚と商人の癒着が新聞で報道され、政府への批判が急激に高まった。(p.160)' },
      { id: 'q15_11', unit: '15', year: '1881', event: '国会開設の勅諭が出される', hint: '10年後（1890年まで）に国会を開くと約束、大隈重信を追放', detail: '1881年。明治十四年の政変で大隈重信を追放するとともに、1890年までの国会開設を約束した。(p.160)' },
      { id: 'q15_12', unit: '15', year: '1881', event: '板垣退助が自由党を結成する', hint: 'フランス流の急進的な自由主義を掲げる政党', detail: '1881年。国会開設に向けて、板垣退助を党首として日本初の本格的な政党「自由党」が結成された。(p.160)' },
      { id: 'q15_13', unit: '15', year: '1882', event: '大隈重信が立憲改進党を結成する', hint: 'イギリス流の議会政治を目指す政党', detail: '1882年。大隈重信を中心に都市の知識人や商工業者を集めて立憲改進党が結成された。(p.161)' },
      { id: 'q15_14', unit: '15', year: '1882', event: '福島事件が起こる', hint: '自由党員らが県令の圧政に抵抗した激化事件', detail: '1882年。松方デフレによる農民の困窮などを背景に起きた激化事件の一つ。(p.161)' },
      { id: 'q15_15', unit: '15', year: '1884', event: '秩父事件が起こる', hint: '埼玉県秩父地方で困民党を組織して農民が蜂起', detail: '1884年。埼玉県秩父地方の農民が借金返済の猶予などを求めて蜂起し、軍隊に鎮圧された。(p.161)' },
      { id: 'q15_16', unit: '15', year: '1885', event: '内閣制度が発足し、伊藤博文が初代内閣総理大臣になる', hint: 'ドイツ（プロイセン）の憲法を学んだ伊藤が整備', detail: '1885年。太政官制に代わって内閣制度が創設され、伊藤博文が初代首相に就任した。(p.161)' },
      { id: 'q15_17', unit: '15', year: '1889', event: '大日本帝国憲法が発布される（2月11日）', hint: 'アジア初の近代憲法、天皇主権', detail: '1889年2月11日。天皇が国民に与える欽定憲法として発布された。(p.161)' },
      { id: 'q15_18', unit: '15', year: '1890', event: '帝国議会が開設される', hint: '衆議院と貴族院の二院制、直接国税15円以上の25歳以上男子に選挙権', detail: '1890年。第1回衆議院議員総選挙を経て、アジア初の近代議会である帝国議会が開かれた。(p.161)' },
      { id: 'q15_19', unit: '15', year: '1890', event: '教育勅語が発布される', hint: '忠君愛国や親への孝行など国民道徳の基本', detail: '1890年。天皇への忠義と親への孝行を柱とする国民道徳の指針として発布された。(p.161)' },
      { id: 'q15_20', unit: '15', year: '1898', event: '大隈重信が板垣退助とともに初めての政党内閣を組織する', hint: '隈板内閣（憲政党）', detail: '1898年。自由党と進歩党が合同した憲政党を基盤に、日本初の政党内閣が誕生した。(p.161)' },
      { id: 'q15_21', unit: '15', year: '1900', event: '伊藤博文が立憲政友会を結成する', hint: '衆議院の多数派と結びつくための新政党', detail: '1900年。伊藤博文が官僚や旧自由党系議員を集めて立憲政友会を結成し、内閣を組織した。(p.161)' },

      // --- 16 日清・日露戦争 (p.170-172) ---
      { id: 'q16_01', unit: '16', year: '1882', event: '日本銀行が設立される', hint: '金融制度の整備、中央銀行', detail: '1882年。不換紙幣の整理と近代的な金融制度の確立のため日本銀行が設立された。(p.172)' },
      { id: 'q16_02', unit: '16', year: '1884', event: '甲申事変が起こる', hint: '金玉均ら親日派のクーデター（失敗）', detail: '1884年。朝鮮で金玉均ら親日派がクーデターを起こしたが清の介入で失敗し、日本の勢力が後退した。(p.170)' },
      { id: 'q16_03', unit: '16', year: '1886', event: 'ノルマントン号事件が起こる', hint: '紀伊半島沖でイギリス貨物船が沈没、領事裁判権撤廃の世論高まる', detail: '1886年。日本人乗客全員が水死したのにイギリス人船長が無罪となり、治外法権撤廃への世論が急激に高まった。(p.171)' },
      { id: 'q16_04', unit: '16', year: '1889', event: '東海道線が全線開通する', hint: '新橋〜神戸間の鉄道整備', detail: '1889年。東京と関西を結ぶ東海道線が全線開通し、日本の鉄道網が大きく前進した。(p.172)' },
      { id: 'q16_05', unit: '16', year: '1891', event: '大津事件が起こる', hint: '大津市でロシア皇太子が襲撃された事件', detail: '1891年。滋賀県大津市で来日中のロシア皇太子が警備中の巡査に襲撃され、条約改正交渉が中止された。(p.171)' },
      { id: 'q16_06', unit: '16', year: '1894', event: '甲午農民戦争が起こる', hint: '朝鮮半島で東学を信仰する農民が反乱', detail: '1894年。朝鮮で東学を信仰する農民が反乱を起こし、朝鮮政府が清に援軍を求めた。(p.170)' },
      { id: 'q16_07', unit: '16', year: '1894', event: '日清戦争が始まる', hint: '朝鮮に出兵した日本軍と清軍が衝突', detail: '1894年。甲午農民戦争への出兵を機に日本と清が朝鮮の支配権をめぐって開戦した。(p.170)' },
      { id: 'q16_08', unit: '16', year: '1894', event: '日英通商航海条約が結ばれ、領事裁判権（治外法権）の撤廃に成功する', hint: '外務大臣は陸奥宗光', detail: '1894年。日清戦争開戦直前に陸奥宗光外相がイギリスとの間で領事裁判権の撤廃に成功した。(p.171)' },
      { id: 'q16_09', unit: '16', year: '1895', event: '下関条約が結ばれる', hint: '清が朝鮮の独立を認め、遼東半島・台湾・賠償金2億両を日本へ', detail: '1895年。下関講和会議で伊藤博文・陸奥宗光と李鴻章が調印し、日清戦争が終結した。(p.170)' },
      { id: 'q16_10', unit: '16', year: '1895', event: '三国干渉が起こる', hint: 'ロシア・フランス・ドイツが遼東半島の返還を要求', detail: '1895年。ロシア・フランス・ドイツの3国が日本に遼東半島を清に返還するよう要求し、日本は受け入れた。(p.170)' },
      { id: 'q16_11', unit: '16', year: '1897', event: '朝鮮が国名を「大韓帝国」とする', hint: '下関条約で清から独立した後', detail: '1897年。清の冊封体制から離れた朝鮮が国号を大韓帝国と改めた。(p.170)' },
      { id: 'q16_12', unit: '16', year: '1899', event: '義和団事件が起こる（〜1900年）', hint: '「扶清滅洋」を唱える義和団が蜂起', detail: '1899〜1900年。中国で義和団が外国勢力排斥を掲げて蜂起し、北京の外国公使館を包囲して8か国連合軍に鎮圧された。(p.170)' },
      { id: 'q16_13', unit: '16', year: '1901', event: '八幡製鉄所が操業を開始する', hint: '日清戦争の賠償金を使って福岡県に建設、重工業の産業革命', detail: '1901年。中国の大冶鉄鉱石と筑豊炭田の石炭を利用し、日本初の本格的な官営製鉄所が操業開始した。(p.171-172)' },
      { id: 'q16_14', unit: '16', year: '1901', event: '社会民主党が結成される（日本初の社会主義政党）', hint: '片山潜・幸徳秋水らが設立、すぐに禁止', detail: '1901年。片山潜や幸徳秋水らによって日本初の社会主義政党として結成されたが、即日禁止された。(p.172)' },
      { id: 'q16_15', unit: '16', year: '1902', event: '日英同盟が結ばれる', hint: 'ロシアの南下を恐れたイギリスと日本が提携', detail: '1902年。義和団事件後も満州に駐留を続けるロシアに対抗するため、日本とイギリスが同盟を結んだ。(p.170)' },
      { id: 'q16_16', unit: '16', year: '1903', event: '国定教科書制度が始まる', hint: '小学校の教科書を国が作成し全国一律に', detail: '1903年。小学校の教科書を国が編纂し、全国一律の教科書で学習する制度が始まった。(p.172)' },
      { id: 'q16_17', unit: '16', year: '1904', event: '日露戦争が始まる', hint: '満州の各地で戦い、奉天会戦・日本海海戦など', detail: '1904年。満州・朝鮮の権益をめぐり日本とロシアが開戦した。(p.170)' },
      { id: 'q16_18', unit: '16', year: '1905', event: 'ポーツマス条約が結ばれる', hint: 'アメリカの仲介で講和、樺太の南半分の割譲・賠償金なし', detail: '1905年。アメリカ大統領の仲介で小村寿太郎らが調印し、韓国での日本の優越権などが認められた。(p.171)' },
      { id: 'q16_19', unit: '16', year: '1905', event: '日比谷焼き打ち事件が起こる', hint: 'ポーツマス条約で賠償金が得られなかったことへの不満', detail: '1905年。重税に耐えた国民が賠償金なしの講和条約に反発し、東京・日比谷で暴動を起こした。(p.171)' },
      { id: 'q16_20', unit: '16', year: '1905', event: '日本が韓国の外交権を奪い、保護国とする', hint: '第二次日韓協約', detail: '1905年。ポーツマス条約の直後、日本は韓国の外交権を奪って保護国化した。(p.171)' },
      { id: 'q16_21', unit: '16', year: '1906', event: '韓国統監府が設置される（初代統監：伊藤博文）', hint: '韓国の政治を事実上支配', detail: '1906年。韓国の内政・外交を監督するため韓国統監府が置かれ、伊藤博文が初代統監となった。(p.171)' },
      { id: 'q16_22', unit: '16', year: '1906', event: '鉄道が国有化される', hint: '日露戦争後の軍事・経済上の必要性から', detail: '1906年。鉄道国有法により民営の幹線鉄道が買収され国有化された。(p.172)' },
      { id: 'q16_23', unit: '16', year: '1907', event: '日本が韓国の軍隊・警察を解散させる（義兵運動が激化）', hint: 'ハーグ密使事件の後', detail: '1907年。韓国の軍隊・警察が解散させられ、各地で日本への抵抗（義兵運動）が激しくなった。(p.171)' },
      { id: 'q16_24', unit: '16', year: '1909', event: '伊藤博文が満州のハルビンで安重根に暗殺される', hint: '韓国併合の前年', detail: '1909年。前韓国統監の伊藤博文がハルビン駅で韓国の独立運動家・安重根に射殺された。(p.171)' },
      { id: 'q16_25', unit: '16', year: '1910', event: '韓国併合が行われる', hint: '韓国を「朝鮮」と改め、朝鮮総督府を置く', detail: '1910年。日本が韓国を併合して植民地とし、朝鮮総督府を置いて武断政治と同化政策を進めた。(p.171)' },
      { id: 'q16_26', unit: '16', year: '1910', event: '大逆事件が起こる', hint: '天皇暗殺を計画したとして幸徳秋水ら社会主義者を逮捕・死刑', detail: '1910年。天皇暗殺を計画したとして多数の社会主義者が検挙され、幸徳秋水ら12名が死刑となった。(p.172)' },
      { id: 'q16_27', unit: '16', year: '1911', event: '関税自主権の完全回復を達成する', hint: '外務大臣は小村寿太郎', detail: '1911年。小村寿太郎外相の交渉により、幕末以来の不平等条約がついに完全に改正された。(p.171)' },
      { id: 'q16_28', unit: '16', year: '1911', event: '中国で辛亥革命が起こる', hint: '清を倒す革命運動、翌年に中華民国建国', detail: '1911年。孫文の三民主義の影響を受けた革命運動が中国各地に広がり、清朝打倒へと向かった。(p.171)' },
      { id: 'q16_29', unit: '16', year: '1912', event: '中華民国が建国される', hint: 'アジア初の共和国、首都は南京、孫文が臨時大総統', detail: '1912年。清の皇帝が退位し、孫文を臨時大総統としてアジア初の共和国「中華民国」が成立した。(p.171)' },

      // --- 17 第一次世界大戦と大正デモクラシー (p.184-185) ---
      { id: 'q17_01', unit: '17', year: '1882', event: '三国同盟が結ばれる', hint: 'ドイツ・オーストリア・イタリア', detail: '1882年。ドイツを中心にオーストリア・イタリアが結んだ軍事同盟。(p.184)' },
      { id: 'q17_02', unit: '17', year: '1907', event: '三国協商が成立する', hint: 'イギリス・フランス・ロシア', detail: '1907年。三国同盟に対抗し、イギリス・フランス・ロシアの提携関係が完成した。(p.184)' },
      { id: 'q17_03', unit: '17', year: '1912', event: '第一次護憲運動（護憲運動）が起こる', hint: '桂太郎内閣を退陣させる', detail: '1912年。立憲政友会の尾崎行雄や立憲国民党の犬養毅らが憲法に基づく政治を求め、桂太郎内閣を退陣に追い込んだ。(p.185)' },
      { id: 'q17_04', unit: '17', year: '1914', event: 'サラエボ事件が起こる', hint: 'オーストリア皇太子夫妻がセルビア人の青年に暗殺される', detail: '1914年6月。ボスニアのサラエボで起きた暗殺事件が第一次世界大戦の直接のきっかけとなった。(p.184)' },
      { id: 'q17_05', unit: '17', year: '1914', event: '第一次世界大戦が始まる', hint: '同盟国と連合国の対立、日本は日英同盟を理由に参戦', detail: '1914年。ヨーロッパ列強の対立から世界大戦へ発展。日本も日英同盟を理由に連合国側で参戦した。(p.184)' },
      { id: 'q17_06', unit: '17', year: '1915', event: '日本が中国に二十一か条の要求を出す', hint: '山東省のドイツ権益の引き継ぎなど、中国の反日感情が高まる', detail: '1915年。大隈重信内閣が袁世凱政府に対し、軍事力を背景に要求の大部分を認めさせた。(p.184)' },
      { id: 'q17_07', unit: '17', year: '1917', event: 'ロシア革命が起こる', hint: 'レーニンの指導によりソビエトを中心とする社会主義政府をつくる', detail: '1917年。食料危機によるストライキと兵士の反乱で帝政が倒れ、レーニン率いる世界初の社会主義政権が誕生した。(p.184)' },
      { id: 'q17_08', unit: '17', year: '1917', event: '中立だったアメリカが連合国側に立って第一次世界大戦に参戦する', hint: 'ドイツの無制限潜水艦作戦がきっかけ', detail: '1917年。アメリカの参戦により、連合国側が戦局を大きく有利に進めることになった。(p.184)' },
      { id: 'q17_09', unit: '17', year: '1918', event: 'シベリア出兵が行われる', hint: 'ロシア革命を阻止するため日本・アメリカ・イギリスなどが派兵', detail: '1918年。資本主義諸国が革命に干渉するため出兵し、日本はその後も長く軍を駐留させた。(p.184)' },
      { id: 'q17_10', unit: '17', year: '1918', event: 'ドイツが降伏し、第一次世界大戦が終戦する', hint: '連合国側の勝利', detail: '1918年11月。ドイツ革命によって皇帝が退位し降伏、約4年続いた第一次世界大戦が終わった。(p.184)' },
      { id: 'q17_11', unit: '17', year: '1918', event: 'イギリスで女性に参政権が認められる', hint: '総力戦での女性の活躍を背景に（30歳以上）', detail: '1918年。第一次世界大戦後、イギリスで一定の年齢以上の女性に選挙権が認められた。(p.185)' },
      { id: 'q17_12', unit: '17', year: '1919', event: 'パリ講和会議でベルサイユ条約が結ばれる', hint: 'ドイツの植民地喪失・多額の賠償金・軍備制限', detail: '1919年。敗戦国ドイツに厳しい賠償と軍備制限を課し、日本は山東省のドイツ権益を引き継いだ。(p.184)' },
      { id: 'q17_13', unit: '17', year: '1919', event: 'ドイツでワイマール憲法が制定される', hint: '世界で初めて生存権を規定した民主的な憲法', detail: '1919年。20歳以上の男女普通選挙や労働者の団結権・生存権を規定した画期的な憲法。(p.185)' },
      { id: 'q17_14', unit: '17', year: '1919', event: '中国で五・四運動が起こる', hint: '5月4日、ベルサイユ条約に反対する北京の学生デモ', detail: '1919年5月4日。山東省権益の日本引き継ぎに抗議し、北京の学生から全国へ反日運動が広がった。(p.185)' },
      { id: 'q17_15', unit: '17', year: '1919', event: '朝鮮で三・一独立運動が起こる', hint: '3月1日、日本の植民地支配に対する独立運動', detail: '1919年3月1日。ソウルで独立宣言が発表され朝鮮全土に広がったが、日本軍により弾圧された。(p.185)' },
      { id: 'q17_16', unit: '17', year: '1919', event: '孫文が中国国民党を組織する', hint: '後の1924年に共産党と協力（国共合作）', detail: '1919年。五・四運動などの高まりの中、孫文が中国統一をめざして中国国民党を結成した。(p.185)' },
      { id: 'q17_17', unit: '17', year: '1920', event: '国際連盟が設立される', hint: 'アメリカ大統領ウィルソンの提案、本部はジュネーブ', detail: '1920年。世界平和をめざし42か国が加盟して発足したが、アメリカは不参加だった。(p.185)' },
      { id: 'q17_18', unit: '17', year: '1920', event: 'アメリカで男女平等の普通選挙が実現する', hint: '参政権の拡大', detail: '1920年。アメリカ合衆国憲法修正第19条により女性参政権が認められた。(p.185)' },
      { id: 'q17_19', unit: '17', year: '1921', event: 'ワシントン会議が開かれる', hint: '海軍軍備制限・山東省権益の中国返還・日英同盟破棄', detail: '1921年。主力艦の保有比率制限（米5:英5:日3）や九か国条約、四か国条約が結ばれた。(p.185)' },
      { id: 'q17_20', unit: '17', year: '1922', event: 'ソビエト社会主義共和国連邦（ソ連）が成立する', hint: 'レーニンの指導、死後はスターリンによる独裁体制', detail: '1922年。ロシアを中心に周辺の共和国が統合してソ連が成立した。(p.184)' },
      { id: 'q17_21', unit: '17', year: '1924', event: 'イギリスで初の労働党内閣が誕生する', hint: '労働者政党による政権', detail: '1924年。イギリスで労働者の支持を背景に初の労働党内閣が成立した。(p.185)' },
      { id: 'q17_22', unit: '17', year: '1928', event: 'イギリスで男女平等の普通選挙が実現する', hint: '21歳以上の男女すべてに選挙権', detail: '1928年。イギリスで男性と同じ年齢条件での女性参政権が認められた。(p.185)' },

      // --- 18 世界恐慌と第二次世界大戦 (p.198-200) ---
      { id: 'q18_01', unit: '18', year: '1927', event: '日本で金融恐慌が起こる', hint: '銀行の倒産がきっかけで不景気が広がる', detail: '1927年。震災手形処理をめぐる議会での失言などから銀行への取り付け騒ぎが広がった。(p.198)' },
      { id: 'q18_02', unit: '18', year: '1927', event: '蔣介石が南京に国民政府を樹立する', hint: '中国統一を目指し、北京へ侵攻', detail: '1927年。孫文の死後、国民党を率いた蔣介石が南京に国民政府を樹立した。(p.198)' },
      { id: 'q18_03', unit: '18', year: '1928', event: '張作霖爆殺事件が起こる', hint: '満州の軍閥・張作霖が関東軍によって爆殺される', detail: '1928年。満州の直接支配をもくろむ関東軍の一部が奉天郊外で張作霖を爆殺した。(p.198)' },
      { id: 'q18_04', unit: '18', year: '1929', event: '世界恐慌が起こる', hint: 'ニューヨーク株式市場での株価大暴落がきっかけ', detail: '1929年10月。アメリカの株価暴落から世界中に深刻な不景気が広がった。(p.198)' },
      { id: 'q18_05', unit: '18', year: '1930', event: '日本で昭和恐慌が起こる', hint: '世界恐慌の影響で生糸などの対米輸出が急減、欠食児童増加', detail: '1930年。世界恐慌と金解禁が重なり、労働者の賃金切り下げや農産物価格暴落が深刻化した。(p.198)' },
      { id: 'q18_06', unit: '18', year: '1930', event: 'ロンドン海軍軍縮会議が開かれる', hint: '補助艦の保有制限を定める、浜口雄幸首相が襲撃される', detail: '1930年。海軍の補助艦制限をめぐり軍部が統帥権干犯と反発し、浜口雄幸首相が狙撃された。(p.198)' },
      { id: 'q18_07', unit: '18', year: '1931', event: '満州事変が起こる（柳条湖事件）', hint: '関東軍が南満州鉄道の線路を爆破し、満州全土を占領', detail: '1931年9月。奉天郊外の柳条湖で関東軍が自ら線路を爆破し、中国軍のしわざとして軍事行動を起こした。(p.198)' },
      { id: 'q18_08', unit: '18', year: '1932', event: '満州国が建国される', hint: '清朝最後の皇帝・溥儀を元首とする', detail: '1932年。関東軍の主導で溥儀を元首とする満州国が建国された。(p.198)' },
      { id: 'q18_09', unit: '18', year: '1932', event: '五・一五事件が起こる', hint: '犬養毅首相が海軍将校に暗殺され、政党内閣が終わる', detail: '1932年5月15日。海軍の青年将校らが首相官邸を襲撃し、犬養毅首相を暗殺。以後は軍部の発言力が強まった。(p.198)' },
      { id: 'q18_10', unit: '18', year: '1933', event: '日本が国際連盟を脱退する', hint: 'リットン調査団の報告採択に抗議、松岡洋右代表が退場', detail: '1933年。満州国を認めない国際連盟の決議に反発し、日本は脱退して国際的に孤立した。(p.199)' },
      { id: 'q18_11', unit: '18', year: '1936', event: '二・二六事件が起こる', hint: '陸軍の青年将校が大臣らを殺害し、首相官邸などを襲撃', detail: '1936年2月26日。陸軍の青年将校らが約1400人の兵を率いてクーデターを起こし、軍部の政治的発言力が決定的となった。(p.199)' },
      { id: 'q18_12', unit: '18', year: '1936', event: '日独防共協定が結ばれる', hint: '国際的に孤立した日本がナチス・ドイツに接近', detail: '1936年。共産主義に対抗する名目で日本とドイツが協定を結び、後にイタリアも加わった。(p.199)' },
      { id: 'q18_13', unit: '18', year: '1936', event: 'スペインの町ゲルニカが無差別爆撃を受ける', hint: 'ピカソが抗議して大作『ゲルニカ』を描く', detail: '1936年（スペイン内戦）。ドイツ空軍による無差別爆撃を受け、ピカソが反戦の絵画を描いた。(p.199)' },
      { id: 'q18_14', unit: '18', year: '1937', event: '盧溝橋事件が起こり、日中戦争が始まる', hint: '北京郊外の盧溝橋で日中両軍が衝突、南京事件・抗日民族統一戦線', detail: '1937年7月。北京郊外での衝突から全面戦争へ拡大し、蔣介石と毛沢東が抗日民族統一戦線を結成した。(p.199)' },
      { id: 'q18_15', unit: '18', year: '1938', event: '国家総動員法が制定される', hint: '議会の承認なく国民や物資を戦争へ動員できる法律', detail: '1938年。近衛文麿内閣のもと、政府が国民の労働力や物資を統制・動員できる権限を握った。(p.199)' },
      { id: 'q18_16', unit: '18', year: '1938', event: 'ドイツがオーストリア全土とチェコスロバキアの一部を併合する', hint: 'ナチス・ドイツの領土拡大', detail: '1938年。ヒトラー率いるドイツがオーストリアを併合し、さらにミュンヘン会談でチェコスロバキアの一部を獲得した。(p.199)' },
      { id: 'q18_17', unit: '18', year: '1939', event: '独ソ不可侵条約が結ばれる', hint: 'ドイツとソ連が互いに攻撃しないことを約束', detail: '1939年8月。敵対していたドイツとソ連が秘密議定書を含む不可侵条約を結んだ。(p.199)' },
      { id: 'q18_18', unit: '18', year: '1939', event: 'ドイツがポーランドに侵攻し、第二次世界大戦が始まる', hint: 'イギリス・フランスがドイツに宣戦布告', detail: '1939年9月。ドイツのポーランド侵攻に対し、イギリス・フランスが宣戦布告して第二次世界大戦が開戦した。(p.199)' },
      { id: 'q18_19', unit: '18', year: '1940', event: '大政翼賛会と大日本産業報国会がつくられる', hint: '全ての政党・労働組合が解散されて統合', detail: '1940年。新体制運動のもと、すべての政党が大政翼賛会に、労働組合が産業報国会に合流した。(p.199)' },
      { id: 'q18_20', unit: '18', year: '1940', event: '日本がフランス領インドシナ北部へ侵攻し、日独伊三国同盟を結ぶ', hint: '石油などの資源確保と米英への対抗', detail: '1940年。日本は北部仏印に進駐し、さらにドイツ・イタリアと軍事同盟（三国同盟）を結んだ。(p.199-200)' },
      { id: 'q18_21', unit: '18', year: '1941', event: '日ソ中立条約を結び、フランス領インドシナ南部へ侵攻する', hint: 'アメリカが石油・鉄などの対日輸出を禁止（ABCD包囲網）', detail: '1941年。北方の安全を確保して南部仏印へ進駐したことで、アメリカの対日石油禁輸を招いた。(p.200)' },
      { id: 'q18_22', unit: '18', year: '1941', event: '大西洋憲章が発表される', hint: 'アメリカのルーズベルトとイギリスのチャーチルが民主主義擁護を発表', detail: '1941年8月。米英首脳が第二次世界大戦後の平和構想や領土不拡大を宣言した。(p.199)' },
      { id: 'q18_23', unit: '18', year: '1941', event: 'ハワイの真珠湾攻撃などで太平洋戦争が始まる（12月8日）', hint: 'マレー半島上陸と真珠湾攻撃で米英に宣戦布告', detail: '1941年12月8日。日本軍の真珠湾攻撃とマレー半島攻撃により太平洋戦争が開戦した。(p.200)' },
      { id: 'q18_24', unit: '18', year: '1942', event: 'ミッドウェー海戦で日本軍が敗れる', hint: '太平洋戦争の戦局の転換点', detail: '1942年6月。主力空母4隻を失う大敗を喫し、日本は制海権・制空権を失って守勢に回った。(p.200)' },
      { id: 'q18_25', unit: '18', year: '1943', event: 'ガダルカナル島の戦いで日本が敗れ、ヨーロッパではイタリアが降伏する', hint: '枢軸国の一角が崩壊', detail: '1943年。日本軍はガダルカナル島から撤退し、ヨーロッパではムッソリーニ失脚後にイタリアが降伏した。(p.200)' },
      { id: 'q18_26', unit: '18', year: '1944', event: '連合国軍がノルマンディーに上陸しパリを解放、アジアではサイパン島が占領される', hint: '日本本土への空襲が激化するきっかけ', detail: '1944年。欧州ではノルマンディー上陸作戦が成功し、太平洋ではサイパン島陥落でB29による本土空襲が始まった。(p.200)' },
      { id: 'q18_27', unit: '18', year: '1945', event: 'ヤルタ会談・東京大空襲・沖縄戦・ドイツ降伏・原爆投下・ポツダム宣言受諾', hint: '第二次世界大戦・太平洋戦争が終結（8月15日）', detail: '1945年。2月ヤルタ会談、3月東京大空襲、4月沖縄上陸、5月ドイツ降伏、7月ポツダム宣言、8月6日広島・9日長崎原爆、8日ソ連参戦、14日ポツダム宣言受諾。(p.200)' },

      // --- 19 戦後の世界 (p.210-214) ---
      { id: 'q19_01', unit: '19', year: '1945', event: '国際連合が発足する（10月）', hint: '国際連合憲章に51か国が調印、本部はニューヨーク', detail: '1945年10月。米・ソ・英・仏・中の5か国を常任理事国として国際連合が発足した。(p.211)' },
      { id: 'q19_02', unit: '19', year: '1946', event: '天皇の人間宣言が出される（1月1日）', hint: '天皇が自らの神格性を否定する', detail: '1946年1月1日。昭和天皇が年頭詔書で自らの神格性を否定し、象徴天皇制への道が開かれた。(p.210)' },
      { id: 'q19_03', unit: '19', year: '1946', event: '日本国憲法が公布される（11月3日）', hint: '施行は翌年の5月3日', detail: '1946年11月3日。国民主権・基本的人権の尊重・平和主義を三大原則とする日本国憲法が公布された。(p.210)' },
      { id: 'q19_04', unit: '19', year: '1947', event: '日本国憲法が施行され、教育基本法・独占禁止法が制定される', hint: '6・3・3・4制の教育、財閥解体と市場支配の禁止', detail: '1947年。5月3日に日本国憲法が施行され、同年に教育基本法や独占禁止法も制定された。(p.210)' },
      { id: 'q19_05', unit: '19', year: '1948', event: '朝鮮半島に大韓民国と朝鮮民主主義人民共和国が建国される', hint: '北緯38度線を境に分断国家が成立', detail: '1948年。南側に資本主義の大韓民国、北側に社会主義の朝鮮民主主義人民共和国が成立した。(p.211)' },
      { id: 'q19_06', unit: '19', year: '1949', event: '北大西洋条約機構（NATO）が結成される', hint: '資本主義陣営（西側陣営）の軍事同盟', detail: '1949年。冷戦の激化に伴い、アメリカと西ヨーロッパ諸国が軍事同盟NATOを結成した。(p.211)' },
      { id: 'q19_07', unit: '19', year: '1949', event: '西ドイツと東ドイツがそれぞれ独立する', hint: 'ドイツの東西分裂', detail: '1949年。米英仏の占領地域が西ドイツ、ソ連の占領地域が東ドイツとしてそれぞれ独立した。(p.211)' },
      { id: 'q19_08', unit: '19', year: '1949', event: '中華人民共和国が建国される', hint: '毛沢東率いる共産党が勝利、国民党は台湾へ', detail: '1949年10月。国共内戦に勝利した毛沢東が北京で中華人民共和国の建国を宣言した。(p.211)' },
      { id: 'q19_09', unit: '19', year: '1950', event: '朝鮮戦争が始まり、日本で警察予備隊が設置される', hint: '朝鮮特需（特需景気）で日本経済が好景気に', detail: '1950年。朝鮮戦争が勃発（〜53年休戦）し、GHQの指令で日本に警察予備隊（後の自衛隊）が置かれた。(p.211-212)' },
      { id: 'q19_10', unit: '19', year: '1951', event: 'サンフランシスコ平和条約と日米安全保障条約が結ばれる', hint: '吉田茂首相が調印、日本の独立回復', detail: '1951年。アメリカなど48か国と平和条約を結んで主権を回復し、同時に日米安保条約を締結した。(p.212)' },
      { id: 'q19_11', unit: '19', year: '1954', event: '第五福竜丸事件が起こる', hint: 'ビキニ環礁でのアメリカの水爆実験で被曝', detail: '1954年。日本のマグロ漁船が水爆実験の「死の灰」を浴び、原水爆禁止運動が全国に広がった。(p.213)' },
      { id: 'q19_12', unit: '19', year: '1955', event: 'ワルシャワ条約機構が結成される', hint: 'ソ連と東ヨーロッパ諸国（東側陣営）の軍事同盟', detail: '1955年。NATOに対抗してソ連を中心に東側陣営の軍事同盟が結成された。(p.211)' },
      { id: 'q19_13', unit: '19', year: '1955', event: 'アジア・アフリカ会議（バンドン会議）が開かれる', hint: 'インドネシアのバンドンで開催、第三世界', detail: '1955年。米ソどちらにも属さないアジア・アフリカの29か国が集まり、平和十原則を採択した。(p.211)' },
      { id: 'q19_14', unit: '19', year: '1955', event: '広島で第1回原水爆禁止世界大会が開かれ、自由民主党・日本社会党が結党する（55年体制）', hint: '政党政治の55年体制の始まり', detail: '1955年。原水爆禁止世界大会が開かれ、国内では自民党と社会党が対立する55年体制が始まった。(p.213)' },
      { id: 'q19_15', unit: '19', year: '1956', event: '日ソ共同宣言に調印し、日本が国際連合に加盟する', hint: '鳩山一郎内閣、北方領土問題は棚上げ', detail: '1956年。ソ連と国交を回復したことでソ連の拒否権がなくなり、日本の国連加盟が実現した。(p.213)' },
      { id: 'q19_16', unit: '19', year: '1960', event: '新しい日米安全保障条約の改定（安保闘争）と所得倍増計画', hint: '岸信介内閣から池田勇人内閣へ', detail: '1960年。岸内閣が強行採決した新安保条約に反対する安保闘争が起き、続く池田内閣が所得倍増計画を掲げた。(p.213)' },
      { id: 'q19_17', unit: '19', year: '1960', event: '「アフリカの年」（1年に17か国が独立）', hint: 'アフリカの植民地独立ラッシュ', detail: '1960年。アフリカで1年間に17か国が相次いで独立を達成し、「アフリカの年」と呼ばれた。(p.211)' },
      { id: 'q19_18', unit: '19', year: '1961', event: 'ベルリンの壁が建設される', hint: '東ベルリンの人々の西側への流出を防ぐため', detail: '1961年。東ドイツが西ベルリンとの境界に壁を築き、東西冷戦の象徴となった。(p.211)' },
      { id: 'q19_19', unit: '19', year: '1962', event: 'キューバ危機が起こる', hint: 'ソ連がキューバにミサイル基地を建設し米ソ全面戦争の危機', detail: '1962年。ケネディとフルシチョフの交渉によりソ連がミサイルを撤去し、核戦争の危機が回避された。(p.211)' },
      { id: 'q19_20', unit: '19', year: '1964', event: '東海道新幹線が開通し、東京オリンピックが開催される', hint: '高度経済成長の象徴', detail: '1964年。アジア初のオリンピックが東京で開催され、あわせて東海道新幹線も開業した。(p.213)' },
      { id: 'q19_21', unit: '19', year: '1965', event: '日韓基本条約が結ばれる', hint: '韓国と国交を回復', detail: '1965年。日本と大韓民国が国交を正常化したが、北朝鮮とは現在も国交がない。(p.213)' },
      { id: 'q19_22', unit: '19', year: '1967', event: 'ヨーロッパ共同体（EC）が成立し、日本では公害対策基本法が制定される', hint: '欧州統合の前進と日本の公害対策', detail: '1967年。欧州でECが発足し、日本では四大公害病などを受けて公害対策基本法（後の環境基本法）が制定された。(p.211, 214)' },
      { id: 'q19_23', unit: '19', year: '1968', event: '小笠原諸島が日本に復帰し、日本のGNPが資本主義国で世界2位になる', hint: '高度経済成長による経済大国化', detail: '1968年。小笠原諸島が返還され、日本の国民総生産（GNP）がアメリカに次ぐ世界第2位となった。(p.213)' },
      { id: 'q19_24', unit: '19', year: '1970', event: '日本万国博覧会（大阪万博）が開催される', hint: 'アジア初の万博', detail: '1970年。大阪府吹田市で「人類の進歩と調和」をテーマに大阪万博が開催された。(p.213)' },
      { id: 'q19_25', unit: '19', year: '1971', event: '国会で非核三原則が決議され、環境庁が発足する', hint: '「持たず、つくらず、持ち込ませず」', detail: '1971年。核兵器に関する非核三原則が国会で決議され、公害問題に対応するため環境庁が設置された。(p.213-214)' },
      { id: 'q19_26', unit: '19', year: '1972', event: '沖縄が日本に復帰し、日中国交正常化（日中共同声明）が実現する', hint: '佐藤栄作内閣・田中角栄内閣', detail: '1972年。5月に沖縄が日本に復帰し、9月に田中角栄首相が訪中して日中共同声明に調印した。(p.213)' },
      { id: 'q19_27', unit: '19', year: '1973', event: '石油危機（オイルショック）が起こる', hint: '第四次中東戦争がきっかけ、戦後初のマイナス成長', detail: '1973年。アラブ産油国の石油戦略により原油価格が急騰し、日本の高度経済成長が終わった。(p.214)' },
      { id: 'q19_28', unit: '19', year: '1976', event: 'ベトナム社会主義共和国が成立する', hint: '北ベトナムが勝利し南北統一', detail: '1976年。ベトナム戦争でアメリカ軍が撤退した後、北ベトナムが南を統一して成立した。(p.211)' },

    const GEO_DATA = [{"id": "g001", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "中心からの距離と方位が正しく表され、中心を通る直線が地球上の最短コース（大圏航路）となる図法は？", "a": "正距方位図法", "d": ["メルカトル図法", "モルワイデ図法", "グード図法", "サンソン図法", "正積方位図法", "正角円筒図法", "ランベルト正角図法"], "exp": "神奈川県入試で最頻出の図法。中心から見て真西にある地点や、最短航空路が通る国を判定する問題がよく出ます。"}, {"id": "g002", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "角度が正しく表され、赤道から離れるほど面積が大きく拡大されるため、航海図などに使われる図法は？", "a": "メルカトル図法", "d": ["モルワイデ図法", "正距方位図法", "グード図法", "サンソン図法", "ボンヌ図法", "ミラー図法", "正積円筒図法"], "exp": "緯線と経線が直角に交わるため、目的地への方位角を一定に保つ航路（等角航路）が直線になります。"}, {"id": "g003", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "面積が正しく表され、世界の人口分布や森林面積などの分布図によく使われる図法は？", "a": "モルワイデ図法", "d": ["メルカトル図法", "正距方位図法", "サンソン図法", "グード図法", "ミラー図法", "正角円錐図法", "等距円筒図法"], "exp": "楕円形で高緯度地域の面積歪みを抑えた正積図法。世界の統計分布図でよく出題されます。"}, {"id": "g004", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "地球は24時間で360度自転するため、時差1時間が生じる経度差は何度？", "a": "15度", "d": ["10度", "12度", "18度", "20度", "24度", "30度", "45度"], "exp": "360度 ÷ 24時間 ＝ 15度。神奈川県入試の時差計算では「経度差 ÷ 15 ＝ 時差」が必須です。"}, {"id": "g005", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "世界の標準時の基準となる、イギリスのロンドン（旧グリニッジ天文台）を通る経度0度の線は？", "a": "本初子午線", "d": ["日付変更線", "標準時子午線", "赤道", "北回帰線", "南回帰線", "北極圏線", "中央子午線"], "exp": "ここを基準に東へ行くほど時刻が進み、西へ行くほど時刻が遅れます。"}, {"id": "g006", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "日本の標準時子午線として定められている、兵庫県明石市を通る経線は？", "a": "東経135度", "d": ["東経120度", "東経130度", "東経140度", "東経145度", "東経150度", "西経135度", "東経125度"], "exp": "135 ÷ 15 ＝ 9 なので、日本の標準時はロンドン（経度0度）より9時間進んでいます。"}, {"id": "g007", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "東経・西経180度付近に設定されており、西から東へ越えると日付を1日戻す線は？", "a": "日付変更線", "d": ["本初子午線", "標準時子午線", "赤道", "北回帰線", "南回帰線", "時差境界線", "極圏境界線"], "exp": "太平洋上の島々や国が同じ日付になるよう一部が曲がっています。西→東は1日戻る、東→西は1日進む。"}, {"id": "g008", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "地球の反対側にあたる「対蹠点（たいせきてん）」を求める際、北緯35度・東経140度の反対側は？", "a": "南緯35度・西経40度", "d": ["北緯35度・西経40度", "南緯35度・東経40度", "南緯55度・西経40度", "南緯35度・西経140度", "北緯55度・西経140度", "南緯55度・東経40度", "南緯35度・東経140度"], "exp": "緯度は南北が逆（同じ数字）、経度は東西が逆で「180度 − 元の経度」（180 − 140 ＝ 40度）になります。"}, {"id": "g009", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "地球上で最も長い緯線であり、北半球と南半球を分ける緯度0度の線は？", "a": "赤道", "d": ["本初子午線", "北回帰線", "南回帰線", "日付変更線", "北極圏", "南極圏", "中緯度線"], "exp": "エクアドルやケニア、インドネシアなどを通ります。雨温図の気温変化が小さいのが特徴。"}, {"id": "g010", "region": "w_base", "scope": "world", "cat": "map_coord", "q": "地球上の2地点を結ぶ最短距離のコースのことを何という？", "a": "大圏航路", "d": ["等角航路", "偏西風航路", "貿易風航路", "極点航路", "最短緯線航路", "子午線航路", "海流航路"], "exp": "地球が球体であるため、メルカトル図法では北に膨らんだ曲線になりますが、正距方位図法では直線になります。"}, {"id": "g011", "region": "w_asia", "scope": "world", "cat": "wind", "q": "東アジアや東南アジアの気候に大きな影響を与え、夏は海から、冬は大陸から吹く風は？", "a": "季節風", "d": ["偏西風", "貿易風", "極東風", "海陸風", "山谷風", "からっ風", "フェーン風"], "exp": "モンスーンとも呼ばれます。夏の湿った風により雨季が生まれ、稲作がさかんになります。"}, {"id": "g012", "region": "w_asia", "scope": "world", "cat": "agri_method", "q": "東南アジアや中国南部などの温暖で雨が多い地域で行われる、同じ土地で年に2回米をつくる栽培法は？", "a": "二期作", "d": ["二毛作", "輪作", "焼畑農業", "促成栽培", "抑制栽培", "混合農業", "プランテーション"], "exp": "「二期作」は同じ作物（米）を年2回、「二毛作」は米と麦など異なる作物を年2回つくる点に注意。"}, {"id": "g013", "region": "w_asia", "scope": "world", "cat": "org", "q": "東南アジア諸国が経済・政治などの協力を深めるために結成した地域協力機構は？", "a": "ASEAN", "d": ["APEC", "OPEC", "EU", "USMCA", "BRICS", "OECD", "SAARC"], "exp": "東南アジア諸国連合。1967年に設立され、域内の関税撤廃や工業化（繊維→自動車・電子機器）が進みました。"}, {"id": "g014", "region": "w_asia", "scope": "world", "cat": "religion", "q": "東南アジアのインドネシアで最も多く信仰されており、豚肉を食べない戒律がある宗教は？", "a": "イスラム教", "d": ["ヒンドゥー教", "仏教", "キリスト教", "ユダヤ教", "シク教", "儒教", "道教"], "exp": "アラブ商人などの交易を通じて広まりました。インドネシアは世界最大のイスラム教徒人口を持ちます。"}, {"id": "g015", "region": "w_asia", "scope": "world", "cat": "country", "q": "かつてスペインの植民地支配を受けた影響で、東南アジアで国民の大多数がキリスト教を信仰する国は？", "a": "フィリピン", "d": ["インドネシア", "ベトナム", "タイ", "マレーシア", "ミャンマー", "カンボジア", "シンガポール"], "exp": "植民地支配の歴史と現代の言語・宗教を結びつける問題は神奈川県入試の定番です。"}, {"id": "g016", "region": "w_asia", "scope": "world", "cat": "religion", "q": "インドで大多数の人が信仰し、牛を神聖な動物として食べない宗教は？", "a": "ヒンドゥー教", "d": ["イスラム教", "仏教", "キリスト教", "シク教", "ジャイナ教", "ゾロアスター教", "ユダヤ教"], "exp": "インドの牛肉消費が極端に少ない理由として、宗教的な禁忌がよく問われます。"}, {"id": "g017", "region": "w_asia", "scope": "world", "cat": "religion", "q": "タイやミャンマーなどの東南アジア大陸部で広く信仰されている宗教は？", "a": "仏教", "d": ["イスラム教", "ヒンドゥー教", "キリスト教", "儒教", "道教", "シク教", "ユダヤ教"], "exp": "東南アジアでは大陸部＝仏教、マレーシア・インドネシア＝イスラム教、フィリピン＝キリスト教と整理しよう。"}, {"id": "g018", "region": "w_asia", "scope": "world", "cat": "region_sys", "q": "中国が改革開放政策のもとで外資や技術を導入するために、沿岸部に設置した特別な地域は？", "a": "経済特区", "d": ["自由貿易港", "保税加工区", "工業団地", "特別行政区", "先端技術特区", "経済開発区", "関税同盟区"], "exp": "深圳（シンセン）などが代表例。「世界の工場」として急速な経済成長を遂げる原動力となりました。"}, {"id": "g019", "region": "w_asia", "scope": "world", "cat": "industry_type", "q": "インドのバンガロールなどが世界的な拠点として発展し、英語力と数学教育を背景に伸びた産業は？", "a": "ICT産業", "d": ["航空宇宙産業", "石油化学工業", "鉄鋼業", "自動車産業", "精密機械工業", "繊維工業", "造船業"], "exp": "情報通信技術産業。アメリカとの時差を活かした24時間開発体制も発展の理由として出題されます。"}, {"id": "g020", "region": "w_asia", "scope": "world", "cat": "org", "q": "サウジアラビアやアラブ首長国連邦など西アジアの産油国が、価格や生産量を調整するために組織している機構は？", "a": "OPEC", "d": ["ASEAN", "EU", "APEC", "WTO", "OECD", "USMCA", "NATO"], "exp": "石油輸出国機構。ペルシャ湾岸に世界有数の油田が集まり、石油の輸出に大きく依存しています。"}, {"id": "g021", "region": "w_europe", "scope": "world", "cat": "climate", "q": "西ヨーロッパで多く見られ、高緯度のわりに冬でも温暖で年較差が小さく、年中適度な雨がある気候は？", "a": "西岸海洋性気候", "d": ["地中海性気候", "温暖湿潤気候", "亜寒帯気候", "ステップ気候", "サバナ気候", "ツンドラ気候", "熱帯雨林気候"], "exp": "偏西風と北大西洋海流の影響。ロンドンやパリは北海道より高緯度でも冬が温暖です。"}, {"id": "g022", "region": "w_europe", "scope": "world", "cat": "climate", "q": "イタリアなど南ヨーロッパで見られ、夏は高温で乾燥し、冬にやや雨が降る気候は？", "a": "地中海性気候", "d": ["西岸海洋性気候", "温暖湿潤気候", "ステップ気候", "砂漠気候", "サバナ気候", "亜寒帯気候", "高山気候"], "exp": "雨温図で「夏の降水量が極端に少ないU字型」を見たら地中海性気候！オリーブやぶどうの栽培がさかん。"}, {"id": "g023", "region": "w_europe", "scope": "world", "cat": "current", "q": "西岸海洋性気候をもたらす、ヨーロッパの西岸を北上する暖流は？", "a": "北大西洋海流", "d": ["メキシコ湾流", "日本海流", "対馬海流", "カリフォルニア海流", "ペルー海流", "千島海流", "リマン海流"], "exp": "この暖流の上を通る偏西風が暖かい空気を運ぶため、北極圏に近いノルウェー沿岸でも港が凍りません。"}, {"id": "g024", "region": "w_europe", "scope": "world", "cat": "agri_method", "q": "西ヨーロッパのフランスやドイツなどで行われている、小麦などの作物栽培と豚・牛の飼育を組み合わせた農業は？", "a": "混合農業", "d": ["酪農", "地中海式農業", "園芸農業", "企業的農業", "粗放的農業", "二毛作", "輪作"], "exp": "飼料作物（とうもろこし等）を育てて家畜に与え、家畜のふんを肥料にする循環型の農業です。"}, {"id": "g025", "region": "w_europe", "scope": "world", "cat": "agri_method", "q": "冷涼でやせた土地の多いデンマークやオランダなどでさかんな、乳牛を育ててバターやチーズを生産する農業は？", "a": "酪農", "d": ["混合農業", "地中海式農業", "企業的牧畜", "園芸農業", "近郊農業", "遊牧", "高冷地農業"], "exp": "氷河に削られたやせた土地でも牧草は育つため、酪農が発達しました。"}, {"id": "g026", "region": "w_europe", "scope": "world", "cat": "lang_group", "q": "イタリア・フランス・スペインなどで話されている、ラテン語を起源とする言語系統は？", "a": "ラテン語系", "d": ["ゲルマン語系", "スラブ語系", "ケルト語系", "ウラル語系", "アフロ・アジア語系", "ギリシャ語系", "セム語系"], "exp": "ヨーロッパの三大言語は「ラテン系（南・仏）」「ゲルマン系（英・独・北欧）」「スラブ系（露・東欧）」。"}, {"id": "g027", "region": "w_europe", "scope": "world", "cat": "religion", "q": "北ヨーロッパやイギリス・ドイツ北部などで多く信仰されているキリスト教の宗派は？", "a": "プロテスタント", "d": ["カトリック", "正教会", "イスラム教", "ユダヤ教", "カルヴァン派", "バプテスト派", "福音派"], "exp": "南欧・フランス＝カトリック、北欧・英・独北部＝プロテスタント、東欧・ロシア＝正教会と区別しましょう。"}, {"id": "g028", "region": "w_europe", "scope": "world", "cat": "org", "q": "ヨーロッパの経済・政治統合を進める地域統合体で、共通通貨ユーロの導入国などを含む組織は？", "a": "EU", "d": ["NATO", "OECD", "ASEAN", "USMCA", "EFTA", "APEC", "OPEC"], "exp": "ヨーロッパ連合。加盟国間では人や物の移動が自由ですが、イギリスは2020年に離脱しました。"}, {"id": "g029", "region": "w_europe", "scope": "world", "cat": "river", "q": "スイスからドイツ・オランダを経て北海へ注ぎ、多くの国が共同利用する国際河川は？", "a": "ライン川", "d": ["ドナウ川", "セーヌ川", "テムズ川", "エルベ川", "ロワール川", "ポー川", "ボルガ川"], "exp": "ルール工業地域など沿線の工業地帯を結び、河口のロッテルダム（オランダ）はヨーロッパ最大の貿易港です。"}, {"id": "g030", "region": "w_europe", "scope": "world", "cat": "company", "q": "フランス（トゥールーズ）に本社を置き、EU諸国が国際分業で大型旅客機を生産している企業は？", "a": "エアバス", "d": ["ボーイング", "ルフトハンザ", "ルノー", "フォルクスワーゲン", "ロールス・ロイス", "シーメンス", "フィアット"], "exp": "イギリスで主翼、ドイツで胴体、フランスで最終組み立てなど、EUの国際分業の代表例としてよく出ます。"}, {"id": "g031", "region": "w_africa", "scope": "world", "cat": "econ_term", "q": "植民地時代の支配の名残で、特定の農産物や鉱産資源の輸出に頼る不安定な経済構造を何という？", "a": "モノカルチャー経済", "d": ["プランテーション農業", "アグリビジネス", "国際分業体制", "多角化経済", "自給的経済", "保護貿易経済", "混合経済"], "exp": "国際価格の変動や天候に国の経済が大きく左右されやすいという課題があります。"}, {"id": "g032", "region": "w_africa", "scope": "world", "cat": "region_name", "q": "サハラ砂漠の南縁に広がり、過放牧や過剰な耕作により砂漠化が深刻化している半乾燥地域は？", "a": "サヘル", "d": ["サバンナ", "カラハリ", "ナミブ", "セルバ", "パンパ", "グランチャコ", "アウトバック"], "exp": "「砂漠の岸辺」を意味します。ステップ気候に属し、干ばつと砂漠化の拡大が頻出テーマです。"}, {"id": "g033", "region": "w_africa", "scope": "world", "cat": "country", "q": "西アフリカのギニア湾岸に位置し、カカオ豆の生産が世界第1位で日本にも多く輸出している国は？", "a": "コートジボワール", "d": ["ガーナ", "ナイジェリア", "カメルーン", "ケニア", "エチオピア", "セネガル", "タンザニア"], "exp": "隣国のガーナとともにカカオ豆の生産が世界トップクラス。輸出額に占めるカカオの割合が高いです。"}, {"id": "g034", "region": "w_africa", "scope": "world", "cat": "country", "q": "アフリカ中南部に位置し、銅の輸出に依存するモノカルチャー経済で知られる内陸国は？", "a": "ザンビア", "d": ["ジンバブエ", "ボツワナ", "コンゴ民主共和国", "アンゴラ", "タンザニア", "ナミビア", "モザンビーク"], "exp": "神奈川県入試の貿易品目グラフで「銅」が突出しているアフリカの国が出たらザンビアです。"}, {"id": "g035", "region": "w_africa", "scope": "world", "cat": "country", "q": "アフリカ大陸最南端にあり、金・プラチナ・レアメタルなどの鉱産資源が豊富で、かつてアパルトヘイトが行われていた国は？", "a": "南アフリカ共和国", "d": ["ナミビア", "ボツワナ", "ジンバブエ", "ザンビア", "ケニア", "モザンビーク", "ナイジェリア"], "exp": "BRICSの一員であり、アフリカ最大の工業国。ネルソン・マンデラらにより人種隔離政策が撤廃されました。"}, {"id": "g036", "region": "w_africa", "scope": "world", "cat": "resource", "q": "ハイブリッド車やスマートフォンなどのハイテク製品に不可欠で、アフリカ南部などに偏在する希少金属は？", "a": "レアメタル", "d": ["ベースメタル", "ボーキサイト", "鉄鉱石", "リン鉱石", "ウラン鉱", "オイルサンド", "シェールガス"], "exp": "白金（プラチナ）、クロム、コバルトなど。産出国が偏っているため安定供給が課題です。"}, {"id": "g037", "region": "w_africa", "scope": "world", "cat": "reason_short", "q": "アフリカ諸国の国境線が直線的な場所が多い主な理由は？", "a": "ヨーロッパ諸国が緯線・経線に沿って植民地分割したため", "d": ["砂漠や高原が多く自然な地形の境界がなかったため", "独立後に民族ごとの話し合いで等分に線引きしたため", "国連の指導で時差をそろえるため経線に合わせたため", "鉄道や運河の建設に合わせて直線に区切ったため", "古代王国の領土が緯線・経線を基準にしていたため", "資源の採掘権を均等に分けるため直線で区切ったため", "気候帯の境界線が緯線とほぼ一致していたため"], "exp": "現地の民族や文化の境界を無視して引かれたため、独立後の民族紛争の原因にもなりました。"}, {"id": "g038", "region": "w_africa", "scope": "world", "cat": "country", "q": "アフリカ西部に位置し、石油の産出が多くアフリカ最大の人口を持つ国は？", "a": "ナイジェリア", "d": ["エジプト", "エチオピア", "南アフリカ共和国", "ケニア", "アルジェリア", "ガーナ", "コンゴ民主共和国"], "exp": "人口は約2億人を超え、今後も急速な人口増加が見込まれています。"}, {"id": "g039", "region": "w_africa", "scope": "world", "cat": "desert", "q": "アフリカ大陸の北部を占める世界最大の砂漠は？", "a": "サハラ砂漠", "d": ["カラハリ砂漠", "ナミブ砂漠", "アラビア砂漠", "ゴビ砂漠", "タクラマカン砂漠", "アタカマ砂漠", "グレートサンディ砂漠"], "exp": "この砂漠より北はアラブ人・イスラム教徒が多く、南は黒人系の人々が多いという文化の境界にもなっています。"}, {"id": "g040", "region": "w_africa", "scope": "world", "cat": "year", "q": "アフリカで「アフリカの年」と呼ばれ、1年間で17か国が独立を果たした年は？", "a": "1960年", "d": ["1945年", "1955年", "1958年", "1962年", "1965年", "1970年", "1975年"], "exp": "歴史と地理の融合問題で頻出。1960年に多くのアフリカ諸国が独立しました。"}, {"id": "g041", "region": "w_namerica", "scope": "world", "cat": "agri_method", "q": "アメリカ合衆国で、自然環境や市場との距離に応じて地域ごとに最も適した農産物を栽培する農業を何という？", "a": "適地適作", "d": ["混合農業", "企業的農業", "近郊農業", "促成栽培", "抑制栽培", "輪作", "二期作"], "exp": "西経100度線を境に東は湿潤（とうもろこし・大豆）、西は乾燥（小麦・肉牛）と分かれます。"}, {"id": "g042", "region": "w_namerica", "scope": "world", "cat": "region_name", "q": "アメリカの北緯37度以南の地域で、航空宇宙産業やICT産業など先端技術産業が集積している地域は？", "a": "サンベルト", "d": ["シリコンバレー", "ラストベルト", "グレートプレーンズ", "コーンベルト", "フロストベルト", "五大湖工業地域", "プレイリー"], "exp": "温暖な気候と豊富な労働力・低い税制などを背景に、従来の五大湖周辺（北東部）から産業や人口が移動しました。"}, {"id": "g043", "region": "w_namerica", "scope": "world", "cat": "region_name", "q": "カリフォルニア州サンフランシスコ郊外にあり、世界的なIT企業が集積している地域は？", "a": "シリコンバレー", "d": ["サンベルト", "シリコンアイランド", "ラストベルト", "デトロイト", "シアトル", "ヒューストン", "ボストン"], "exp": "スタンフォード大学など大学の研究機関と企業が結びついて発展しました。"}, {"id": "g044", "region": "w_namerica", "scope": "world", "cat": "people", "q": "アメリカ合衆国で人口割合が増加している、中南米出身のスペイン語を母語とする人々は？", "a": "ヒスパニック", "d": ["メスティソ", "アングロサクソン", "イヌイット", "ネイティブアメリカン", "クレオール", "アボリジニ", "ケベック人"], "exp": "特にメキシコ国境に近い南部や西部で割合が高く、スペイン語表記の案内が増えています。"}, {"id": "g045", "region": "w_namerica", "scope": "world", "cat": "vegetation", "q": "カナダやシベリアの亜寒帯（冷帯）に広がる針葉樹林帯を何という？", "a": "タイガ", "d": ["ツンドラ", "ステップ", "サバンナ", "セルバ", "パンパ", "プレイリー", "マングローブ"], "exp": "紙やパルプ、建築材の原料となる針葉樹が多く、カナダやロシアの林業を支えています。"}, {"id": "g046", "region": "w_namerica", "scope": "world", "cat": "vegetation", "q": "北極海沿岸などの寒帯で見られ、夏だけ表面の氷が溶けてコケ類が生える植生は？", "a": "ツンドラ", "d": ["タイガ", "ステップ", "サバンナ", "セルバ", "パンパ", "プレイリー", "オアシス"], "exp": "永久凍土が広がり、農耕は困難なためトナカイの遊牧や狩猟が行われてきました。"}, {"id": "g047", "region": "w_namerica", "scope": "world", "cat": "org", "q": "アメリカ・カナダ・メキシコの3か国が結んでいる自由貿易協定（旧NAFTA）の現在の名称は？", "a": "USMCA", "d": ["NAFTA", "ASEAN", "APEC", "EU", "TPP", "OPEC", "MERCOSUR"], "exp": "米国・メキシコ・カナダ協定。国境を越えた自動車部品などのサプライチェーンが発達しています。"}, {"id": "g048", "region": "w_namerica", "scope": "world", "cat": "company", "q": "ワシントン州シアトルに拠点があり、世界有数の航空機製造会社として知られるアメリカ企業は？", "a": "ボーイング", "d": ["エアバス", "ロッキード・マーティン", "ゼネラルモーターズ", "フォード", "テスラ", "アップル", "マイクロソフト"], "exp": "ヨーロッパの「エアバス」と世界の旅客機市場を二分しています。"}, {"id": "g049", "region": "w_namerica", "scope": "world", "cat": "agri_tech", "q": "アメリカ中部のグレートプレーンズなどで、地下水などをくみ上げて円形に散水する灌漑設備は？", "a": "センターピボット", "d": ["スプリンクラー", "カナート", "ダム式灌漑", "ため池灌漑", "点滴灌漑", "テラス耕作", "輪作農法"], "exp": "衛星写真で見ると乾燥地帯に緑の円がいくつも並ぶ特徴的な景観をつくります。地下水の枯渇が課題です。"}, {"id": "g050", "region": "w_namerica", "scope": "world", "cat": "city", "q": "五大湖の周辺で、鉄鉱石と石炭を背景に発展した従来の自動車工業の中心都市は？", "a": "デトロイト", "d": ["シカゴ", "ピッツバーグ", "ニューヨーク", "シアトル", "ヒューストン", "ロサンゼルス", "アトランタ"], "exp": "五大湖の水運を利用してメサビ鉄山の鉄鉱石とアパラチア炭田の石炭を運び、重化学工業が発展しました。"}, {"id": "g051", "region": "w_samerica", "scope": "world", "cat": "lang", "q": "南アメリカ最大の国ブラジルの公用語は何語？", "a": "ポルトガル語", "d": ["スペイン語", "英語", "フランス語", "オランダ語", "イタリア語", "ドイツ語", "ラテン語"], "exp": "大航海時代にポルトガルの植民地となったため。南アメリカで唯一のポルトガル語圏です。"}, {"id": "g052", "region": "w_samerica", "scope": "world", "cat": "lang", "q": "南アメリカでブラジル以外のほとんどの国（アルゼンチン、ペルー、チリなど）の公用語は何語？", "a": "スペイン語", "d": ["ポルトガル語", "英語", "フランス語", "イタリア語", "オランダ語", "ドイツ語", "ケチュア語"], "exp": "インカ帝国を滅ぼしたスペインの植民地支配の影響。宗教はブラジルも含めてカトリックが多いです。"}, {"id": "g053", "region": "w_samerica", "scope": "world", "cat": "climate", "q": "南アメリカ西部に連なるアンデス山脈の標高3000〜4000m付近の気候で、リャマやアルパカが飼われている気候は？", "a": "高山気候", "d": ["亜寒帯気候", "ツンドラ気候", "ステップ気候", "砂漠気候", "西岸海洋性気候", "サバナ気候", "氷雪気候"], "exp": "赤道直下でも標高が高いため気温が低く、年較差が小さい「常春」の気候になります。"}, {"id": "g054", "region": "w_samerica", "scope": "world", "cat": "vegetation", "q": "アマゾン川流域に広がる世界最大の熱帯雨林を何という？", "a": "セルバ", "d": ["パンパ", "サバンナ", "タイガ", "ツンドラ", "プレイリー", "ステップ", "カンポ"], "exp": "「地球の肺」とも呼ばれますが、牧場や農地開発・道路建設による森林破壊が問題になっています。"}, {"id": "g055", "region": "w_samerica", "scope": "world", "cat": "vegetation", "q": "アルゼンチンからウルグアイにかけて広がる、小麦の栽培や牛の放牧がさかんな温帯草原は？", "a": "パンパ", "d": ["セルバ", "プレイリー", "ステップ", "サバンナ", "タイガ", "グランチャコ", "カンポ"], "exp": "肥沃な土壌を持ち、アルゼンチンが小麦や牛肉の輸出国となる基盤になっています。"}, {"id": "g056", "region": "w_samerica", "scope": "world", "cat": "energy", "q": "ブラジルでさとうきびなどを原料に大量生産され、自動車の燃料として利用されているものは？", "a": "バイオエタノール", "d": ["シェールガス", "メタンハイドレート", "バイオディーゼル", "天然ガス", "液化石油ガス", "合成燃料", "石炭液化燃料"], "exp": "再生可能エネルギーの一種ですが、さとうきび畑を広げるための森林伐採も懸念されています。"}, {"id": "g057", "region": "w_samerica", "scope": "world", "cat": "country", "q": "南アメリカ西岸に南北に細長く伸び、銅の生産・輸出で世界第1位の国は？", "a": "チリ", "d": ["ペルー", "ボリビア", "アルゼンチン", "ブラジル", "エクアドル", "コロンビア", "ベネズエラ"], "exp": "南半球にあるため、日本とは季節が逆であることを活かしたぶどうやサケ・マスの輸出もさかんです。"}, {"id": "g058", "region": "w_samerica", "scope": "world", "cat": "people", "q": "中南米で多く見られる、ヨーロッパ系（白人）と先住民（インディオ）の混血の人々を何という？", "a": "メスティソ", "d": ["ヒスパニック", "ムラート", "クレオール", "イヌイット", "アボリジニ", "マオリ", "インディオ"], "exp": "中南米は先住民・ヨーロッパ系・アフリカ系・アジア系など多様な人々が暮らす混血社会です。"}, {"id": "g059", "region": "w_samerica", "scope": "world", "cat": "org", "q": "ブラジルが経済成長を遂げるなかで、ロシア・インド・中国・南アフリカと並んで呼ばれる新興国の総称は？", "a": "BRICS", "d": ["ASEAN", "G7", "OECD", "OPEC", "NIEs", "MERCOSUR", "APEC"], "exp": "5か国の頭文字。広い国土と豊富な資源、大きな人口を背景に国際社会での存在感を高めています。"}, {"id": "g060", "region": "w_samerica", "scope": "world", "cat": "crop", "q": "ブラジルが世界最大の生産量を誇り、かつてプランテーションで大量生産された代表的な農産物は？", "a": "コーヒー豆", "d": ["カカオ豆", "天然ゴム", "茶葉", "綿花", "とうもろこし", "小麦", "オリーブ"], "exp": "現在は大豆やとうもろこし、オレンジ、さとうきびの輸出も世界トップクラスです。"}, {"id": "g061", "region": "w_oceania", "scope": "world", "cat": "resource_pair", "q": "オーストラリアが日本や中国へ大量に輸出している、露天掘りで採掘される代表的な鉱産資源2つは？", "a": "鉄鉱石と石炭", "d": ["原油と天然ガス", "銅とボーキサイト", "金とダイヤモンド", "鉄鉱石と原油", "石炭とウラン", "レアメタルと銅", "ボーキサイトとニッケル"], "exp": "西部（ピルバラ地域）で鉄鉱石、東部で石炭が採れ、日本との貿易で非常に重要です。"}, {"id": "g062", "region": "w_oceania", "scope": "world", "cat": "agri_method", "q": "オーストラリアの内陸部で、掘り抜き井戸（大鑽井盆地）の地下水を利用して行われている牧畜は？", "a": "羊の放牧", "d": ["乳牛の酪農", "豚の混合農業", "山羊の遊牧", "リャマの放牧", "馬の牧畜", "肉牛の肥育", "トナカイの遊牧"], "exp": "乾燥地帯でも地下水をくみ上げることで広大な土地での羊の飼育（羊毛・羊肉）が可能になります。"}, {"id": "g063", "region": "w_oceania", "scope": "world", "cat": "policy", "q": "かつて白人以外の移民を制限していた政策から転換し、1970年代以降のオーストラリアが採用している政策は？", "a": "多文化主義", "d": ["白豪主義", "同化政策", "アパルトヘイト", "人種隔離政策", "鎖国政策", "移民制限政策", "単一民族主義"], "exp": "白豪主義を廃止してアジア系移民の受け入れを増やし、現在はアジア太平洋地域との結びつきを強めています。"}, {"id": "g064", "region": "w_oceania", "scope": "world", "cat": "landform", "q": "オーストラリアの北東岸に広がる世界最大のサンゴ礁地帯（世界自然遺産）は？", "a": "グレートバリアリーフ", "d": ["ウルル", "グレートディバイディング山脈", "大鑽井盆地", "タスマニア原生地域", "フィヨルドランド", "グレートサンディ砂漠", "マレー・ダーリング盆地"], "exp": "近年は海水温の上昇によるサンゴの白化現象が環境問題となっています。"}, {"id": "g065", "region": "w_oceania", "scope": "world", "cat": "flag_feat", "q": "オーストラリアとニュージーランドに共通する、かつてイギリスの植民地だった名残として見られる国旗の特徴は？", "a": "ユニオンジャックが入っている", "d": ["三日月と星が描かれている", "十字架が大きく中央にある", "赤と白の横縞が入っている", "国章の動物が描かれている", "太陽と月が描かれている", "縦の三色旗になっている", "王冠のマークが入っている"], "exp": "イギリス連邦に属し、英語を公用語としています。南十字星も両国の国旗に共通して描かれています。"}, {"id": "g066", "region": "w_oceania", "scope": "world", "cat": "energy_group", "q": "ニュージーランドで発電電力量の約8割を占める、水力・地熱・風力などのエネルギー源の総称は？", "a": "再生可能エネルギー", "d": ["化石燃料エネルギー", "原子力エネルギー", "非再生エネルギー", "新火力エネルギー", "合成燃料エネルギー", "地下資源エネルギー", "熱核融合エネルギー"], "exp": "火山国であるため地熱発電がさかんで、脱炭素社会に向けた発電構成が特徴です。"}, {"id": "g067", "region": "w_oceania", "scope": "world", "cat": "people", "q": "オーストラリアの先住民をアボリジニというのに対し、ニュージーランドの先住民は？", "a": "マオリ", "d": ["イヌイット", "アボリジニ", "アイヌ", "インディオ", "メスティソ", "ポリネシアン", "メラネシアン"], "exp": "ニュージーランドではマオリ語も公用語とされ、先住民の文化が尊重されています。"}, {"id": "g068", "region": "w_oceania", "scope": "world", "cat": "env_issue", "q": "オセアニアのツバルやキリバスなどの島国で、地球温暖化により特に深刻化している問題は？", "a": "海面上昇による国土の水没", "d": ["流氷の減少による漁業不振", "永久凍土の融解による地盤沈下", "酸性雨による針葉樹林の枯死", "砂漠化による農地の減少", "オゾンホールによる森林火災", "エルニーニョによる豪雪被害", "氷河の後退による水不足"], "exp": "標高が数メートルしかない環礁の島国が多く、温暖化による海面上昇が国の存続を脅かしています。"}, {"id": "g069", "region": "w_oceania", "scope": "world", "cat": "season", "q": "日本の1〜2月の真冬に、南半球のオーストラリア（シドニー）はどの季節になる？", "a": "夏", "d": ["冬", "春", "秋", "乾季", "雨季", "梅雨", "晩秋"], "exp": "南半球にあるため北半球と季節が逆になります。雨温図の気温の山が「1・2月高く、7・8月低い（U字型）」のが南半球。"}, {"id": "g070", "region": "w_oceania", "scope": "world", "cat": "country", "q": "オーストラリアの最大の貿易相手国（輸出・輸入ともに1位）は現在どこ？", "a": "中国", "d": ["イギリス", "アメリカ", "日本", "韓国", "インド", "シンガポール", "ニュージーランド"], "exp": "かつてはイギリス、その後は日本が最大の貿易相手国でしたが、2000年代後半以降は中国が1位です。"}, {"id": "g071", "region": "j_base", "scope": "japan", "cat": "island_geo", "q": "日本の領土の最北端に位置する、北方領土の島は？", "a": "択捉島", "d": ["国後島", "色丹島", "歯舞群島", "礼文島", "利尻島", "南鳥島", "沖ノ鳥島"], "exp": "6年連続出題実績のある日本の4端。最北端＝択捉島（北緯45度付近）を確実に押さえよう。"}, {"id": "g072", "region": "j_base", "scope": "japan", "cat": "island_geo", "q": "日本の領土の最東端に位置する、東京都小笠原村に属する島は？", "a": "南鳥島", "d": ["沖ノ鳥島", "父島", "母島", "硫黄島", "八丈島", "与那国島", "択捉島"], "exp": "最東端＝南鳥島（東経153度付近）。東京都に属する点もひっかけで出題されます。"}, {"id": "g073", "region": "j_base", "scope": "japan", "cat": "island_geo", "q": "日本の領土の最南端に位置し、周囲の排他的経済水域を守るため護岸工事が行われている島は？", "a": "沖ノ鳥島", "d": ["南鳥島", "与那国島", "石垣島", "宮古島", "父島", "硫黄島", "波照間島"], "exp": "最南端＝沖ノ鳥島（北緯20度付近・東京都小笠原村）。日本の国土面積を超える広いEEZの基点となっています。"}, {"id": "g074", "region": "j_base", "scope": "japan", "cat": "island_geo", "q": "日本の領土の最西端に位置する、沖縄県の島は？", "a": "与那国島", "d": ["石垣島", "西表島", "宮古島", "波照間島", "沖縄本島", "沖ノ鳥島", "対馬"], "exp": "最西端＝与那国島（東経122度付近）。台湾のすぐ近くに位置します。"}, {"id": "g075", "region": "j_base", "scope": "japan", "cat": "sea_zone", "q": "沿岸から12海里までの海域で、日本の主権が及ぶ範囲を何という？", "a": "領海", "d": ["排他的経済水域", "公海", "接続水域", "大陸棚", "内水", "経済専管水域", "領空"], "exp": "領海＝12海里、排他的経済水域（EEZ）＝200海里。2つの数値と権限の違いを整理しよう。"}, {"id": "g076", "region": "j_base", "scope": "japan", "cat": "dist_num", "q": "縮尺2万5000分の1の地形図で、地図上の4cmは実際の距離では何km？", "a": "1km", "d": ["0.5km", "2km", "2.5km", "4km", "5km", "10km", "0.25km"], "exp": "2万5000分の1では「4cm＝1km」（5万分の1では「2cm＝1km」）。地形図問題の基本公式です。"}, {"id": "g077", "region": "j_base", "scope": "japan", "cat": "contour_num", "q": "2万5000分の1の地形図において、太い等高線（計曲線）は何mごとに引かれている？", "a": "50mごと", "d": ["10mごと", "20mごと", "25mごと", "40mごと", "100mごと", "150mごと", "200mごと"], "exp": "2万5000分の1では細い線（主曲線）＝10mごと、太い線（計曲線）＝50mごと。5万分の1は20m・100mです。"}, {"id": "g078", "region": "j_base", "scope": "japan", "cat": "current", "q": "日本の太平洋側を北上する暖流（黒潮）の正式名称は？", "a": "日本海流", "d": ["千島海流", "対馬海流", "リマン海流", "親潮", "北大西洋海流", "北太平洋海流", "黒潮寒流"], "exp": "暖流＝日本海流（黒潮）・対馬海流、寒流＝千島海流（親潮）・リマン海流。"}, {"id": "g079", "region": "j_base", "scope": "japan", "cat": "landform", "q": "本州の中央を南北に縦断し、西日本と東日本の地質的な境界となっている大きな溝（地溝帯）は？", "a": "フォッサマグナ", "d": ["中央構造線", "日本アルプス", "糸魚川静岡構造線", "関東ローム層", "濃尾平野", "シラス台地", "カルデラ"], "exp": "西縁は糸魚川・静岡構造線。火山が多く、日本有数の温泉地や火山地帯を形成しています。"}, {"id": "g080", "region": "j_base", "scope": "japan", "cat": "island_geo", "q": "日本がロシアに返還を求めている北方領土4島のうち、択捉島・国後島・色丹島以外のあと1つは？", "a": "歯舞群島", "d": ["得撫島", "礼文島", "利尻島", "奥尻島", "佐渡島", "南鳥島", "隠岐諸島"], "exp": "日本固有の領土ですが、第二次世界大戦末期にソ連に占領され、現在もロシアが実効支配しています。"}, {"id": "g081", "region": "j_kyushu", "scope": "japan", "cat": "landform", "q": "鹿児島県を中心に広がる、火山灰が堆積してできた水はけのよい台地は？", "a": "シラス台地", "d": ["関東ローム層", "根釧台地", "牧之原台地", "武蔵野台地", "秋吉台", "阿蘇カルデラ", "九州山地"], "exp": "水もちが悪く稲作には不向きなため、さつまいも栽培や肉用牛・豚の畜産がさかんになりました。"}, {"id": "g082", "region": "j_kyushu", "scope": "japan", "cat": "landform", "q": "熊本県にある阿蘇山で見られる、火山の噴火によってできた世界最大級の大きなくぼ地は？", "a": "カルデラ", "d": ["リアス海岸", "扇状地", "三角州", "河岸段丘", "フィヨルド", "火山砕屑丘", "地溝帯"], "exp": "阿蘇山のカルデラ内には鉄道や市街地、農地が広がっているのが特徴です。"}, {"id": "g083", "region": "j_kyushu", "scope": "japan", "cat": "agri_method", "q": "温暖な気候を活かしてビニルハウスなどで野菜を早く育て、他地域より早く出荷する宮崎平野などの農業は？", "a": "促成栽培", "d": ["抑制栽培", "近郊農業", "高冷地農業", "二期作", "二毛作", "輪作", "施設園芸"], "exp": "宮崎平野や高知平野が代表例。夏の高冷地で行う「抑制栽培（高冷地農業）」と対比して出ます。"}, {"id": "g084", "region": "j_kyushu", "scope": "japan", "cat": "plain", "q": "九州最大の河川である筑後川の下流に広がる、九州最大の穀倉地帯は？", "a": "筑紫平野", "d": ["宮崎平野", "熊本平野", "佐賀平野", "石狩平野", "越後平野", "濃尾平野", "讃岐平野"], "exp": "クリーク（水路）網が発達し、九州一の稲作地帯となっています。"}, {"id": "g085", "region": "j_kyushu", "scope": "japan", "cat": "nickname", "q": "九州地方でIC（集積回路）工場が高速道路や空港周辺に多く立地していることから何と呼ばれる？", "a": "シリコンアイランド", "d": ["シリコンバレー", "エコタウン", "サンベルト", "テクノポリス", "ハイテクベルト", "臨空工業地帯", "臨海工業地帯"], "exp": "ICは軽くて小さいため、空港近くの高速道路IC周辺に立地しやすい（臨空型工業）のが特徴です。"}, {"id": "g086", "region": "j_kyushu", "scope": "japan", "cat": "ind_zone", "q": "1901年に八幡製鉄所が操業開始したことで発展し、現在はエコタウン事業にも取り組む工業地域は？", "a": "北九州工業地域", "d": ["京浜工業地帯", "中京工業地帯", "阪神工業地帯", "瀬戸内工業地域", "京葉工業地域", "東海工業地域", "北関東工業地域"], "exp": "かつては四大工業地帯の一つでしたが、筑豊炭田の閉山などで出荷額の割合が低下し、現在は環境・リサイクル産業が進んでいます。"}, {"id": "g087", "region": "j_kyushu", "scope": "japan", "cat": "sea", "q": "水俣病が発生した熊本県水俣市から南の海に面し、リアス海岸や島々が多い海域は？", "a": "不知火海", "d": ["有明海", "瀬戸内海", "伊万里湾", "錦江湾", "橘湾", "大村湾", "周防灘"], "exp": "八代海とも呼ばれます。四大公害病（水俣病・新潟水俣病・四日市ぜんそく・イタイイタイ病）と発生地域をセットで確認しよう。"}, {"id": "g088", "region": "j_kyushu", "scope": "japan", "cat": "livestock", "q": "九州地方の畜産で、宮崎県や鹿児島県が全国トップクラスの生産量を誇るブロイラーとは何の肉用種？", "a": "鶏", "d": ["豚", "肉用牛", "乳牛", "羊", "山羊", "馬", "合鴨"], "exp": "南九州は豚・肉用牛・ブロイラー（肉用若鶏）のいずれも全国トップクラスの畜産地域です。"}, {"id": "g089", "region": "j_kyushu", "scope": "japan", "cat": "issue_short", "q": "沖縄県が本土復帰した1972年以降も抱えている、全国の約7割が集中している課題は？", "a": "アメリカ軍基地の集中", "d": ["台風による高潮被害", "離島間の物流コスト増", "水資源の慢性的な不足", "産業廃棄物処理場の不足", "過疎化による漁業者の減少", "サンゴ礁の白化現象", "火山灰による農作物被害"], "exp": "観光客の増加や亜熱帯気候を活かした農業がある一方、基地負担の軽減が大きな課題です。"}, {"id": "g090", "region": "j_kyushu", "scope": "japan", "cat": "weather_phen", "q": "九州南部や沖縄県で夏から秋にかけて特に多く通過し、農作物に被害をもたらすこともある気象現象は？", "a": "台風", "d": ["やませ", "フェーン現象", "ヒートアイランド現象", "梅雨前線", "季節風", "エルニーニョ現象", "竜巻"], "exp": "沖縄では台風に備えて石垣や赤瓦の屋根を漆喰で固めた伝統的な住居が見られます。"}, {"id": "g091", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "climate_type", "q": "中国山地と四国山地に挟まれた瀬戸内海沿岸で見られる、年間を通して温暖で降水量が少ない気候は？", "a": "瀬戸内の気候", "d": ["日本海側の気候", "太平洋側の気候", "内陸の気候", "北海道の気候", "南西諸島の気候", "西岸海洋性気候", "地中海性気候"], "exp": "冬は中国山地、夏は四国山地が湿った季節風を遮るため、1年中晴れの日が多く降水量が少なくなります。"}, {"id": "g092", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "facility", "q": "降水量が少ない香川県の讃岐平野で、稲作のための農業用水を確保するために多く作られた施設は？", "a": "ため池", "d": ["輪中", "堰", "用水路", "クリーク", "地下ダム", "棚田", "遊水地"], "exp": "満濃池などが有名。吉野川から水を引く香川用水も建設されました。"}, {"id": "g093", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "ind_zone", "q": "岡山県倉敷市水島や山口県周南市などを中心に、石油化学コンビナートが発達している工業地域は？", "a": "瀬戸内工業地域", "d": ["阪神工業地帯", "中京工業地帯", "京浜工業地帯", "北九州工業地域", "京葉工業地域", "東海工業地域", "鹿島臨海工業地域"], "exp": "波が穏やかな瀬戸内海に面し、大型タンカーが接岸しやすいため臨海部に重化学工業が発達しました。"}, {"id": "g094", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "landform", "q": "山陰地方の鳥取県にある、日本海からの風と千代川の砂によって作られた海岸砂丘は？", "a": "鳥取砂丘", "d": ["九十九里浜", "吹上浜", "中田島砂丘", "天橋立", "三保松原", "九十九島", "室戸岬"], "exp": "砂丘では乾燥に強いらっきょうやながいもなどが栽培されています。"}, {"id": "g095", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "plain", "q": "冬でも暖かい黒潮の影響を受け、なすやピーマンなどの促成栽培がさかんな四国の平野は？", "a": "高知平野", "d": ["讃岐平野", "徳島平野", "松山平野", "宮崎平野", "筑紫平野", "濃尾平野", "関東平野"], "exp": "宮崎平野とともに促成栽培の2大地域。ビニルハウスでの施設園芸がさかんです。"}, {"id": "g096", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "infra", "q": "本州と四国を結ぶ3つのルート（明石海峡・瀬戸大橋・しまなみ海道）を総称して何という？", "a": "本州四国連絡橋", "d": ["関門海峡大橋", "東京湾アクアライン", "青函連絡ルート", "瀬戸内横断道", "中国四国連絡道", "淡路鳴門連絡橋", "南海トラフ連絡橋"], "exp": "ストロー現象（大都市へ人や買い物が吸い寄せられる現象）や物流の効率化など、メリット・課題の両面が出題されます。"}, {"id": "g097", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "crop", "q": "愛媛県や和歌山県で全国トップクラスの生産量を誇る果実で、瀬戸内海沿岸の斜面で栽培されるものは？", "a": "みかん", "d": ["りんご", "ぶどう", "もも", "さくらんぼ", "西洋なし", "かき", "メロン"], "exp": "水はけと日当たりのよい傾斜地、温暖な気候が栽培に適しています。"}, {"id": "g098", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "city", "q": "中国・四国地方最大の都市であり、自動車工業や造船業がさかんな政令指定都市は？", "a": "広島市", "d": ["岡山市", "松山市", "高松市", "倉敷市", "福山市", "高知市", "下関市"], "exp": "中国地方の政令指定都市は広島市と岡山市。中四国の中枢管理都市としての役割を持っています。"}, {"id": "g099", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "region_sub", "q": "中国地方の日本海側（島根県・鳥取県）の呼び名で、高齢化や過疎化が課題となっている地域は？", "a": "山陰", "d": ["山陽", "瀬戸内", "南四国", "北陸", "東山", "南九州", "道東"], "exp": "中国山地の北側＝山陰（日本海側の気候で冬は雪が多い）、南側＝山陽（瀬戸内の気候で人口・工業が集中）。"}, {"id": "g100", "region": "j_chugoku_shikoku", "scope": "japan", "cat": "seafood", "q": "広島湾などの穏やかな内海で養殖がさかんで、全国1位の生産量を誇る水産物は？", "a": "かき", "d": ["ほたて", "うなぎ", "まだい", "ぶり", "のり", "あさり", "さけ"], "exp": "波が静かでプランクトンが豊富な瀬戸内海は、かき養殖に最適な環境です。"}, {"id": "g101", "region": "j_kinki", "scope": "japan", "cat": "lake", "q": "滋賀県の中央にあり、近畿地方の重要な水源（京阪神の水がめ）となっている日本最大の湖は？", "a": "琵琶湖", "d": ["霞ヶ浦", "サロマ湖", "猪苗代湖", "中海", "宍道湖", "浜名湖", "十和田湖"], "exp": "淀川となって大阪湾へ注ぎます。富栄養化（赤潮）を防ぐための条例や環境保全もよく問われます。"}, {"id": "g102", "region": "j_kinki", "scope": "japan", "cat": "ind_zone", "q": "大阪・神戸を中心に鉄鋼・化学・金属・機械工業などが発達した、日本を代表する工業地帯は？", "a": "阪神工業地帯", "d": ["京浜工業地帯", "中京工業地帯", "北九州工業地域", "瀬戸内工業地域", "京葉工業地域", "東海工業地域", "北関東工業地域"], "exp": "戦前は紡績など軽工業中心でしたが、戦後は重化学工業へ転換し、中小企業の比率も高いのが特徴です。"}, {"id": "g103", "region": "j_kinki", "scope": "japan", "cat": "ind_type", "q": "京都市で発展した「西陣織」や「京友禅」などのように、古くからの技術を受け継いで作られる産業を何という？", "a": "伝統的工芸品", "d": ["先端技術産業", "臨海型工業", "臨空型工業", "重化学工業", "知識集約型産業", "下請け町工場", "コンビナート"], "exp": "輪島塗や南部鉄器など全国にあり、後継者不足への対策として新製品開発なども行われています。"}, {"id": "g104", "region": "j_kinki", "scope": "japan", "cat": "basin_pair", "q": "近畿地方の中央部に見られ、かつて都が置かれた歴史を持つ代表的な2つの盆地は？", "a": "京都盆地と奈良盆地", "d": ["甲府盆地と松本盆地", "山形盆地と福島盆地", "上川盆地と北見盆地", "長野盆地と諏訪盆地", "横手盆地と会津盆地", "人吉盆地と都城盆地", "大阪平野と京都盆地"], "exp": "夏は暑く冬は底冷えする内陸性気候。京都や奈良は歴史的景観を守るための条例があります。"}, {"id": "g105", "region": "j_kinki", "scope": "japan", "cat": "ind_word", "q": "大阪の東大阪や堺などで、多くの中小工場が独自の高い加工技術を活かして製品をつくることを総称して何という？", "a": "モノづくり", "d": ["オートメーション", "国際分業", "大量生産方式", "コンバイナー", "ライン生産", "アグリビジネス", "エコタウン"], "exp": "東大阪市などは「モノづくりのまち」として知られ、人工衛星や医療機器の精密部品なども作られています。"}, {"id": "g106", "region": "j_kinki", "scope": "japan", "cat": "reason_short", "q": "和歌山県（紀伊山地周辺）で、みかんや梅の栽培がさかんな共通の自然条件は？", "a": "山の斜面の日当たりの良さと温暖な気候", "d": ["火山灰が積もった水はけの良い広大な台地", "夏でも涼しい標高1000m以上の高冷地", "冬の北西季節風による豊富な積雪と雪解け水", "大河の河口に広がる肥沃な沖積平野", "黒潮から離れた内海の穏やかで乾燥した気候", "冷涼な気候を活かした大規模な輪作体系", "泥炭地を客土して改良した平らな水田地帯"], "exp": "紀伊半島の南部は黒潮の影響で温暖多雨であり、斜面の排水の良さが果樹栽培に適しています。"}, {"id": "g107", "region": "j_kinki", "scope": "japan", "cat": "landform", "q": "京都府の日本海側や、三重県・和歌山県の太平洋側に多く見られる、複雑に入り組んだ海岸地形は？", "a": "リアス海岸", "d": ["砂州", "砂丘", "扇状地", "三角州", "カルデラ", "河岸段丘", "フィヨルド"], "exp": "志摩半島や若狭湾、三陸海岸が代表例。波が穏やかで水深が深いため、真珠などの養殖や天然の良港に適しています。"}, {"id": "g108", "region": "j_kinki", "scope": "japan", "cat": "airport_loc", "q": "関西国際空港は、都市部の騒音問題などを避けて24時間運用するためにどのように建設された？", "a": "大阪湾の沖合を埋め立てた人工島", "d": ["京都盆地の山間部を切り開いた高台", "淀川の河口にある自然の中洲の拡張", "奈良盆地の農地を転用した内陸平地", "淡路島の北端の丘陵地を削った平地", "琵琶湖の南岸を干拓して造った平地", "和歌山県の紀伊半島先端の砂浜地帯", "六甲山地の尾根を平らに削った山頂部"], "exp": "海上の人工島であるため24時間離着陸が可能ですが、地盤沈下や高潮対策が課題となっています。"}, {"id": "g109", "region": "j_kinki", "scope": "japan", "cat": "metro", "q": "大阪・京都・神戸の3大都市を中心とする都市圏を何という？", "a": "京阪神大都市圏", "d": ["東京大都市圏", "中京大都市圏", "北九州都市圏", "関西臨海都市圏", "近畿内陸都市圏", "大阪湾岸都市圏", "瀬戸内都市圏"], "exp": "東京大都市圏・中京大都市圏と並ぶ日本の三大都市圏の一つです。"}, {"id": "g110", "region": "j_kinki", "scope": "japan", "cat": "phenomenon", "q": "大阪市の地下や周辺部でかつて問題となった、工場などによる地下水のくみ上げが原因の現象は？", "a": "地盤沈下", "d": ["ヒートアイランド現象", "フェーン現象", "液状化現象", "土壌汚染", "海面上昇", "塩害現象", "富栄養化現象"], "exp": "地下水のくみ上げ規制によって沈静化しましたが、現在も海抜ゼロメートル地帯の防潮対策が重要です。"}, {"id": "g111", "region": "j_chubu", "scope": "japan", "cat": "mountain", "q": "飛騨山脈・木曽山脈・赤石山脈の3つの山脈を総称して何という？", "a": "日本アルプス", "d": ["奥羽山脈", "関東山地", "中国山地", "四国山地", "紀伊山地", "九州山地", "越後山脈"], "exp": "標高3000m級の山々が連なり「日本の屋根」と呼ばれます。北・中央・南アルプスに相当。"}, {"id": "g112", "region": "j_chubu", "scope": "japan", "cat": "ind_zone", "q": "愛知県豊田市を中心に自動車などの輸送用機械工業が発達し、工業製品出荷額が日本第1位の工業地帯は？", "a": "中京工業地帯", "d": ["京浜工業地帯", "阪神工業地帯", "北九州工業地域", "東海工業地域", "瀬戸内工業地域", "京葉工業地域", "北関東工業地域"], "exp": "1970年代後半以降、自動車産業の成長により出荷額日本一を維持し続けています。"}, {"id": "g113", "region": "j_chubu", "scope": "japan", "cat": "settlement", "q": "木曽川・長良川・揖斐川の河口付近（濃尾平野）で、水害から集落を守るために周囲に堤防をめぐらせた集落は？", "a": "輪中", "d": ["散村", "条里集落", "屯田兵村", "門前町", "宿場町", "城下町", "干拓集落"], "exp": "「輪中（わじゅう）」は濃尾平野の自然環境と人の工夫を問う定番問題です。"}, {"id": "g114", "region": "j_chubu", "scope": "japan", "cat": "agri_method", "q": "長野県の野辺山原や群馬県嬬恋村など、夏の涼しさを活かしてレタスやキャベツを夏に出荷する農業は？", "a": "高冷地農業", "d": ["促成栽培", "近郊農業", "混合農業", "酪農", "二期作", "二毛作", "輪作"], "exp": "抑制栽培とも呼ばれます。平地で野菜が育ちにくい真夏に出荷できるため高い価格で取引されます。"}, {"id": "g115", "region": "j_chubu", "scope": "japan", "cat": "landform", "q": "山梨県の甲府盆地などで、川が山地から平地に出るところに土砂が扇形に堆積してできた地形は？", "a": "扇状地", "d": ["三角州", "河岸段丘", "カルデラ", "リアス海岸", "砂州", "シラス台地", "氾濫原"], "exp": "水はけが良いため、扇状地の中央部（扇央）ではりんご・ぶどう・ももなどの果樹園が多く見られます。"}, {"id": "g116", "region": "j_chubu", "scope": "japan", "cat": "agri_method", "q": "新潟県の越後平野など日本海側の雪国で行われている、米の生産に特化した農業形態は？", "a": "稲作単作地帯", "d": ["二毛作地帯", "二期作地帯", "輪作地帯", "高冷地農業地帯", "促成栽培地帯", "近郊農業地帯", "混合農業地帯"], "exp": "冬は深い雪に覆われるため裏作（麦など）ができず、春〜秋に高品質な米づくりに専念する単作が発達しました。"}, {"id": "g117", "region": "j_chubu", "scope": "japan", "cat": "ind_zone", "q": "静岡県浜松市などを中心に、オートバイ（二輪車）やピアノ・楽器などの製造がさかんな工業地域は？", "a": "東海工業地域", "d": ["中京工業地帯", "京浜工業地帯", "阪神工業地帯", "京葉工業地域", "北関東工業地域", "瀬戸内工業地域", "北九州工業地域"], "exp": "富士市などの製紙・パルプ工業も有名です。"}, {"id": "g118", "region": "j_chubu", "scope": "japan", "cat": "ind_type", "q": "福井県鯖江市の「めがねフレーム」や新潟県燕三条の「洋食器」など、特定地域に集中して根付いている産業を何という？", "a": "地場産業", "d": ["先端技術産業", "臨海型工業", "重化学工業", "情報通信産業", "基礎素材産業", "アグリビジネス", "大規模装置産業"], "exp": "地元の資源や歴史的な技術から発展した地域の特色ある産業です。"}, {"id": "g119", "region": "j_chubu", "scope": "japan", "cat": "reason_short", "q": "冬に日本海側（北陸地方）に大量の雪が降る主な理由は？", "a": "北西の季節風が対馬海流から水蒸気を補給し山脈にぶつかるため", "d": ["南東の季節風が日本海流から熱と湿気を受けて山脈を越えるため", "冬の偏西風が太平洋側から冷たい空気を運んで山脈で冷えるため", "千島海流の冷たい水蒸気と夏の台風が日本海側で合流するため", "北東から吹くやませが奥羽山脈を越えて日本海側で雪になるため", "シベリアからの乾燥した季節風が本州中央の盆地で直接凍るため", "冬の貿易風が日本海を北上して北陸地方の上空で停滞するため", "太平洋側の高気圧から吹き出す風が日本アルプスで上昇するため"], "exp": "日本海側の気候（冬の降水量が極端に多い）のメカニズムは頻出の記述・選択テーマです。"}, {"id": "g120", "region": "j_chubu", "scope": "japan", "cat": "mountain_single", "q": "静岡県と山梨県にまたがる日本最高峰の火山で、世界文化遺産に登録されている山は？", "a": "富士山", "d": ["北岳", "御嶽山", "浅間山", "阿蘇山", "桜島", "白山", "立山"], "exp": "標高3776m。周囲には富士五湖があり、関東地方の火山灰（関東ローム層）の供給源でもあります。"}, {"id": "g121", "region": "j_kanto", "scope": "japan", "cat": "landform", "q": "日本最大の平野である関東平野の台地を覆っている、富士山などの火山灰が堆積した赤褐色の土壌は？", "a": "関東ローム層", "d": ["シラス台地", "泥炭地", "沖積低地", "黒ぼく土", "カルスト台地", "扇状地礫層", "三角州堆積土"], "exp": "水はけが良いため畑作に向いており、千葉県や茨城県などの野菜生産を支えています。"}, {"id": "g122", "region": "j_kanto", "scope": "japan", "cat": "agri_method", "q": "大消費地である東京の近くで行われ、鮮度の高い野菜や花をすぐに出荷できる農業は？", "a": "近郊農業", "d": ["促成栽培", "抑制栽培", "高冷地農業", "混合農業", "稲作単作", "輪作", "二毛作"], "exp": "輸送時間が短いため、葉物野菜（ほうれんそう・こまつな等）や生花など鮮度が命の作物が多いです。"}, {"id": "g123", "region": "j_kanto", "scope": "japan", "cat": "ind_zone", "q": "東京・川崎・横浜の東京湾西岸に広がり、印刷・情報通信機械や精密機械の割合が高い工業地帯は？", "a": "京浜工業地帯", "d": ["京葉工業地域", "中京工業地帯", "阪神工業地帯", "北関東工業地域", "東海工業地域", "瀬戸内工業地域", "北九州工業地域"], "exp": "出版・印刷業や本社機能、先端技術開発の拠点が集積しているのが特徴です。"}, {"id": "g124", "region": "j_kanto", "scope": "japan", "cat": "ind_zone", "q": "千葉県北西部の東京湾岸に埋め立て地を造成して発展し、化学工業や鉄鋼業の割合が高い工業地域は？", "a": "京葉工業地域", "d": ["京浜工業地帯", "北関東工業地域", "鹿島臨海工業地域", "中京工業地帯", "阪神工業地帯", "瀬戸内工業地域", "東海工業地域"], "exp": "京浜工業地帯と区別して覚えよう！京葉は「化学・鉄鋼」、京浜は「機械・印刷」の割合が高いです。"}, {"id": "g125", "region": "j_kanto", "scope": "japan", "cat": "ind_zone", "q": "栃木県や群馬県などの内陸部に高速道路沿いに発達し、自動車や電気機械の工場が多い工業地域は？", "a": "北関東工業地域", "d": ["京浜工業地帯", "京葉工業地域", "東海工業地域", "中京工業地帯", "阪神工業地帯", "瀬戸内工業地域", "北九州工業地域"], "exp": "工場用地の広さと高速道路（東北道・関越道・北関東道）による輸送の便利さを活かした内陸型工業です。"}, {"id": "g126", "region": "j_kanto", "scope": "japan", "cat": "phenomenon", "q": "東京などの大都市で、アスファルトやコンクリートの増加、排熱などにより中心部の気温が周辺より高くなる現象は？", "a": "ヒートアイランド現象", "d": ["フェーン現象", "エルニーニョ現象", "ラニーニャ現象", "ヒートドーム現象", "サーマルアイランド現象", "アーバンウォーム現象", "都市温暖化現象"], "exp": "緑地や水辺の減少、ビル風による風通しの悪さ、エアコン・車の排熱が原因。対策として屋上緑化や保水性舗装が進んでいます。"}, {"id": "g127", "region": "j_kanto", "scope": "japan", "cat": "urban_issue", "q": "日本の政治・経済・文化・人口のすべてが東京圏に極端に集まっている状態を何という？", "a": "東京一極集中", "d": ["ドーナツ化現象", "都心回帰現象", "過疎過密問題", "地方分権化", "ベッドタウン化", "ストロー現象", "都市スプロール"], "exp": "通勤ラッシュや待機児童、災害時の機能麻痺、地方の過疎化などの課題とセットで出題されます。"}, {"id": "g128", "region": "j_kanto", "scope": "japan", "cat": "city", "q": "茨城県南部に国の研究機関や大学を集めて計画的に作られた都市は？", "a": "筑波研究学園都市", "d": ["鹿嶋臨海都市", "水戸中核都市", "宇都宮工業都市", "さいたま新都心", "幕張新都心", "横浜みなとみらい", "多摩ニュータウン"], "exp": "東京の過密対策と科学技術研究の拠点整備を目的に建設されました。"}, {"id": "g129", "region": "j_kanto", "scope": "japan", "cat": "city", "q": "神奈川県の県庁所在地であり、国際貿易港として開港以来発展し続けている政令指定都市は？", "a": "横浜市", "d": ["川崎市", "相模原市", "横須賀市", "鎌倉市", "藤沢市", "千葉市", "さいたま市"], "exp": "神奈川県には政令指定都市が3つ（横浜市・川崎市・相模原市）あることも押さえておきましょう。"}, {"id": "g130", "region": "j_kanto", "scope": "japan", "cat": "crop", "q": "関東地方の畑作で、茨城県が全国1位の生産量を誇り、鹿島灘沿岸などでも栽培される代表的な野菜は？", "a": "ピーマン", "d": ["レタス", "キャベツ", "トマト", "きゅうり", "なす", "たまねぎ", "じゃがいも"], "exp": "茨城県はピーマン・メロン・れんこん・さつまいも・チンゲンサイなどで全国トップクラスの農業県です。"}, {"id": "g131", "region": "j_tohoku", "scope": "japan", "cat": "wind", "q": "初夏から夏にかけて東北地方の太平洋側に吹き、冷害の原因となる冷たく湿った北東の風は？", "a": "やませ", "d": ["からっ風", "フェーン", "季節風", "偏西風", "貿易風", "海陸風", "山谷風"], "exp": "千島海流（親潮）の上を通って冷やされるため冷害を引き起こします。青森県などで冷害に強い品種改良が行われました。"}, {"id": "g132", "region": "j_tohoku", "scope": "japan", "cat": "mountain", "q": "東北地方の中央を南北に貫き、日本海側と太平洋側の気候を大きく分ける背骨となる山脈は？", "a": "奥羽山脈", "d": ["越後山脈", "飛騨山脈", "木曽山脈", "赤石山脈", "出羽山地", "北上高地", "関東山地"], "exp": "東北地方では奥羽山脈を境に、冬は西側（日本海側）で大雪、夏は東側（太平洋側）でやませの影響を受けます。"}, {"id": "g133", "region": "j_tohoku", "scope": "japan", "cat": "landform", "q": "青森県から宮城県にかけての太平洋側に見られる、急な斜面が海に迫り複雑な入り江が続く三陸の海岸地形は？", "a": "リアス海岸", "d": ["砂丘海岸", "干潟海岸", "三角州海岸", "砂州海岸", "断層崖海岸", "カルスト海岸", "珊瑚礁海岸"], "exp": "かきやほたて・わかめの養殖がさかんな一方、入り江の奥で津波が高くなりやすい地形でもあります。"}, {"id": "g134", "region": "j_tohoku", "scope": "japan", "cat": "sea_feat", "q": "三陸沖で暖流（日本海流）と寒流（千島海流）が出会ってできる、プランクトンが豊富な好漁場は？", "a": "潮目", "d": ["海溝", "海嶺", "大陸棚", "サンゴ礁", "三角州", "内湾", "河口域"], "exp": "潮境（しおざかい）とも呼ばれます。さんま・かつお・さばなどが多く獲れる世界有数の漁場です。"}, {"id": "g135", "region": "j_tohoku", "scope": "japan", "cat": "fruit_pair", "q": "青森県の津軽平野で全国1位の生産量を誇る果物と、山形県で全国1位の生産量を誇る果物の組み合わせは？", "a": "りんごとさくらんぼ", "d": ["りんごとぶどう", "ももとりんご", "さくらんぼと西洋なし", "ぶどうとさくらんぼ", "みかんとりんご", "かきとさくらんぼ", "なしとぶどう"], "exp": "青森＝りんご、山形＝さくらんぼ（・西洋なし）、福島＝もも、と東北の盆地・平野の果樹栽培を整理しよう。"}, {"id": "g136", "region": "j_tohoku", "scope": "japan", "cat": "plain", "q": "山形県の最上川下流に広がる日本海側有数の米どころである平野は？", "a": "庄内平野", "d": ["仙台平野", "津軽平野", "秋田平野", "越後平野", "石狩平野", "十勝平野", "筑紫平野"], "exp": "仙台平野（宮城県）・秋田平野・庄内平野など、東北地方は日本の米生産の約4分の1を占める穀倉地帯です。"}, {"id": "g137", "region": "j_tohoku", "scope": "japan", "cat": "ind_type", "q": "岩手県の「南部鉄器」や秋田県の「大館曲げわっぱ」、福島県の「会津塗」などのように受け継がれてきた産業は？", "a": "伝統的工芸品", "d": ["先端技術産業", "重化学工業", "石油化学工業", "臨海型工業", "臨空型工業", "情報通信産業", "基礎素材産業"], "exp": "東北地方は伝統的工芸品が多い地域の一つ。観光資源やブランド品として見直されています。"}, {"id": "g138", "region": "j_tohoku", "scope": "japan", "cat": "city", "q": "東北地方最大の都市で、東北新幹線や高速道路が集中する「杜の都」と呼ばれる政令指定都市は？", "a": "仙台市", "d": ["盛岡市", "秋田市", "山形市", "福島市", "青森市", "郡山市", "いわき市"], "exp": "東北地方唯一の政令指定都市。大企業の支社や行政機関が集まる地方中枢都市です。"}, {"id": "g139", "region": "j_tohoku", "scope": "japan", "cat": "mountain", "q": "青森県・秋田県にまたがり、ブナの原生林が残るとして世界自然遺産に登録されている山地は？", "a": "白神山地", "d": ["知床山地", "奥羽山脈", "出羽山地", "朝日山地", "飯豊山地", "北上高地", "紀伊山地"], "exp": "1993年に屋久島とともに日本で初めて世界自然遺産に登録されました。"}, {"id": "g140", "region": "j_tohoku", "scope": "japan", "cat": "disaster_measure", "q": "2011年の東日本大震災で大きな被害を受けた三陸沿岸部で、津波対策として進められている主な取り組みは？", "a": "防潮堤の建設と高台への集団移転", "d": ["地下河川の建設と海抜ゼロ地帯の干拓", "ため池の増設と輪中堤防の強化", "ダムの撤去と河口堰の開放", "火山砂防ダムの設置と避難壕の整備", "屋上緑化の推進と保水性舗装の整備", "防風林の伐採と平地への工場誘致", "人工島の埋め立てと海岸の直線化"], "exp": "防災・復興やハザードマップの活用は神奈川県入試でも意識される重要テーマです。"}, {"id": "g141", "region": "j_hokkaido", "scope": "japan", "cat": "climate_feat", "q": "北海道の気候の特徴として、本州以南と比べて特に顕著な点は？", "a": "亜寒帯に属し梅雨や台風の影響が少ない", "d": ["温帯に属し冬は温暖で夏に乾燥する", "年間を通して降水量が少なくため池が多い", "季節風の影響がなく1年中気温が一定である", "黒潮の影響で冬でも雪がほとんど降らない", "夏の高温多湿が厳しく二期作が行われる", "梅雨前線が長く停滞し6月の雨量が最も多い", "太平洋側よりも日本海側の方が年間を通じて温暖"], "exp": "北海道は冷帯（亜寒帯）に属し、本州のようなはっきりした梅雨がなく台風の上陸も少ないのが特徴です。"}, {"id": "g142", "region": "j_hokkaido", "scope": "japan", "cat": "agri_method", "q": "北海道東部の根釧台地のように、冷涼な気候を活かして乳牛を育て生乳などを生産する農業は？", "a": "酪農", "d": ["稲作単作", "混合農業", "促成栽培", "高冷地農業", "近郊農業", "焼畑農業", "二期作"], "exp": "冷涼で濃霧が発生しやすい根釧台地は稲作に向かないため、広大な牧草地を活かした日本最大の酪農地帯です。"}, {"id": "g143", "region": "j_hokkaido", "scope": "japan", "cat": "agri_method", "q": "北海道の十勝平野でさかんな、じゃがいも・てんさい・小麦・豆類などを毎年順番に植えて地力を保つ栽培法は？", "a": "輪作", "d": ["二期作", "二毛作", "単作", "促成栽培", "抑制栽培", "連作", "焼畑農業"], "exp": "同じ作物を同じ畑で作り続けることによる連作障害を防ぎ、土地の栄養バランスを保つ工夫です。"}, {"id": "g144", "region": "j_hokkaido", "scope": "japan", "cat": "plain", "q": "かつては稲作に不向きだった泥炭地を客土などで改良し、日本有数の米どころになった平野は？", "a": "石狩平野", "d": ["十勝平野", "根釧台地", "越後平野", "庄内平野", "仙台平野", "関東平野", "筑紫平野"], "exp": "別の場所から良い土を運んで混ぜる「客土」と耐冷品種の開発により、日本屈指の稲作地帯となりました。"}, {"id": "g145", "region": "j_hokkaido", "scope": "japan", "cat": "crop", "q": "北海道が全国1位の生産量を誇る、砂糖の原料となる畑作物は？", "a": "てんさい", "d": ["さとうきび", "じゃがいも", "とうもろこし", "だいず", "あずき", "そば", "たまねぎ"], "exp": "ビート（砂糖大根）とも呼ばれます。日本の砂糖原料は沖縄・鹿児島＝さとうきび、北海道＝てんさい。"}, {"id": "g146", "region": "j_hokkaido", "scope": "japan", "cat": "people", "q": "北海道の先住民族で、自然を敬う独自の文化や言語を持ち、2019年に法律で正式に先住民族と明記された人々は？", "a": "アイヌ民族", "d": ["琉球民族", "マオリ", "アボリジニ", "イヌイット", "ヤクート", "サーミ", "オロチョン"], "exp": "「ウポポイ（民族共生象徴空間）」の整備など、文化の保存・継承が進められています。"}, {"id": "g147", "region": "j_hokkaido", "scope": "japan", "cat": "peninsula", "q": "北海道東部にあり、流氷がもたらす豊かな生態系が評価されて世界自然遺産に登録されている半島は？", "a": "知床半島", "d": ["積丹半島", "渡島半島", "根室半島", "男鹿半島", "下北半島", "津軽半島", "能登半島"], "exp": "オホーツク海の流氷が運ぶプランクトンが海の生態系と陸の動物（ヒグマ・シマフクロウ等）をつないでいます。"}, {"id": "g148", "region": "j_hokkaido", "scope": "japan", "cat": "city", "q": "北海道の道庁所在地で、碁盤の目のような計画的な街並みを持ち、雪まつりでも知られる政令指定都市は？", "a": "札幌市", "d": ["旭川市", "函館市", "釧路市", "帯広市", "小樽市", "苫小牧市", "室蘭市"], "exp": "北海道の人口の約3分の1が集中する道内最大の都市です。"}, {"id": "g149", "region": "j_hokkaido", "scope": "japan", "cat": "history_role", "q": "明治時代に北海道の開拓と北方警備の両方を担うために置かれた兵士兼農民を何という？", "a": "屯田兵", "d": ["開拓使", "防人", "御家人", "地頭", "足軽", "義勇軍", "農兵隊"], "exp": "道内 米の制", "n": "あげまいのせい"}, {"id": "h11_11", "u": "11", "c": "person_earlymodern", "d": "飢饉対策としてさつまいもの栽培を広め、『甘藷記』を著した人物は誰か。", "t": "青木昆陽", "n": "あおきこんよう"}, {"id": "h11_12", "u": "11", "c": "person_earlymodern", "d": "18世紀中頃に老中となり、株仲間や商業の力を利用して財政の立て直しを図った人物は誰か。", "t": "田沼意次", "n": "たぬまおきつぐ"}, {"id": "h11_13", "u": "11", "c": "place_ancient", "d": "田沼意次が新田開発のために大規模な干拓事業を進めようとした千葉県の沼はどこか。", "t": "印旛沼", "n": "いんばぬま"}, {"id": "h11_14", "u": "11", "c": "soc_term", "d": "田沼意次の時代に、株仲間の許可などをめぐって政治家や商人の間で横行した不正は何か。", "t": "わいろ", "n": ""}, {"id": "h11_15", "u": "11", "c": "place_ancient", "d": "1783年に大噴火を起こし、天明の飢饉の一因となった群馬県と長野県の県境の火山は何か。", "t": "浅間山", "n": "あさまやま"}, {"id": "h11_16", "u": "11", "c": "uprising", "d": "浅間山の大噴火や冷害が原因となって、田沼意次の時代に東北地方を中心に起きた大飢饉は何か。", "t": "天明の飢饉", "n": "てんめいのききん"}, {"id": "h11_17", "u": "11", "c": "person_earlymodern", "d": "田沼意次のあとを受けて老中となり、寛政の改革を行った人物は誰か。", "t": "松平定信", "n": "まつだいらさだのぶ"}, {"id": "h11_18", "u": "11", "c": "reform_event", "d": "松平定信が行った、質素倹約や朱子学の重視など厳しすぎて反発を招いた改革は何か。", "t": "寛政の改革", "n": "かんせいのかいかく"}, {"id": "h11_19", "u": "11", "c": "arch_place", "d": "寛政の改革で朱子学を学ぶ幕府直轄の学校として江戸の湯島に整えられた施設は何か。", "t": "昌平坂学問所", "n": "しょうへいざかがくもんじょ"}, {"id": "h11_20", "u": "11", "c": "law_premodern", "d": "寛政の改革で旗本や御家人を救うため、札差からの借金を帳消しにした法令を何というか。", "t": "棄捐令", "n": "きえんれい"}, {"id": "h11_21", "u": "11", "c": "place_ancient", "d": "江戸時代後期に身分が低くても有能な家臣を登用し、藩政改革を成功させた西南雄藩の2つは何か。", "t": "薩摩藩と長州藩", "n": ""}, {"id": "h11_22", "u": "11", "c": "soc_term", "d": "貨幣経済が農村に広がった結果、土地を手放して地主から土地を借りて耕すようになった農民を何というか。", "t": "小作人", "n": "こさくにん"}, {"id": "h11_23", "u": "11", "c": "soc_term", "d": "農村で手放された土地を次々と買い集め、小作人から小作料を集めるようになった富裕層を何というか。", "t": "地主", "n": "じぬし"}, {"id": "h11_24", "u": "11", "c": "uprising", "d": "18世紀半ばから都市部で、米価の高騰などに怒った人々が米屋や大商人を襲った出来事を何というか。", "t": "打ちこわし", "n": ""}, {"id": "h11_25", "u": "11", "c": "uprising", "d": "江戸時代に農民が年貢の軽減や不正な役人の交代を領主に要求して起こした行動を何というか。", "t": "百姓一揆", "n": ""}, {"id": "h11_26", "u": "11", "c": "law_premodern", "d": "百姓一揆のとき     function decodeHistSaveCode(code) {
      const compact = String(code || '').replace(/\s+/g, '');

          const correct = parseInt(segs[2], 36);
          const wrong = parseInt(segs[3], 36);
          if ([idx, attempts, correct, wrong].some(n => Number.isNaN(n) || n < 0)) return null;
          const needsReview = segs.length === 5 ? segs[4] === '1' : wrong > 0;
          const q = QUESTIONS[idx];

        if (r && r.attempts > 0) {

          parts.push(`${idx.toString(36)}.${r.attempts.toString(36)}.${r.correct.toString(36)}.${r.wrong.toString(36)}.${rev}`);
        }
      });
      if (parts.length === 0) return 'T12K1:EMPTY';
      return 'T12K1:' + btoa(parts.join(','));
    }

    function decodeEngSaveCode(code) {
      const compact = String(code || '').replace(/\s+/g, '');
      const matched = compact.match(/T12K1:(EMPTY|[A-Za-z0-9+/=]+)/);
      if (!matched) return null;
      const body = matched[1];
      if (body === 'EMPTY') return { records: {}, sessions: [] };
      try {
        const decoded = atob(body);
        if (!decoded) return null;
        const records = {};
        for (const item of decoded.split(',')) {
          const segs = item.split('.');
          if (segs.length !== 5) return null;
          const idx = parseInt(segs[0], 36);
          const attempts = parseInt(segs[1], 36);
          const correct = parseInt(segs[2], 36);
          const wrong = parseInt(segs[3], 36);
          if ([idx, attempts, correct, wrong].some(n => Number.isNaN(n) || n < 0)) return null;
          const needsReview = segs[4] === '1';
          const w = WORDS[idx];
          if (!w) continue;
          records[w.n] = { attempts, correct, wrong, needsReview, lastWrongAt: wrong > 0 ? Date.now() : null };
        }
        return { records, sessions: [] };
      } catch (e) {
        return null;
      }
    }

    function readCookie(name) {
      try {
        const prefix = name + '=';
        const cookies = document.cookie ? document.cookie.split('; ') : [];
        for (const c of cookies) {
          if (c.startsWith(prefix)) return decodeURIComponent(c.slice(prefix.length));
        }
      } catch (e) {}
      return null;
    }

    function writeCookie(name, value) {
      try {
        document.cookie = `${name}=${encodeURIComponent(value)}; max-age=31536000; path=/; SameSite=Lax`;
      } catch (e) {}
    }

    function countTotalAttempts(data) {
      if (!data || !data.records) return 0;
      return Object.values(data.records).reduce((sum, r) => sum + (r.attempts || 0), 0);
    }

    function idbSave(dbName, data) {
      try {
        if (!window.indexedDB) return;
        const req = indexedDB.open(dbName, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const db = req.result;
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(data, 'latest');
          } catch (e) {}
        };
      } catch (e) {}
    }

    function idbLoadAndSync(dbName, subjectKey) {
      try {
        if (!window.indexedDB) return;
        const req = indexedDB.open(dbName, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const db = req.result;
            const tx = db.transaction(IDB_STORE, 'readonly');
            const getReq = tx.objectStore(IDB_STORE).get('latest');
            getReq.onsuccess = () => {
              const saved = getReq.result;
              const current = subjectKey === 'history' ? state.histProgress : subjectKey === 'english' ? state.engProgress : subjectKey === 'geo' ? state.geoProgress : state.histQaProgress;
              if (saved && countTotalAttempts(saved) > countTotalAttempts(current)) {
                if (subjectKey === 'history') state.histProgress = saved;
                else if (subjectKey === 'english') state.engProgress = saved;
                else if (subjectKey === 'geo') state.geoProgress = saved;
                else state.histQaProgress = saved;
                render();
              }
            };
          } catch (e) {}
        };
      } catch (e) {}
    }

    function loadSubjectProgress(storageKey, cookieKey, decodeFn, prefix) {
      const candidates = [];
      try {
        const hash = window.location.hash || '';
        if (hash.includes(prefix)) {
          const decoded = decodeFn(hash);
          if (decoded) candidates.push(decoded);
        }
      } catch (e) {}
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) {
          const parsed = JSON.parse(raw);
          const records = parsed.records && typeof parsed.records === 'object' ? parsed.records : {};
          candidates.push({ records, sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [] });
        }
      } catch (e) {}
      const cookieVal = readCookie(cookieKey);
      if (cookieVal) {
        const fromCookie = decodeFn(cookieVal);
        if (fromCookie) candidates.push(fromCookie);
      }
      if (candidates.length === 0) return { records: {}, sessions: [] };
      candidates.sort((a, b) => countTotalAttempts(b) - countTotalAttempts(a));
      return candidates[0];
    }

    function syncHashAll() {
      try {
        if (!window.history || !window.history.replaceState) return;
        const hCode = encodeHistSaveCode(state.histProgress);

        const gCode = encodeGeoSaveCode(state.geoProgress);
        const qCode = encodeHistQaSaveCode(state.histQaProgress);
        const parts = [];
        if (hCode !== 'JHQ1:EMPTY') parts.push('h=' + hCode);
        if (eCode !== 'T12K1:EMPTY') parts.push('e=' + eCode);
        if (gCode !== 'GEO1:EMPTY') parts.push('g=' + gCode);
        if (qCode !== 'HQA1:EMPTY') parts.push('q=' + qCode);
        const nextHash = parts.length > 0 ? '#' + parts.join('&') : (window.location.pathname + window.location.search);
        if (nextHash.length < 4000) {
          window.history.replaceState(null, '', nextHash);
        }
      } catch (e) {}
    }

    function syncCopyText(text, targetInputEl = null) {
      if (targetInputEl) {
        try {
          const wasReadOnly = targetInputEl.readOnly;
          targetInputEl.readOnly = false;
          targetInputEl.focus();
          targetInputEl.select();
          targetInputEl.setSelectionRange(0, 999999);
          const ok = document.execCommand('copy');
          targetInputEl.readOnly = wasReadOnly;
          if (ok) return true;
        } catch (e) {}
      }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.width = '2em';
        ta.style.height = '2em';
        ta.style.opacity = '0.01';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, 999999);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) return true;
      } catch (e) {}
      return false;
    }

        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return true;
      } catch (e) {
        return false;
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    function getHistUnitInfo(unitId) {
      return UNITS.find(u => u.id === unitId) || { id: unitId, name: unitId, short: unitId, color: 'bg-slate-100 text-slate-700 border-slate-200' };
    }

    function getHistRecord(qId) {
      const r = state.histProgress.records[qId];
      if (!r) return { attempts: 0, correct: 0, wrong: 0, needsReview: false, lastWrongAt: null };
      return {
        attempts: r.attempts || 0,
        correct: r.correct || 0,
        wrong: r.wrong || 0,
        needsReview: typeof r.needsReview === 'boolean' ? r.needsReview : (r.wrong || 0) > 0,
        lastWrongAt: r.lastWrongAt || null
      };
    }

    function getHistWrongIds() {
      return QUESTIONS.filter(q => getHistRecord(q.id).needsReview).map(q => q.id);
    }

    function getHistCandidates(mode) {
      if (mode === 'all') return [...QUESTIONS];
      if (mode === 'wrong') return QUESTIONS.filter(q => getHistRecord(q.id).needsReview);
      if (mode === 'unattempted') return QUESTIONS.filter(q => getHistRecord(q.id).attempts === 0);
      return QUESTIONS.filter(q => q.unit === mode);
    }

    function startHistQuiz(overrideMode = null) {
      const mode = overrideMode || state.histUnit;
      if (overrideMode) state.histUnit = overrideMode;
      const candidates = getHistCandidates(mode);
      if (candidates.length === 0) { showToast('対象となる問題がありません'); return; }
      const shuffled = shuffleArray(candidates);
      const limit = state.histLimit === 'all' ? shuffled.length : Math.min(Number(state.histLimit), shuffled.length);
      state.histQueue = shuffled.slice(0, limit);
      state.histIndex = 0;
      state.histInputYear = '';
      state.histShowHint = false;
      state.histLastResult = null;
      state.histResults = [];
      state.subject = 'history';
      state.activeTab = 'quiz';
      state.histPhase = 'playing';
      render();
    }

    function submitHistAnswer(isPass = false) {
      if (state.histPhase !== 'playing') return;
      const q = state.histQueue[state.histIndex];
      if (!q) return;
      if (!isPass && state.histInputYear.length < 4) {
        showToast('4桁の西暦年号を入力してください');
        return;
      }
      const userAnswer = isPass ? 'パス' : state.histInputYear;
      const isCorrect = !isPass && (userAnswer === q.year);
      const prev = getHistRecord(q.id);
      state.histProgress.records[q.id] = {
        attempts: prev.attempts + 1,
        correct: prev.correct + (isCorrect ? 1 : 0),
        wrong: prev.wrong + (isCorrect ? 0 : 1),
        needsReview: !isCorrect,
        lastWrongAt: isCorrect ? prev.lastWrongAt : Date.now()
      };
      saveHistProgress();
      state.histLastResult = {
        isCorrect,
        userAnswer,
        question: q,
        wasReview: prev.needsReview,
        wrongTotalAfter: getHistWrongIds().length
      };
      state.histResults.push({ id: q.id, userAnswer, isCorrect });
      state.histPhase = 'feedback';
      render();
    }

    function nextHistQuestion() {
      if (state.histPhase !== 'feedback') return;
      if (state.histIndex + 1 < state.histQueue.length) {
        state.histIndex += 1;
        state.histInputYear = '';
        state.histShowHint = false;
        state.histLastResult = null;
        state.histPhase = 'playing';
      } else {
        state.histPhase = 'summary';
      }
      render();
    }
